<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chauat Go</title>
<meta name="theme-color" content="#00A651">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chauat Go">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="แอปค้นหาสถานที่และสั่งอาหาร อ.ชะอวด">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'IBM Plex Sans Thai','Sarabun',-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--brand:#00A651;--brand-dark:#008C45;--brand-light:#E8F5E9;--accent:#FF6B35;--accent-dark:#E55A2B;--blue:#4A90D9;--blue-dark:#1565C0;--purple:#9C27B0;--bg:#F5F7FA;--surface:#FFFFFF;--text:#1A1A1A;--text-muted:#6B7280;--text-light:#9CA3AF;--border:rgba(0,0,0,.06);--shadow-sm:0 1px 3px rgba(0,0,0,.04);--shadow-md:0 4px 16px rgba(0,0,0,.06);--shadow-lg:0 12px 32px rgba(0,0,0,.08);--shadow-brand:0 8px 24px rgba(0,166,81,.28)}
html,body{width:100%;overflow-x:hidden;background:var(--bg)}
body{max-width:480px;margin:0 auto;min-height:100vh;color:var(--text);padding-bottom:calc(88px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.header{background:linear-gradient(135deg,#00A651 0%,#008C45 60%,#006B33 100%);padding:calc(16px + env(safe-area-inset-top)) 16px 20px;position:sticky;top:0;z-index:100;border-radius:0 0 24px 24px;box-shadow:0 8px 24px rgba(0,166,81,.24);overflow:hidden}
.header::before{content:'';position:absolute;top:-80px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%);border-radius:50%;pointer-events:none}
.header::after{content:'';position:absolute;bottom:-100px;left:-40px;width:180px;height:180px;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 65%);border-radius:50%;pointer-events:none}
.header-top{display:flex;align-items:center;gap:10px;width:100%;position:relative;z-index:2}
.location-badge{background:rgba(255,255,255,.22);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.28);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;cursor:pointer;transition:transform .2s}
.location-badge:active{transform:scale(.96)}
.location-badge .loc-text{color:#fff;font-size:11px;font-weight:700;line-height:1.2}
.location-badge .loc-sub{color:rgba(255,255,255,.85);font-size:9px;font-weight:600;margin-top:1px}
.search-bar{flex:1;background:rgba(255,255,255,.98);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,.08);min-width:0}
.search-bar input{border:none;outline:none;font-size:14px;font-weight:500;flex:1;color:var(--text);background:transparent;min-width:0;width:100%}
.search-bar input::placeholder{color:var(--text-light)}
.header-auth-row{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:12px;position:relative;z-index:2}
.header-auth-row:empty{display:none}
#install-btn,#login-btn,#logout-btn{background:rgba(255,255,255,.95);color:var(--brand);border:none;padding:9px 16px;border-radius:22px;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.12);transition:transform .15s}
#install-btn{display:none}
#logout-btn{display:none;color:var(--accent)}
#install-btn:active,#login-btn:active,#logout-btn:active{transform:scale(.95)}
#auth-btns{display:flex;gap:8px;align-items:center}
#user-display{display:none;color:#fff;font-size:12px;font-weight:700;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:9px 14px;background:rgba(255,255,255,.2);backdrop-filter:blur(12px);border-radius:22px;border:1px solid rgba(255,255,255,.28)}
.menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 12px;background:#fff;margin-bottom:8px}
.menu-item{text-align:center;cursor:pointer;padding:10px 4px;border-radius:16px;transition:transform .2s;user-select:none}
.menu-item:active{transform:scale(.94)}
.menu-icon{width:56px;height:56px;margin:0 auto 6px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 12px rgba(0,0,0,.08);transition:transform .25s}
.menu-item:active .menu-icon{transform:scale(1.08) rotate(-4deg)}
.menu-icon.food{background:linear-gradient(135deg,#FFF3E0,#FFE0B2)}
.menu-icon.shopping{background:linear-gradient(135deg,#E3F2FD,#BBDEFB)}
.menu-icon.dinein{background:linear-gradient(135deg,#FCE4EC,#F8BBD0)}
.menu-icon.express{background:linear-gradient(135deg,#F3E5F5,#E1BEE7)}
.menu-icon.ride{background:linear-gradient(135deg,#E1F5FE,#B3E5FC)}
.menu-icon.vehicle{background:linear-gradient(135deg,#FFF8E1,#FFECB3)}
.menu-icon.travel{background:linear-gradient(135deg,#E8F5E9,#C8E6C9)}
.menu-icon.map{background:linear-gradient(135deg,#FFEBEE,#FFCDD2)}
.menu-label{font-size:11px;color:var(--text);font-weight:800;line-height:1.2}
.section-header{padding:20px 16px 12px;display:flex;justify-content:space-between;align-items:center}
.section-title{font-size:17px;font-weight:900;color:var(--text);display:flex;align-items:center;gap:8px}
.section-more{color:var(--brand);font-size:13px;cursor:pointer;font-weight:800;padding:6px 12px;border-radius:20px;background:var(--brand-light);transition:transform .15s}
.section-more:active{transform:scale(.95)}
.shop-filters{display:flex;gap:8px;padding:14px 16px 10px;overflow-x:auto;background:#fff;border-bottom:1px solid rgba(0,0,0,.04)}
.shop-filters::-webkit-scrollbar{display:none}
.shop-filter{padding:9px 16px;border-radius:22px;font-size:13px;font-weight:800;white-space:nowrap;cursor:pointer;background:#fff;color:var(--text-muted);border:1.5px solid #E5E7EB;flex-shrink:0;transition:all .2s}
.shop-filter.active{background:linear-gradient(135deg,#00A651,#008C45);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(0,166,81,.3)}
.shop-filter:active{transform:scale(.96)}
.shop-grid{display:grid;grid-template-columns:1fr;gap:14px;padding:12px 16px 20px}
.shop-card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.06);cursor:pointer;transition:transform .2s;position:relative}
.shop-card:active{transform:scale(.98)}
.shop-card.closed{opacity:.85}
.shop-img{width:100%;height:160px;position:relative;overflow:hidden;background:linear-gradient(135deg,#f0f0f0,#e8e8e8);display:flex;align-items:center;justify-content:center;font-size:60px}
.shop-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.shop-card:active .shop-img img{transform:scale(1.05)}
.shop-card.closed .shop-img::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:1}
.shop-card.closed .shop-img{filter:grayscale(.8)}
.shop-status-badge{position:absolute;top:10px;left:10px;padding:5px 12px;border-radius:12px;font-size:11px;font-weight:900;color:#fff;backdrop-filter:blur(8px);box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:2}
.shop-status-badge.open{background:linear-gradient(135deg,#00A651,#008C45)}
.shop-status-badge.closed{background:linear-gradient(135deg,#6B7280,#4B5563)}
.shop-promo-badge{position:absolute;top:10px;right:10px;padding:5px 12px;border-radius:12px;font-size:11px;font-weight:900;color:#fff;background:linear-gradient(135deg,#FF6B35,#E55A2B);box-shadow:0 4px 12px rgba(255,107,53,.4);z-index:2;animation:promoPulse 2s infinite}
@keyframes promoPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.shop-info{padding:14px 16px 16px}
.shop-name{font-size:16px;font-weight:900;color:var(--text);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shop-meta{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--text-muted);font-weight:700;flex-wrap:wrap}
.shop-meta-item{display:inline-flex;align-items:center;gap:4px}
.shop-rating{color:#FFA500;font-weight:900}
.shop-distance{color:var(--text);font-weight:800}
.shop-category{background:#F3F4F6;color:var(--text-muted);padding:2px 8px;border-radius:8px;font-size:10.5px;font-weight:800}
.shop-promo-line{margin-top:10px;font-size:12.5px;color:#E65100;font-weight:900;background:linear-gradient(135deg,#FFF3E0,#FFE0B2);padding:8px 12px;border-radius:10px;display:flex;gap:6px;border-left:3px solid #FF6B35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shop-contact-line{margin-top:8px;padding-top:10px;border-top:1px dashed #E5E7EB;display:flex;align-items:center;justify-content:space-between;gap:8px}
.shop-contact-line .phone{font-size:12.5px;color:var(--blue-dark);font-weight:800}
.shop-contact-line .call-btn{background:linear-gradient(135deg,#00A651,#008C45);color:#fff;padding:6px 12px;border-radius:10px;font-size:11.5px;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;gap:4px;box-shadow:0 3px 8px rgba(0,166,81,.3);flex-shrink:0}
.shop-empty{text-align:center;padding:60px 24px;color:var(--text-light)}
.shop-empty .icon{font-size:64px;margin-bottom:12px;opacity:.5}
.shop-skeleton{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.shop-skeleton-img{height:160px;background:linear-gradient(90deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%);background-size:800px 100%;animation:shimmerShop 1.5s infinite}
.shop-skeleton-body{padding:14px 16px}
.shop-skeleton-line{height:14px;background:linear-gradient(90deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%);background-size:800px 100%;animation:shimmerShop 1.5s infinite;border-radius:6px;margin-bottom:10px}
.shop-skeleton-line.short{width:60%}
@keyframes shimmerShop{0%{background-position:-400px 0}100%{background-position:400px 0}}
/* ═══════════════════════════════════════════
   SHOP DETAIL SHEET (ร้านอาหาร)
   ═══════════════════════════════════════════ */
.shop-sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:9000;display:none;align-items:flex-end}
.shop-sheet-overlay.active{display:flex;animation:fadeIn .25s}
.shop-sheet{background:#fff;width:100%;max-width:480px;margin:0 auto;border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;animation:sheetUp .35s;padding-bottom:20px;position:relative}
.shop-hero{width:100%;height:200px;position:relative;overflow:hidden;background:linear-gradient(135deg,#f0f0f0,#e8e8e8);display:flex;align-items:center;justify-content:center;font-size:80px;border-radius:24px 24px 0 0}
.shop-hero img{width:100%;height:100%;object-fit:cover}
.shop-hero-back,.shop-hero-fav{position:absolute;top:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border:none;font-size:18px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:10;display:flex;align-items:center;justify-content:center}
.shop-hero-back{left:16px}
.shop-hero-fav{right:16px}
.shop-detail-header{padding:20px 20px 16px;border-bottom:1px solid #F3F4F6}
.shop-detail-header h2{font-size:22px;font-weight:900;margin-bottom:8px;line-height:1.25}
.shop-detail-status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:5px 12px;border-radius:12px;margin-bottom:10px}
.shop-detail-status.open{background:#E8F5E9;color:#2E7D32}
.shop-detail-status.closed{background:#F3F4F6;color:#6B7280}
.shop-detail-status .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.shop-detail-address{font-size:13px;color:var(--text-muted);line-height:1.5;margin-bottom:12px;font-weight:600}
.shop-detail-meta{display:flex;gap:16px;font-size:13px;font-weight:800;flex-wrap:wrap}
.shop-detail-tabs{display:flex;gap:6px;padding:0 20px;border-bottom:2px solid #F3F4F6;overflow-x:auto;background:#fff}
.shop-detail-tabs::-webkit-scrollbar{display:none}
.shop-detail-tab{padding:14px 12px;font-size:13.5px;font-weight:800;color:var(--text-light);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;flex-shrink:0}
.shop-detail-tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.shop-menus{padding:16px 20px 20px}
.menu-category{margin-bottom:24px}
.menu-category-title{font-size:16px;font-weight:900;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #F3F4F6}
.menu-item{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid #F9FAFB;cursor:pointer;align-items:flex-start;position:relative}
.menu-item.unavailable{opacity:.5;pointer-events:none}
.menu-info{flex:1;min-width:0}
.menu-name{font-size:14.5px;font-weight:800;margin-bottom:4px;line-height:1.35}
.menu-desc{font-size:12px;color:var(--text-muted);margin-bottom:6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.menu-price-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.menu-price{font-size:15px;font-weight:900}
.menu-price-promo{font-size:15px;color:#E65100;font-weight:900;background:#FFF3E0;padding:2px 8px;border-radius:8px}
.menu-promo-badge{position:absolute;top:8px;left:8px;background:linear-gradient(135deg,#FF6B35,#E55A2B);color:#fff;padding:3px 8px;border-radius:8px;font-size:10px;font-weight:900;z-index:2;box-shadow:0 2px 6px rgba(255,107,53,.4)}
.menu-img{width:90px;height:90px;border-radius:14px;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,#f0f0f0,#e8e8e8);display:flex;align-items:center;justify-content:center;font-size:32px;position:relative}
.menu-img img{width:100%;height:100%;object-fit:cover}
.menu-add-btn{position:absolute;bottom:-8px;right:-8px;width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#00A651,#008C45);color:#fff;border:3px solid #fff;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 4px 12px rgba(0,166,81,.4);z-index:3;display:flex;align-items:center;justify-content:center}

/* ═══════════════════════════════════════════
   PROMO HIGHLIGHT BOX
   ═══════════════════════════════════════════ */
.promo-highlight-box{background:linear-gradient(135deg,#FFF3E0,#FFE0B2,#FFCC80);border-radius:18px;padding:16px;margin-bottom:20px;box-shadow:0 6px 20px rgba(255,107,53,.2);border:2px solid #FFCC80;position:relative;overflow:hidden}
.promo-highlight-box::before{content:'🔥';position:absolute;top:-20px;right:-20px;font-size:100px;opacity:.15;pointer-events:none}
.promo-highlight-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;position:relative;z-index:1}
.promo-highlight-icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#FF6B35,#E55A2B);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 12px rgba(255,107,53,.4);animation:flamePulse 1.5s infinite}
@keyframes flamePulse{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.08) rotate(3deg)}}
.promo-highlight-title{font-size:17px;font-weight:900;color:#E65100;margin-bottom:2px}
.promo-highlight-sub{font-size:12.5px;font-weight:700;color:#8D4A00}
.promo-highlight-body{background:rgba(255,255,255,.6);border-radius:14px;padding:12px;position:relative;z-index:1}
.promo-best-item{display:flex;flex-direction:column;gap:4px}
.promo-best-label{font-size:10.5px;font-weight:900;color:#E65100;text-transform:uppercase}
.promo-best-name{font-size:14.5px;font-weight:900;margin-bottom:4px}
.promo-best-price{display:flex;align-items:center;gap:8px;font-weight:900}
.promo-best-price .old{font-size:13px;color:#999;text-decoration:line-through}
.promo-best-price .arrow{color:#E65100}
.promo-best-price .new{font-size:20px;color:#E65100}

/* ═══════════════════════════════════════════
   SHOP CONTACT ROW (เบอร์ร้าน)
   ═══════════════════════════════════════════ */
.shop-contact-row{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#F0F9FF,#E0F2FE);border:1.5px solid #BAE6FD;border-radius:14px;padding:12px 14px;margin-top:14px}
.shop-contact-info{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.shop-contact-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#4A90D9,#1565C0);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;color:#fff}
.shop-contact-label{font-size:11px;color:#1565C0;font-weight:800;text-transform:uppercase}
.shop-contact-phone{font-size:15px;color:#0D47A1;font-weight:900}
.shop-contact-btn{background:linear-gradient(135deg,#00A651,#008C45);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;gap:5px;box-shadow:0 4px 12px rgba(0,166,81,.3);white-space:nowrap;flex-shrink:0}

/* ═══════════════════════════════════════════
   FOOD CARDS (เดิม)
   ═══════════════════════════════════════════ */
.food-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 20px}
.food-card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.06);cursor:pointer;transition:transform .2s}
.food-card:active{transform:scale(.96)}
.food-img{width:100%;height:130px;position:relative;display:flex;align-items:center;justify-content:center;font-size:48px;background:#f0f0f0;overflow:hidden}
.food-img img{width:100%;height:100%;object-fit:cover;display:block}
.food-img.rest{background:linear-gradient(135deg,#667eea,#764ba2)}
.food-img.cafe{background:linear-gradient(135deg,#f093fb,#f5576c)}
.food-img.shop{background:linear-gradient(135deg,#4facfe,#00f2fe)}
.food-img.temple{background:linear-gradient(135deg,#FFD700,#FFA500)}
.food-info{padding:12px}
.food-name{font-size:13px;font-weight:800;color:var(--text);margin-bottom:6px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.food-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-muted);font-weight:700}
.food-rating{color:#FFA500;font-weight:800}
.food-price{font-size:13px;color:var(--brand);font-weight:900;margin-top:6px}

/* ═══════════════════════════════════════════
   BOTTOM NAV
   ═══════════════════════════════════════════ */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,.98);backdrop-filter:saturate(180%) blur(20px);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 8px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -4px 24px rgba(0,0,0,.06);z-index:99;border-radius:24px 24px 0 0}
.nav-item{text-align:center;padding:8px 4px;cursor:pointer;border-radius:14px;transition:background .2s}
.nav-item.active{background:rgba(0,166,81,.08)}
.nav-item.active .nav-icon-wrap{color:var(--brand);transform:translateY(-2px) scale(1.1)}
.nav-item.active .nav-label{color:var(--brand);font-weight:900}
.nav-icon-wrap{font-size:24px;color:var(--text-light);margin-bottom:2px;position:relative;display:inline-block;transition:transform .25s,color .2s}
.nav-badge{position:absolute;top:-6px;right:-12px;background:linear-gradient(135deg,#E91E63,#C2185B);color:#fff;font-size:10px;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;padding:0 5px;box-shadow:0 4px 10px rgba(233,30,99,.4);border:2px solid #fff}
.nav-label{font-size:11px;color:var(--text-light);font-weight:700}

/* ═══════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════ */
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:rgba(26,26,26,.95);backdrop-filter:blur(12px);color:#fff;padding:14px 24px;border-radius:24px;font-size:14px;font-weight:700;z-index:3000;display:none;max-width:88%;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.24)}
.toast.active{display:block;animation:toastIn .3s cubic-bezier(.4,0,.2,1)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ═══════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════ */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:1000;justify-content:center;align-items:flex-end}
.modal-overlay.active{display:flex;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-content{background:#fff;width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:28px 24px;max-height:92vh;overflow-y:auto;animation:sheetUp .35s cubic-bezier(.4,0,.2,1);box-shadow:0 -12px 40px rgba(0,0,0,.15)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* ═══════════════════════════════════════════
   SEARCH RESULTS
   ═══════════════════════════════════════════ */
.search-results{padding:0 16px 16px;display:none}
.search-results.active{display:block;animation:fadeIn .2s}
.search-result-item{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.search-result-img{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden;background:#f0f0f0}
.search-result-img img{width:100%;height:100%;object-fit:cover}
.search-result-img.rest{background:linear-gradient(135deg,#667eea,#764ba2)}
.search-result-img.cafe{background:linear-gradient(135deg,#f093fb,#f5576c)}
.search-result-img.shop{background:linear-gradient(135deg,#4facfe,#00f2fe)}
.search-result-img.temple{background:linear-gradient(135deg,#FFD700,#FFA500)}

/* ═══════════════════════════════════════════
   CATEGORY VIEW
   ═══════════════════════════════════════════ */
.category-view{display:none;padding:0 16px 16px}
.category-view.active{display:block;animation:fadeIn .2s}

/* ═══════════════════════════════════════════
   MAP PAGE
   ═══════════════════════════════════════════ */
.map-page{display:none;position:fixed;inset:0;background:#fff;z-index:500;flex-direction:column}
.map-page.active{display:flex}
.map-header-bar{background:linear-gradient(135deg,#00A651,#008C45);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.map-header-bar h3{font-size:16px;font-weight:900;flex:1}
.map-back-btn{background:rgba(255,255,255,.22);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.28);color:#fff;padding:8px 14px;border-radius:22px;font-size:13px;font-weight:800;cursor:pointer}
#main-map{flex:1;width:100%;height:100%;z-index:500}
.map-controls{position:absolute;bottom:90px;left:16px;right:16px;z-index:502;display:flex;gap:8px;flex-wrap:wrap}
.map-ctrl-btn{background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border:none;padding:10px 14px;border-radius:22px;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.map-info-panel{position:absolute;bottom:85px;left:12px;right:12px;z-index:502;background:rgba(255,255,255,.98);border-radius:20px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.18);display:none}
.map-info-panel.active{display:block}
.map-info-title{font-size:16px;font-weight:900;margin-bottom:10px}
.map-info-sub{font-size:13px;color:var(--text-muted);margin-bottom:6px;font-weight:600}
.map-info-cost{background:linear-gradient(135deg,#FFF3E0,#FFE0B2);padding:12px;border-radius:14px;margin:12px 0;border-left:4px solid var(--accent)}
.map-info-cost .cost-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:#8D4A00;font-weight:700}
.map-info-cost .cost-total{display:flex;justify-content:space-between;font-size:17px;font-weight:900;color:var(--brand);padding-top:8px;border-top:1px dashed #FFB74D;margin-top:6px}
.map-info-actions{display:flex;gap:8px;margin-top:12px}
.map-info-btn{flex:1;padding:12px;border-radius:14px;border:none;font-weight:900;font-size:13px;cursor:pointer}
.map-info-btn.primary{background:linear-gradient(135deg,#00A651,#008C45);color:#fff}
.map-info-btn.call-rider{background:linear-gradient(135deg,#FF6B35,#E55A2B);color:#fff}
.map-info-btn.secondary{background:#f0f0f0;color:#666}
.tambon-list{position:absolute;top:76px;right:12px;z-index:502;background:rgba(255,255,255,.98);border-radius:16px;padding:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);max-height:320px;overflow-y:auto;display:none;width:200px}
.tambon-list.active{display:block}
.tambon-item{padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;font-weight:700}
.tambon-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}

/* ═══════════════════════════════════════════
   ORDERS TAB
   ═══════════════════════════════════════════ */
.orders-tab,.messages-tab{padding:16px;display:none}
.orders-tab.active,.messages-tab.active{display:block;animation:fadeIn .2s}
.order-section-title{font-size:13px;font-weight:900;color:var(--text-muted);margin:18px 0 12px;text-transform:uppercase;letter-spacing:.5px}
.order-section-title:first-child{margin-top:0}
.order-card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(0,0,0,.06);display:flex;gap:14px;cursor:pointer;border-left:4px solid var(--brand);position:relative;transition:transform .15s}
.order-card:active{transform:scale(.98)}
.order-card.searching{border-left-color:#4A90D9;animation:cardPulse 2s infinite}
.order-card.pending{border-left-color:var(--accent)}
.order-card.accepted{border-left-color:#4A90D9}
.order-card.picked_up{border-left-color:#9C27B0}
.order-card.on_the_way{border-left-color:var(--brand);animation:cardPulse 2s infinite}
.order-card.done{border-left-color:#cbd5e0}
.order-card.cancelled{border-left-color:#cbd5e0;opacity:.6}
@keyframes cardPulse{0%,100%{box-shadow:0 4px 16px rgba(0,0,0,.06)}50%{box-shadow:0 0 0 4px rgba(0,166,81,.15),0 4px 16px rgba(0,0,0,.06)}}
.order-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;background:#f0f0f0}
.order-icon.searching{background:linear-gradient(135deg,#E3F2FD,#BBDEFB)}
.order-icon.pending{background:linear-gradient(135deg,#FFF3E0,#FFE0B2)}
.order-icon.accepted{background:linear-gradient(135deg,#E3F2FD,#BBDEFB)}
.order-icon.picked_up{background:linear-gradient(135deg,#F3E5F5,#E1BEE7)}
.order-icon.on_the_way{background:linear-gradient(135deg,#E8F5E9,#C8E6C9)}
.order-icon.done{background:linear-gradient(135deg,#F5F5F5,#E8E8E8)}
.order-icon.cancelled{background:#f0f0f0}
.order-info{flex:1;min-width:0}
.order-title{font-weight:900;font-size:14px;color:var(--text);margin-bottom:6px}
.order-detail{font-size:12px;color:var(--text-muted);margin-bottom:2px;font-weight:600}
.order-status{font-size:11px;padding:4px 10px;border-radius:12px;font-weight:900;margin-top:8px;display:inline-block}
.order-status.searching{background:#E3F2FD;color:#1565C0}
.order-status.pending{background:#FFF3E0;color:#E65100}
.order-status.accepted{background:#E3F2FD;color:#1565C0}
.order-status.picked_up{background:#F3E5F5;color:#6A1B9A}
.order-status.on_the_way{background:#E8F5E9;color:#2E7D32}
.order-status.done{background:#f0f0f0;color:#666}
.order-status.cancelled{background:#f0f0f0;color:#999}
.order-price-tag{color:var(--accent);font-weight:900;font-size:15px;margin-top:6px}

/* ═══════════════════════════════════════════
   CHAT
   ═══════════════════════════════════════════ */
.chat-container{display:flex;flex-direction:column;height:70vh;max-height:600px;margin:-28px -24px -28px}
.chat-header{background:linear-gradient(135deg,#00A651,#008C45);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
.chat-header .back-btn{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.28);color:#fff;width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer}
.chat-header .info{flex:1;min-width:0}
.chat-header .info .name{font-size:15px;font-weight:900}
.chat-header .info .status{font-size:11px;opacity:.9;font-weight:600;margin-top:1px}
.chat-messages{flex:1;overflow-y:auto;padding:18px 14px;background:#ECE5DD;display:flex;flex-direction:column;gap:10px}
.chat-msg{max-width:78%;padding:11px 15px;border-radius:18px;font-size:14px;line-height:1.5;word-wrap:break-word;animation:msgIn .3s;box-shadow:0 2px 6px rgba(0,0,0,.06);font-weight:500}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.chat-msg.sent{align-self:flex-end;background:linear-gradient(135deg,#DCF8C6,#C5E1A5);color:#1a1a1a;border-bottom-right-radius:4px}
.chat-msg.received{align-self:flex-start;background:#fff;color:#1a1a1a;border-bottom-left-radius:4px}
.chat-msg.system{align-self:center;background:rgba(0,0,0,.08);color:#666;font-size:12px;padding:7px 14px;border-radius:12px;max-width:90%;text-align:center;font-weight:700}
.chat-msg .msg-time{font-size:10px;color:#999;margin-top:5px;text-align:right;display:block;font-weight:700}
.chat-msg.sent .msg-time{color:#7B9E5C}
.chat-msg img{max-width:100%;border-radius:14px;display:block;cursor:pointer;margin-bottom:5px}
.chat-msg .img-label{font-size:11px;color:#666;margin-bottom:6px;font-weight:800}
.chat-input-area{display:flex;gap:10px;padding:12px 14px;background:#fff;align-items:center;border-top:1px solid rgba(0,0,0,.04)}
.chat-input-area input[type="text"]{flex:1;padding:13px 18px;border:2px solid #e8e8e8;border-radius:24px;outline:none;font-size:14px;font-weight:600}
.chat-attach-btn{width:42px;height:42px;border-radius:50%;background:#f0f0f0;border:none;font-size:18px;cursor:pointer;flex-shrink:0}
.chat-send-btn{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#00A651,#008C45);color:#fff;border:none;font-size:18px;cursor:pointer;flex-shrink:0;box-shadow:0 4px 12px rgba(0,166,81,.3)}
.chat-quick-actions{display:flex;gap:8px;padding:10px 14px;background:#f8f9fa;overflow-x:auto}
.chat-quick-actions::-webkit-scrollbar{display:none}
.quick-action{padding:9px 16px;background:#fff;border:1.5px solid #e8e8e8;border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap;cursor:pointer;color:#555}
.quick-action:active{background:#00A651;color:#fff;border-color:#00A651}

/* ═══════════════════════════════════════════
   EMPTY STATE
   ═══════════════════════════════════════════ */
.empty-state{text-align:center;padding:60px 24px;color:var(--text-light)}
.empty-state .icon{font-size:56px;margin-bottom:12px;opacity:.7}
#home-content.hidden{display:none}

/* ═══════════════════════════════════════════
   ORDER FORM
   ═══════════════════════════════════════════ */
.order-form-header{text-align:center;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.order-form-header .of-icon{font-size:56px;margin-bottom:10px}
.order-form-header .of-title{font-size:22px;font-weight:900;letter-spacing:-.3px}
.order-form-header .of-sub{font-size:13px;color:var(--text-muted);margin-top:6px;font-weight:600}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:800;color:var(--text);margin-bottom:8px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:14px 16px;border:2px solid #e8e8e8;border-radius:14px;font-size:14px;font-weight:600;outline:none;transition:border-color .2s,box-shadow .2s;font-family:inherit;background:#fafafa;color:var(--text)}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(0,166,81,.1)}
.form-group textarea{resize:vertical;min-height:90px}
.summary-box{background:linear-gradient(135deg,#F8F9FA,#F0F2F5);border-radius:16px;padding:16px;margin:16px 0}
.summary-row{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;font-weight:600}
.summary-row.total{border-top:2px solid var(--brand);margin-top:10px;padding-top:12px;font-size:20px;font-weight:900;color:var(--brand)}
.btn-full{width:100%;padding:16px;border-radius:16px;border:none;font-weight:900;font-size:15px;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
.btn-full:active{transform:scale(.98)}
.btn-full:disabled{opacity:.5;cursor:not-allowed}
.btn-green{background:linear-gradient(135deg,#00A651,#008C45);color:#fff;box-shadow:0 6px 16px rgba(0,166,81,.3)}
.btn-orange{background:linear-gradient(135deg,#FF6B35,#E55A2B);color:#fff;box-shadow:0 6px 16px rgba(255,107,53,.3)}
.btn-blue{background:linear-gradient(135deg,#4A90D9,#1565C0);color:#fff}
.btn-gray{background:#f5f5f5;color:#666}

/* ═══════════════════════════════════════════
   VEHICLE PICKER
   ═══════════════════════════════════════════ */
.vehicle-picker{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.vehicle-option{background:#fafafa;border:2px solid #e8e8e8;border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;transition:all .2s}
.vehicle-option.selected{background:linear-gradient(135deg,#E8F5E9,#C8E6C9);border-color:var(--brand);box-shadow:0 4px 12px rgba(0,166,81,.2)}
.vehicle-option:active{transform:scale(.96)}
.vehicle-option-icon{font-size:32px;margin-bottom:4px}
.vehicle-option-name{font-size:13px;font-weight:900;color:var(--text);margin-bottom:2px}
.vehicle-option-price{font-size:11px;font-weight:800;color:var(--brand)}
.vehicle-card{display:flex;gap:14px;padding:16px;background:#fff;border-radius:16px;margin-bottom:12px;border:1.5px solid #E5E7EB;align-items:center}
.vehicle-icon{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#F8F9FA,#F0F2F5);display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0}
.vehicle-info{flex:1;min-width:0}
.vehicle-name{font-size:15px;font-weight:900;margin-bottom:2px}
.vehicle-desc{font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:6px}
.vehicle-services{display:flex;flex-wrap:wrap;gap:4px}
.service-chip{font-size:10px;padding:3px 8px;border-radius:8px;background:#E8F5E9;color:#2E7D32;font-weight:800}
.vehicle-price{text-align:right;flex-shrink:0}
.vehicle-price .base{font-size:20px;font-weight:900;color:var(--brand);line-height:1}
.vehicle-price .per{font-size:11px;color:var(--text-muted);font-weight:800;margin-top:4px}

/* ═══════════════════════════════════════════
   RIDER FOUND BOX
   ═══════════════════════════════════════════ */
.rider-found-box{background:linear-gradient(135deg,#E8F5E9,#C8E6C9);border-radius:16px;padding:14px;margin-bottom:16px;display:flex;align-items:center;gap:14px;border-left:4px solid var(--brand)}
.rider-found-box .rf-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#FF6B35,#E55A2B);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:900;flex-shrink:0}
.rider-found-box .rf-name{font-weight:900;font-size:15px;color:#1B5E20}
.rider-found-box .rf-vehicle{font-size:12px;color:var(--text-muted);font-weight:600;margin-top:2px}
.rider-found-box .rf-rating{font-size:12px;color:#FFA500;font-weight:800;margin-top:2px}

/* ═══════════════════════════════════════════
   TIMELINE
   ═══════════════════════════════════════════ */
.timeline{background:#fff;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.timeline-item{display:flex;gap:14px;padding:10px 0;opacity:.35}
.timeline-item.active{opacity:1}
.timeline-item.done{opacity:1}
.timeline-dot{width:24px;height:24px;border-radius:50%;background:#e0e0e0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:900}
.timeline-item.done .timeline-dot{background:linear-gradient(135deg,#00A651,#008C45);box-shadow:0 0 0 4px rgba(0,166,81,.15)}
.timeline-item.active .timeline-dot{background:linear-gradient(135deg,#FF6B35,#E55A2B);box-shadow:0 0 0 4px rgba(255,107,53,.2);animation:dotPulse 1.5s infinite}
@keyframes dotPulse{0%,100%{box-shadow:0 0 0 4px rgba(255,107,53,.2)}50%{box-shadow:0 0 0 10px rgba(255,107,53,.05)}}
.timeline-text{font-size:13px;color:var(--text-muted);line-height:1.4;padding-top:3px;font-weight:600}
.timeline-item.done .timeline-text,.timeline-item.active .timeline-text{color:var(--text);font-weight:800}

/* ═══════════════════════════════════════════
   TRACKING MAP
   ═══════════════════════════════════════════ */
.tracking-box{background:#fff;border-radius:18px;padding:14px;margin-bottom:16px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.tracking-status-bar{display:flex;align-items:center;gap:12px;padding:12px 14px;background:linear-gradient(135deg,#00A651,#008C45);border-radius:14px;color:#fff;margin-bottom:12px}
.tracking-status-bar.going-to-shop{background:linear-gradient(135deg,#4A90D9,#1565C0)}
.tracking-status-bar.picked-up{background:linear-gradient(135deg,#9C27B0,#6A1B9A)}
.tracking-status-bar.arriving{background:linear-gradient(135deg,#FF6B35,#E55A2B);animation:arrivalPulse 1.5s infinite}
@keyframes arrivalPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,53,.4)}50%{box-shadow:0 0 0 8px rgba(255,107,53,0)}}
.tracking-avatar{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;flex-shrink:0}
.tracking-info{flex:1;min-width:0}
.tracking-info .name{font-size:14px;font-weight:900;margin-bottom:2px}
.tracking-info .status{font-size:12px;opacity:.95;font-weight:600}
.tracking-dist{text-align:right;flex-shrink:0}
.tracking-dist .km{font-size:20px;font-weight:900;line-height:1}
.tracking-dist .eta{font-size:11px;opacity:.85;margin-top:3px;font-weight:700}
#tracking-map{width:100%;height:220px;border-radius:14px;background:#f0f0f0;z-index:1}
.tracking-updated{font-size:10px;color:#999;text-align:right;margin-top:8px;font-weight:700}

/* ═══════════════════════════════════════════
   RATING
   ═══════════════════════════════════════════ */
.rating-star{font-size:42px;cursor:pointer;filter:grayscale(1);opacity:.3;transition:.15s;display:inline-block}
.rating-star.active{filter:grayscale(0);opacity:1;transform:scale(1.15);filter:drop-shadow(0 4px 8px rgba(255,193,7,.5))}

/* ═══════════════════════════════════════════
   LEVEL BADGE
   ═══════════════════════════════════════════ */
.level-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:900;vertical-align:middle}
.level-elite{background:linear-gradient(135deg,#FFD700,#FFA000);color:#fff}
.level-gold{background:linear-gradient(135deg,#FFC107,#FF8F00);color:#fff}
.level-silver{background:linear-gradient(135deg,#B0BEC5,#78909C);color:#fff}
.level-bronze{background:linear-gradient(135deg,#BCAAA4,#8D6E63);color:#fff}
.level-new{background:#E3F2FD;color:#1565C0}

/* ═══════════════════════════════════════════
   PDPA / LOC POPUP
   ═══════════════════════════════════════════ */
.pdpa-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.pdpa-overlay.hidden{display:none}
.pdpa-content{background:#fff;border-radius:24px;padding:32px 26px;width:100%;max-width:420px;text-align:center;animation:sheetUp .4s}
.pdpa-content .pdpa-icon{font-size:64px;margin-bottom:12px}
.pdpa-content h3{font-size:22px;margin-bottom:12px;font-weight:900}
.pdpa-content p{font-size:13.5px;color:var(--text-muted);line-height:1.65;margin-bottom:20px;text-align:left;font-weight:500}
.pdpa-content a{color:var(--brand);text-decoration:underline;font-weight:800}
.pdpa-btn{width:100%;padding:16px;border-radius:14px;border:none;font-weight:900;font-size:15px;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.pdpa-accept{background:linear-gradient(135deg,#00A651,#008C45);color:#fff}
.pdpa-read{background:#f5f5f5;color:#666}
.loc-popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px}
.loc-popup-overlay.hidden{display:none}
.loc-popup-content{background:#fff;border-radius:24px;padding:32px 26px;width:100%;max-width:400px;text-align:center;animation:sheetUp .4s}
.loc-popup-content .loc-icon-big{font-size:64px;margin-bottom:12px}
.loc-popup-content h3{font-size:20px;margin-bottom:10px;font-weight:900}

function jsStr(s) { return String(s ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\n/g,'\\n').replace(/\r/g,'\\r'); }
function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('active'); setTimeout(() => t.classList.remove('active'), 2500); }
function store(key, val) { try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; } }
function calcDist(lat1,lon1,lat2,lon2) { const R=6371,r=Math.PI/180,dLat=(lat2-lat1)*r,dLon=(lon2-lon1)*r,a=Math.sin(dLat/2)**2+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }
function formatDist(km) { return `${Math.max(0.1,km).toFixed(1)} กม.`; }

function loginWithLine() {
  const state = crypto.getRandomValues(new Uint32Array(4)).join('-');
  try { sessionStorage.setItem('line_login_state', state); } catch (e) {}
  const ruri = window.location.origin + window.location.pathname + '?line_callback=1';
  window.location.href = 'https://access.line.me/oauth2/v2.1/authorize?response_type=code&client_id=' + LINE_CONFIG.channelId + '&redirect_uri=' + encodeURIComponent(ruri) + '&state=' + state + '&scope=profile%20openid%20email';
}
async function handleLineCallback() {
  const p = new URLSearchParams(window.location.search);
  const code = p.get('code'), state = p.get('state');
  let saved = null;
  try { saved = sessionStorage.getItem('line_login_state'); } catch (e) {}
  window.history.replaceState({}, document.title, window.location.pathname);
  if (!code || !state || state !== saved) { showToast('❌ LINE ไม่ถูกต้อง'); return; }
  if (!LINE_CONFIG.authEndpoint) { showToast('⚠️ ยังไม่ได้ตั้งค่า LINE'); return; }
  try {
    showToast('🔄 กำลังเข้าสู่ระบบ LINE...');
    const ruri = window.location.origin + window.location.pathname + '?line_callback=1';
    const res = await fetch(LINE_CONFIG.authEndpoint, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ code, redirectUri: ruri }) });
    if (!res.ok) throw new Error('auth failed');
    const { customToken } = await res.json();
    await auth.signInWithCustomToken(customToken);
    try { sessionStorage.removeItem('line_login_state'); } catch (e) {}
    showToast('✅ LINE สำเร็จ!');
  } catch (e) { showToast('❌ LINE ไม่สำเร็จ'); }
}
if (new URLSearchParams(window.location.search).has('line_callback')) handleLineCallback();

  await signupWithEmail(email, password, name, phone);
}

async function saveOrderToFirestore(o) {
  if (!currentUser) { showToast('⚠️ เข้าสู่ระบบก่อน'); showLoginModal(); return false; }
  try {
    const ref = await db.collection('orders').add({
      userId: currentUser.uid,
      userName: currentUser.displayName || currentUser.email || '',
      userEmail: currentUser.email || '',
      userPhone: o.userPhone || '',
      type: o.type,
      serviceType: o.type,
      vehicleType: o.vehicleType || 'motorcycle',
      vehicleName: o.vehicleName || 'มอเตอร์ไซค์',
      title: o.title,
      items: o.items,
      price: o.price,
      fare: o.fare,
      basePrice: o.basePrice || 0,
      perKmPrice: o.perKmPrice || 8,
      serviceFee: 0,
      total: o.total,
      distance: o.distance,
      address: o.address,
      note: o.note,
      pickupLat: o.pickupLat || 0,
      pickupLng: o.pickupLng || 0,
      status: 'searching',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    o.id = ref.id;
    return true;
  } catch (e) {
    console.error(e);
    showToast('❌ บันทึกไม่สำเร็จ');
    return false;
  }
}

function subscribeToUserOrders() {
  if (!currentUser) return;
  unsubscribeOrders();
  ordersUnsubscribe = db.collection('orders')
    .where('userId','==',currentUser.uid)
    .orderBy('createdAt','desc').limit(20)
    .onSnapshot(snap => {
      orders = snap.docs.map(d => {
        const x = d.data();
        const dist = x.distance || 0;
        return {
          id: d.id, type: x.type || 'food',
          vehicleType: x.vehicleType || 'motorcycle',
          vehicleName: x.vehicleName || 'มอเตอร์ไซค์',
          title: x.title || '', items: x.items || '',
          price: x.price || 0, fare: x.fare || 0,
          basePrice: x.basePrice || 0,
          serviceFee: x.serviceFee || 0, total: x.total || 0,
          distance: dist, distStr: formatDist(dist),
          timeMin: Math.max(3, Math.ceil(dist*4)),
          address: x.address || '', note: x.note || '',
          userPhone: x.userPhone || '',
          rider: x.rider || null, riderId: x.riderId || null,
          status: x.status || 'searching',
          rated: x.rated || false,
          ratingStars: x.ratingStars || 0,
          completedAt: x.completedAt || null,
          createdAt: x.createdAt ? x.createdAt.toDate() : new Date()
        };
      });
      renderOrders();
      updateOrdersBadge();
    }, err => {
      console.error('[orders]', err);
      if (err.code === 'failed-precondition') showToast('⚠️ ต้องสร้าง Index');
      else showToast('⚠️ โหลดออเดอร์ไม่ได้');
    });
}
function unsubscribeOrders() {
  if (ordersUnsubscribe) {
    try { ordersUnsubscribe(); } catch (e) {}
    ordersUnsubscribe = null;
  }
}

  if (!navigator.geolocation) { showToast('⚠️ เบราว์เซอร์ไม่รองรับ GPS'); closeLocPopup(); return; }
  showToast('📡 กำลังขอตำแหน่ง...');
  navigator.geolocation.getCurrentPosition(
    pos => {
      applyLocation(pos);
      store('chauatgo_location_granted','true');
      if (mainMap) mainMap.setView([USER_LOC.lat, USER_LOC.lng], 15);
      closeLocPopup();
      showToast('✅ อนุญาตตำแหน่งสำเร็จ!');
    },
    err => {
      showToast(({1:'⚠️ ปฏิเสธตำแหน่ง',2:'⚠️ ตำแหน่งใช้ไม่ได้',3:'⏱️ หมดเวลา'})[err.code] || '⚠️ เข้าถึงไม่ได้');
      closeLocPopup();
    },
    { enableHighAccuracy:true, timeout:10000, maximumAge:0 }
  );
}
function skipLocation() {
  store('chauatgo_location_granted','false');
  closeLocPopup();
  showToast('⏭️ ข้ามตำแหน่ง');
}
function closeLocPopup() {
  document.getElementById('loc-popup-overlay').classList.add('hidden');
}

// ═══════════════════════════════════════════
//  CARDS (PLACES)
// ═══════════════════════════════════════════
function createCard(p, type) {
  const dist = formatDist(p.dist);
  return `<div class="food-card" onclick="openDetail(${p.id})">
    <div class="food-img ${type}">${imgHtml(p)}</div>
    <div class="food-info">
      <div class="food-name">${esc(p.n)}</div>
      <div class="food-meta">
        <span class="food-rating">⭐ ${p.rating}</span>
        <span>📍 ${dist}</span>
      </div>
      <div class="food-price">${esc(p.price || 'สอบถาม')}</div>
    </div>
  </div>`;
}
function renderCards() {
  const top = (c, n) => withDist(PLACES.filter(p => p.c === c)).slice(0, n);
  document.getElementById('restaurant-grid').innerHTML = top('restaurant', 4).map(p => createCard(p, 'rest')).join('');
  document.getElementById('convenience-grid').innerHTML = top('convenience', 2).map(p => createCard(p, 'shop')).join('');
  document.getElementById('cafe-grid').innerHTML = top('cafe', 2).map(p => createCard(p, 'cafe')).join('');
}
function showListView(title, items) {
  document.getElementById('category-title').innerText = title;
  document.getElementById('category-grid').innerHTML = items.length
    ? items.map(p => createCard(p, typeClass(p.c))).join('')
    : '<div class="empty-state"><div class="icon">📭</div><div>ไม่มีข้อมูล</div></div>';
  document.getElementById('home-content').classList.add('hidden');
  document.getElementById('category-view').classList.add('active');
  window.scrollTo(0, 0);
}
function filterCategory(cat) {
  const map = {
    travel: { label:'🚗 เดินทางและขนส่ง', cats:['transport','gas'] }
  };
  const cfg = map[cat]; if (!cfg) return;
  const items = withDist(PLACES.filter(p => cfg.cats.includes(p.c)));
  showListView(`${cfg.label} (${items.length})`, items);
}
function showAllCategories(category) {
  const labels = {
    restaurant: '🍽️ ร้านอาหารทั้งหมด',
    convenience: '🏪 ร้านสะดวกซื้อทั้งหมด',
    cafe: '☕ คาเฟ่ทั้งหมด'
  };
  showListView(labels[category] || 'ทั้งหมด', withDist(PLACES.filter(p => p.c === category)));
}
function closeCategoryView() {
  document.getElementById('category-view').classList.remove('active');
  document.getElementById('home-content').classList.remove('hidden');
}

// ═══════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════
function doSearch(query) {
  const box = document.getElementById('search-results');
  const q = query.trim().toLowerCase();
  if (q.length < 2) { box.classList.remove('active'); box.innerHTML = ''; return; }
  const results = withDist(PLACES.filter(p => p.n.toLowerCase().includes(q)));
  box.classList.add('active');
  if (!results.length) {
    box.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><div>ไม่พบ "${esc(query)}"</div></div>`;
    return;
  }
  box.innerHTML = `<div style="padding:10px 0;font-size:14px;color:#666;font-weight:600">พบ ${results.length} สถานที่</div>` +
    results.map(p => `<div class="search-result-item" onclick="openDetail(${p.id})">
      <div class="search-result-img ${typeClass(p.c)}">${imgHtml(p)}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.n)}</div>
        <div style="font-size:12px;color:#888">${CAT_ICON[p.c] || ''} ${CAT_LABEL[p.c] || esc(p.c)} • 📍 ${formatDist(p.dist)}</div>
        <div style="font-size:12px;color:#00A651;font-weight:600">${esc(p.price || 'สอบถาม')}</div>
      </div>
    </div>`).join('');
}

// ═══════════════════════════════════════════
//  DETAIL MODAL (PLACES)
// ═══════════════════════════════════════════
function openDetail(id) {
  const p = PLACES[id];
  if (!p) return;
  const dist = formatDist(calcDist(USER_LOC.lat, USER_LOC.lng, p.lat, p.lng));
  const canRider = p.c === 'restaurant' || p.c === 'cafe';
  document.getElementById('modal-body').innerHTML = `
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:60px">${CAT_ICON[p.c] || '📍'}</div>
      <div style="font-size:20px;font-weight:900;margin-top:10px">${esc(p.n)}</div>
      <div style="font-size:13px;color:#888;margin-top:5px">${CAT_LABEL[p.c]} • ⭐ ${p.rating}</div>
      <div style="font-size:14px;color:#00A651;font-weight:800;margin-top:5px">📍 ${dist}</div>
    </div>
    <div style="background:#f8f9fa;padding:15px;border-radius:12px;margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="color:#888">ราคา/เวลา</span>
        <strong style="color:#00A651">${esc(p.price || 'สอบถาม')}</strong>
      </div>
      <div style="display:flex;justify-content:space-between">
        <span style="color:#888">ระยะทาง</span>
        <strong>${dist}</strong>
      </div>
    </div>
    <button class="btn-full btn-green" onclick="pinAsDestination(${p.id})">📍 ปักหมุด</button>
    ${canRider ? `<button class="btn-full btn-orange" onclick="callRiderToPlace(${p.id})">🛵 เรียกไรเดอร์</button>` : ''}
    <button class="btn-full btn-blue" onclick="pinAsDestination(${p.id})">🗺️ ดูแผนที่</button>
    <button class="btn-full btn-gray" onclick="closeModal()">ปิด</button>`;
  document.getElementById('modal').classList.add('active');
}
function whenMapReady(fn) {
  openMapPage();
  const t = setInterval(() => { if (mainMap) { clearInterval(t); fn(); } }, 100);
}
function pinAsDestination(id) {
  const p = PLACES[id];
  closeModal();
  whenMapReady(() => { mainMap.setView([p.lat, p.lng], 16); setDestination(p.lat, p.lng, p.n, p.c); });
}
function callRiderToPlace(id) {
  const p = PLACES[id];
  closeModal();
  whenMapReady(() => { setDestination(p.lat, p.lng, p.n, p.c); callRiderFromMap(); });
}
</script>
<script>
// ═══════════════════════════════════════════
//  SHOPS (Firestore — merchants)
// ═══════════════════════════════════════════
function subscribeShops() {
  if (shopsUnsub) shopsUnsub();
  shopsUnsub = db.collection('merchants').where('verified','==',true).onSnapshot(snap => {
    allShops = snap.docs.map(d => {
      const x = d.data();
      return {
        uid: d.id,
        ...x,
        distance: (x.lat && x.lng && USER_LOC.granted) ? calcDist(USER_LOC.lat, USER_LOC.lng, x.lat, x.lng) : 999
      };
    });
    renderShops();
    preloadAllShopMenus();
  }, err => console.warn('[shops]', err));
}

function getShopBestPromo(shopId) {
  const menus = shopMenusCache[shopId] || [];
  let best = { percent: 0, name: '', count: 0 };
  menus.forEach(m => {
    if (m.promo && m.promo.active && m.promo.percent > 0) {
      best.count++;
      if (m.promo.percent > best.percent) {
        best.percent = m.promo.percent;
        best.name = m.name;
      }
    }
  });
  return best;
}

async function ensureShopMenusLoaded(shopId) {
  if (shopMenusCache[shopId]) return shopMenusCache[shopId];
  try {
    const snap = await db.collection('menus').doc(shopId).collection('items').get();
    const menus = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    shopMenusCache[shopId] = menus;
    return menus;
  } catch (e) { console.error('[menus]', e); return []; }
}

async function preloadAllShopMenus() {
  if (!allShops.length) return;
  await Promise.all(allShops.slice(0, 10).map(s => ensureShopMenusLoaded(s.uid)));
  renderShops();
}

function filterShops(filter) {
  currentShopFilter = filter;
  document.querySelectorAll('.shop-filter').forEach(el => el.classList.toggle('active', el.dataset.filter === filter));
  renderShops();
}

function renderShops() {
  const grid = document.getElementById('shop-grid');
  if (!grid) return;
  let filtered = allShops;
  if (currentShopFilter === 'restaurant') filtered = filtered.filter(s => s.category === 'restaurant');
  else if (currentShopFilter === 'cafe') filtered = filtered.filter(s => s.category === 'cafe');
  else if (currentShopFilter === 'promo') filtered = filtered.filter(s => getShopBestPromo(s.uid).percent > 0);
  filtered = [...filtered].sort((a, b) => {
    if (a.isOpen !== b.isOpen) return b.isOpen ? 1 : -1;
    return a.distance - b.distance;
  });
  if (!filtered.length) {
    grid.innerHTML = `<div class="shop-empty"><div class="icon">🏪</div><h3>ยังไม่มีร้านในหมวดนี้</h3><p>ลองเปลี่ยนหมวดหมู่ หรือรอร้านค้าใหม่เข้าร่วม</p></div>`;
    return;
  }
  grid.innerHTML = filtered.map(shop => renderShopCard(shop)).join('');
}

function renderShopCard(shop) {
  const dist = shop.distance < 999 ? shop.distance.toFixed(1) + ' กม.' : '—';
  const rating = shop.rating || 0;
  const ratingStr = rating > 0 ? rating.toFixed(1) : 'ใหม่';
  const categoryLabel = shop.category === 'cafe' ? '☕ คาเฟ่' : '🍽️ ร้านอาหาร';
  const statusClass = shop.isOpen ? 'open' : 'closed';
  const statusText = shop.isOpen ? '🟢 เปิด' : '⚫ ปิด';
  const bestPromo = getShopBestPromo(shop.uid);
  const hasPromo = bestPromo.percent > 0;
  let promoText = '';
  if (hasPromo) {
    promoText = bestPromo.count === 1 
      ? `ลด ${bestPromo.percent}% - ${bestPromo.name}` 
      : `ลดสูงสุด ${bestPromo.percent}% (${bestPromo.count} เมนู)`;
  }
  const imageHtml = shop.image 
    ? `<img src="${esc(shop.image)}" loading="lazy" onerror="this.style.display='none';this.parentElement.innerHTML='🏪';">` 
    : '🏪';
  const contactHtml = shop.shopPhone ? `
    <div class="shop-contact-line">
      <span class="phone">📞 ${esc(shop.shopPhone)}</span>
      <a href="tel:${esc(shop.shopPhone)}" class="call-btn" onclick="event.stopPropagation()">📞 โทร</a>
    </div>` : '';
  return `<div class="shop-card ${shop.isOpen?'':'closed'}" onclick="openShopDetail('${esc(shop.uid)}')">
    <div class="shop-img">
      ${imageHtml}
      <div class="shop-status-badge ${statusClass}">${statusText}</div>
      ${hasPromo ? `<div class="shop-promo-badge">🔥 -${bestPromo.percent}%</div>` : ''}
    </div>
    <div class="shop-info">
      <div class="shop-name">${esc(shop.name || 'ร้านค้า')}</div>
      <div class="shop-meta">
        <span class="shop-meta-item shop-rating">⭐ ${ratingStr}</span>
        <span class="shop-meta-item shop-distance">📍 ${dist}</span>
        <span class="shop-category">${categoryLabel}</span>
      </div>
      ${promoText ? `<div class="shop-promo-line">🔥 ${esc(promoText)}</div>` : ''}
      ${contactHtml}
    </div>
  </div>`;
}

function loadNearbyShops() { showToast('🔄 รีเฟรช...'); subscribeShops(); }

// ═══════════════════════════════════════════
//  SHOP DETAIL SHEET
// ═══════════════════════════════════════════
function openShopDetail(shopId) {
  currentSheetShopId = shopId;
  let sheet = document.getElementById('shop-sheet-overlay');
  if (!sheet) {
    sheet = document.createElement('div');
    sheet.id = 'shop-sheet-overlay';
    sheet.className = 'shop-sheet-overlay';
    sheet.onclick = e => { if (e.target === sheet) closeShopDetail(); };
    sheet.innerHTML = '<div class="shop-sheet" id="shop-sheet"></div>';
    document.body.appendChild(sheet);
  }
  sheet.classList.add('active');
  document.getElementById('shop-sheet').innerHTML = '<div style="padding:40px 20px;text-align:center;color:#999"><div style="font-size:40px;margin-bottom:12px">⏳</div><div style="font-weight:700">กำลังโหลดเมนู...</div></div>';
  loadShopMenus(shopId);
}

function closeShopDetail() {
  const sheet = document.getElementById('shop-sheet-overlay');
  if (sheet) sheet.classList.remove('active');
  currentSheetShopId = null;
}

async function loadShopMenus(shopId) {
  try {
    const shop = allShops.find(s => s.uid === shopId);
    if (!shop) { showToast('❌ ไม่พบร้าน'); closeShopDetail(); return; }
    const menusSnap = await db.collection('menus').doc(shopId).collection('items').get();
    const menus = menusSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    shopMenusCache[shopId] = menus;
    renderShopSheet(shop, menus);
  } catch (e) {
    console.error(e);
    document.getElementById('shop-sheet').innerHTML = '<div style="padding:40px 20px;text-align:center;color:#E53935"><div style="font-size:40px;margin-bottom:12px">⚠️</div><div style="font-weight:700">โหลดเมนูไม่สำเร็จ</div><button onclick="closeShopDetail()" style="margin-top:16px;padding:10px 24px;border-radius:12px;background:#00A651;color:#fff;border:none;font-weight:800">ปิด</button></div>';
  }
}

function renderShopSheet(shop, menus) {
  const dist = shop.distance < 999 ? shop.distance.toFixed(1) + ' กม.' : '—';
  const ratingStr = shop.rating > 0 ? shop.rating.toFixed(1) : 'ใหม่';
  const categories = {};
  menus.forEach(m => {
    const cat = m.category || 'อื่นๆ';
    if (!categories[cat]) categories[cat] = [];
    categories[cat].push(m);
  });
  const promoMenus = menus.filter(m => m.promo && m.promo.active && m.promo.percent > 0);
  let bestPromo = 0, bestPromoMenu = null;
  promoMenus.forEach(m => {
    if (m.promo.percent > bestPromo) { bestPromo = m.promo.percent; bestPromoMenu = m; }
  });
  const imageHtml = shop.image 
    ? `<img src="${esc(shop.image)}" onerror="this.style.display='none';this.parentElement.innerHTML='🏪';">` 
    : '🏪';
  const statusHtml = shop.isOpen 
    ? '<div class="shop-detail-status open"><span class="dot"></span> เปิดอยู่</div>' 
    : '<div class="shop-detail-status closed"><span class="dot"></span> ร้านปิด</div>';
  const contactRow = shop.shopPhone ? `
    <div class="shop-contact-row">
      <div class="shop-contact-info">
        <div class="shop-contact-icon">📞</div>
        <div>
          <div class="shop-contact-label">เบอร์ติดต่อร้าน</div>
          <div class="shop-contact-phone">${esc(shop.shopPhone)}</div>
        </div>
      </div>
      <a href="tel:${esc(shop.shopPhone)}" class="shop-contact-btn" onclick="event.stopPropagation()">📞 โทรหาร้าน</a>
    </div>` : '';
  const promoBox = bestPromo > 0 ? `
    <div class="promo-highlight-box">
      <div class="promo-highlight-header">
        <div class="promo-highlight-icon">🔥</div>
        <div>
          <div class="promo-highlight-title">โปรโมชั่นพิเศษ!</div>
          <div class="promo-highlight-sub">${promoMenus.length} เมนูลดราคา · สูงสุด ${bestPromo}%</div>
        </div>
      </div>
      <div class="promo-highlight-body">
        ${bestPromoMenu ? `<div class="promo-best-item">
          <div class="promo-best-label">🔥 ยอดนิยม</div>
          <div class="promo-best-name">${esc(bestPromoMenu.name)}</div>
          <div class="promo-best-price">
            <span class="old">฿${Number(bestPromoMenu.price).toFixed(0)}</span>
            <span class="arrow">→</span>
            <span class="new">฿${(Number(bestPromoMenu.price)*(1-bestPromoMenu.promo.percent/100)).toFixed(0)}</span>
          </div>
        </div>` : ''}
      </div>
    </div>` : '';
  const menuItemsHtml = Object.entries(categories).map(([cat, items]) => `
    <div class="menu-category">
      <div class="menu-category-title">${esc(cat)}</div>
      ${items.map(m => renderMenuItem(m)).join('')}
    </div>
  `).join('');
  const cartCount = cart.items.reduce((s,i) => s+i.qty, 0);
  const cartTotal = cart.items.reduce((s,i) => s+(i.price*i.qty), 0);
  const cartFab = cartCount > 0 && cart.shopId === shop.uid ? `
    <div style="padding:0 20px 20px">
      <button class="btn-full btn-green" onclick="openCart()" style="margin:0">
        🛒 ดูตะกร้า (${cartCount}) — ฿${cartTotal.toLocaleString('th-TH')}
      </button>
    </div>` : '';
  document.getElementById('shop-sheet').innerHTML = `
    <div class="shop-hero">
      ${imageHtml}
      <button class="shop-hero-back" onclick="closeShopDetail()">←</button>
    </div>
    <div class="shop-detail-header">
      ${statusHtml}
      <h2>${esc(shop.name)}</h2>
      <div class="shop-detail-address">📍 ${esc(shop.address || '')}</div>
      <div class="shop-detail-meta">
        <span class="item">⭐ ${ratingStr}</span>
        <span class="item">📍 ${dist}</span>
        <span class="item">${shop.category === 'cafe' ? '☕ คาเฟ่' : '🍽️ ร้านอาหาร'}</span>
      </div>
      ${contactRow}
    </div>
    <div class="shop-detail-tabs">
      <div class="shop-detail-tab active">🍽️ เมนู</div>
      ${bestPromo > 0 ? '<div class="shop-detail-tab">🔥 โปรโมชั่น</div>' : ''}
    </div>
    <div class="shop-menus">
      ${promoBox}
      ${menus.length === 0 ? '<div style="text-align:center;padding:40px 20px;color:#999">ยังไม่มีเมนู</div>' : menuItemsHtml}
    </div>
    ${cartFab}
  `;
}

function renderMenuItem(menu) {
  const hasPromo = menu.promo && menu.promo.active && menu.promo.percent > 0;
  const promoPercent = hasPromo ? menu.promo.percent : 0;
  const originalPrice = Number(menu.price || 0);
  const finalPrice = hasPromo ? Math.round(originalPrice*(1-promoPercent/100)) : originalPrice;
  const available = menu.available !== false;
  const imageHtml = menu.image 
    ? `<img src="${esc(menu.image)}" loading="lazy" onerror="this.style.display='none';this.parentElement.innerHTML='${menu.emoji||'🍽️'}';" alt="${esc(menu.name)}">` 
    : (menu.emoji || '🍽️');
  return `<div class="menu-item ${!available?'unavailable':''}">
    <div class="menu-img">
      ${imageHtml}
      ${available ? `<button class="menu-add-btn" onclick="event.stopPropagation();addToCart('${esc(menu.id)}','${jsStr(menu.name)}',${finalPrice})">+</button>` : ''}
      ${hasPromo ? `<div class="menu-promo-badge">-${promoPercent}%</div>` : ''}
    </div>
    <div class="menu-info">
      <div class="menu-name">${esc(menu.name)}</div>
      ${menu.description ? `<div class="menu-desc">${esc(menu.description)}</div>` : ''}
      <div class="menu-price-row">
        ${hasPromo 
          ? `<span class="menu-price-promo">฿${finalPrice}</span><span style="font-size:12px;color:#999;text-decoration:line-through;font-weight:700">฿${originalPrice}</span>` 
          : `<span class="menu-price">฿${originalPrice}</span>`}
      </div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════
//  CART
// ═══════════════════════════════════════════
function addToCart(menuId, name, price) {
  if (!currentSheetShopId) return;
  const shop = allShops.find(s => s.uid === currentSheetShopId);
  if (!shop) return;
  if (!shop.isOpen) { showToast('⚠️ ร้านปิดอยู่'); return; }
  if (cart.shopId && cart.shopId !== shop.uid) {
    if (!confirm('คุณมีสินค้าในตะกร้าจากร้านอื่น — ล้างตะกร้าและเริ่มใหม่?')) return;
    cart = { shopId: shop.uid, shopName: shop.name, items: [] };
  }
  cart.shopId = shop.uid;
  cart.shopName = shop.name;
  const existing = cart.items.find(i => i.menuId === menuId);
  if (existing) existing.qty++;
  else cart.items.push({ menuId, name, price, qty: 1 });
  showToast(`✅ เพิ่ม ${name} ลงตะกร้า`);
  updateCartFab();
}

function updateCartFab() {
  if (!currentSheetShopId) return;
  const shop = allShops.find(s => s.uid === currentSheetShopId);
  if (!shop) return;
  const count = cart.items.reduce((s,i) => s+i.qty, 0);
  const total = cart.items.reduce((s,i) => s+(i.price*i.qty), 0);
  const existing = document.getElementById('cart-fab-wrap');
  if (count > 0 && cart.shopId === shop.uid) {
    const html = `<button class="btn-full btn-green" onclick="openCart()" style="margin:0">🛒 ดูตะกร้า (${count}) — ฿${total.toLocaleString('th-TH')}</button>`;
    if (existing) existing.innerHTML = html;
    else {
      const div = document.createElement('div');
      div.id = 'cart-fab-wrap';
      div.style.cssText = 'padding:0 20px 20px';
      div.innerHTML = html;
      document.getElementById('shop-sheet').appendChild(div);
    }
  } else if (existing) {
    existing.remove();
  }
}

function openCart() {
  if (!cart.items.length) { showToast('ตะกร้าว่าง'); return; }
  const total = cart.items.reduce((s,i) => s+(i.price*i.qty), 0);
  const itemRows = cart.items.map((item, idx) => `
    <div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0f0f0">
      <div style="flex:1;min-width:0">
        <div style="font-weight:800;font-size:14px">${esc(item.name)}</div>
        <div style="font-size:13px;color:#00A651;font-weight:900;margin-top:2px">฿${item.price}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button onclick="updateCartQty(${idx},-1)" style="width:32px;height:32px;border-radius:50%;border:2px solid #00A651;background:#fff;color:#00A651;font-weight:900;font-size:16px">−</button>
        <span style="min-width:24px;text-align:center;font-weight:900">${item.qty}</span>
        <button onclick="updateCartQty(${idx},1)" style="width:32px;height:32px;border-radius:50%;border:none;background:#00A651;color:#fff;font-weight:900;font-size:16px">+</button>
      </div>
    </div>`).join('');
  document.getElementById('modal-body').innerHTML = `
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:50px;margin-bottom:8px">🛒</div>
      <h2 style="font-size:20px;font-weight:900">ตะกร้าของคุณ</h2>
      <div style="font-size:13px;color:#888;margin-top:4px;font-weight:600">จาก ${esc(cart.shopName)}</div>
    </div>
    <div style="margin-bottom:16px">${itemRows}</div>
    <div class="summary-box">
      <div class="summary-row total"><span>💰 รวมทั้งหมด</span><span>฿${total.toLocaleString('th-TH')}</span></div>
    </div>
    <button class="btn-full btn-green" onclick="proceedToCheckout()">✅ ดำเนินการสั่งซื้อ</button>
    <button class="btn-full btn-gray" onclick="clearCart()">🗑️ ล้างตะกร้า</button>
    <button class="btn-full btn-gray" onclick="closeModal()">ปิด</button>
  `;
  document.getElementById('modal').classList.add('active');
}

function updateCartQty(idx, delta) {
  const item = cart.items[idx];
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart.items.splice(idx, 1);
  if (!cart.items.length) { 
    cart = { shopId:null, shopName:null, items:[] }; 
    closeModal(); 
    showToast('ตะกร้าว่าง'); 
    return; 
  }
  openCart();
  updateCartFab();
}

function clearCart() {
  if (!confirm('ล้างตะกร้า?')) return;
  cart = { shopId:null, shopName:null, items:[] };
  closeModal();
  closeShopDetail();
  showToast('🗑️ ล้างตะกร้าแล้ว');
}

function proceedToCheckout() {
  if (!currentUser) { showToast('⚠️ เข้าสู่ระบบก่อน'); showLoginModal(); return; }
  if (!cart.items.length) return;
  const shop = allShops.find(s => s.uid === cart.shopId);
  if (!shop) return showToast('❌ ไม่พบร้าน');
  closeModal();
  const total = cart.items.reduce((s,i) => s+(i.price*i.qty), 0);
  const itemsText = cart.items.map(i => `${i.name} × ${i.qty}`).join('\n');
  openOrderFormFromCart(shop, itemsText, total);
}
</script>
<script>

function selectVehicle(key) {
  currentOrderDraft.vehicleType = key;
  document.querySelectorAll('.vehicle-option').forEach(el => el.classList.toggle('selected', el.dataset.vehicle === key));
}

function getPlacesForType(type) {
  const cats = type === 'food' || type === 'dinein' 
    ? ['restaurant','cafe'] 
    : type === 'shopping' 
    ? ['convenience','shop','market'] 
    : ['convenience','shop','market','restaurant','cafe','postal'];
  return withDist(PLACES.filter(p => cats.includes(p.c)));
}

function goToOrderSummary() {
  const d = currentOrderDraft; 
  if (!d) return;
  const cfg = ORDER_CONFIGS[d.type];
  const placeId = document.getElementById('of-place-select').value;
  const items = document.getElementById('of-items').value.trim();
  const price = Math.max(0, parseFloat(document.getElementById('of-price').value) || 0);
  const phone = document.getElementById('of-phone').value.trim();
  const address = document.getElementById('of-address').value.trim();
  const note = document.getElementById('of-note').value.trim();
  
  if (!placeId) return showToast('⚠️ เลือกร้าน');
  if (!items) return showToast('⚠️ กรอกรายการ');
  if (!phone) return showToast('⚠️ กรอกเบอร์');
  if (!address) return showToast('⚠️ กรอกที่อยู่');
  
  const place = PLACES[+placeId]; 
  if (!place) return showToast('⚠️ ไม่พบ');
  
  const dist = calcDist(USER_LOC.lat, USER_LOC.lng, place.lat, place.lng);
  const vehicle = VEHICLE_CONFIG[d.vehicleType || 'motorcycle'];
  const extraKm = Math.max(0, dist - 1);
  const extraFee = Math.ceil(extraKm) * vehicle.perKm;
  const fare = { base: vehicle.basePrice, perKm: vehicle.perKm, extra: extraFee, total: vehicle.basePrice + extraFee };
  const goods = (d.type === 'express' || d.type === 'ride') ? 0 : price;
  const total = goods + fare.total;
  const timeMin = Math.max(3, Math.ceil(dist * 4));
  currentOrderDraft = { 
    ...d, 
    placeName: place.n, 
    pickupLat: place.lat, 
    pickupLng: place.lng, 
    items, price, phone, address, note, dist, fare, total, timeMin 
  };
  renderSummaryPage(vehicle);
}

function confirmOrderWithPDPA() {
  const cb = document.getElementById('order-pdpa-consent');
  if (cb && !cb.checked) return showToast('⚠️ ยอมรับก่อน');
  confirmOrderAndCallRider();
}

function checkOrderRateLimit() {
  const now = Date.now();
  orderTimestamps = orderTimestamps.filter(t => now - t < ORDER_RATE_LIMIT.windowMs);
  if (orderTimestamps.length >= ORDER_RATE_LIMIT.max) {
    const waitSec = Math.ceil((ORDER_RATE_LIMIT.windowMs - (now - orderTimestamps[0])) / 1000);
    showToast(`⚠️ รอ ${waitSec} วินาที`); 
    return false;
  }
  return true;
}

async function confirmOrderAndCallRider() {
  if (orderSubmitting) return;
  if (!checkOrderRateLimit()) return;
  const d = currentOrderDraft; 
  if (!d || !d.fare) return;
  if (!currentUser) { showToast('⚠️ เข้าสู่ระบบก่อน'); showLoginModal(); return; }
  
  orderSubmitting = true;
  const btn = document.getElementById('confirm-order-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ กำลังบันทึก...'; }
  showToast('🔍 กำลังค้นหาไรเดอร์...');
  
  const vehicle = VEHICLE_CONFIG[d.vehicleType || 'motorcycle'];
  const order = {
    type: d.type, 
    serviceType: d.type,
    vehicleType: d.vehicleType || 'motorcycle',
    vehicleName: vehicle.shortName,
    title: d.placeName, 
    items: d.items, 
    price: d.price,
    fare: d.fare.total, 
    basePrice: d.fare.base, 
    perKmPrice: d.fare.perKm,
    serviceFee: 0, 
    total: d.total,
    distance: d.dist, 
    address: d.address, 
    note: d.note,
    userPhone: d.phone, 
    pickupLat: d.pickupLat, 
    pickupLng: d.pickupLng,
    status: 'searching'
  };
  orderTimestamps.push(Date.now());
  const ok = await saveOrderToFirestore(order);
  orderSubmitting = false;
  
  if (ok) {
    cart = { shopId:null, shopName:null, items:[] };
    closeModal(); 
    closeShopDetail();
    switchTab('orders', document.querySelectorAll('.nav-item')[1]);
    showToast('✅ สั่งสำเร็จ!');
  } else {
    if (btn) { btn.disabled = false; btn.innerHTML = '✅ ยืนยัน'; }
    showToast('❌ ไม่สำเร็จ');
  }
}

<script>
// ═══════════════════════════════════════════
//  ORDERS UI
// ═══════════════════════════════════════════
function updateOrdersBadge() {
  const badge = document.getElementById('orders-badge');
  if (!badge) return;
  const active = orders.filter(o => ['searching','pending','accepted','picked_up','on_the_way','cooking','ready'].includes(o.status)).length;
  const unrated = orders.filter(o => o.status === 'done' && o.rider && !o.rated).length;
  if (active > 0) {
    badge.innerText = active;
    badge.style.background = 'linear-gradient(135deg,#E91E63,#C2185B)';
    badge.style.display = 'flex';
  } else if (unrated > 0) {
    badge.innerText = '⭐';
    badge.style.background = 'linear-gradient(135deg,#FFB300,#FF8F00)';
    badge.style.display = 'flex';
  } else {
    badge.style.display = 'none';
  }
}

function renderOrders() {
  const active = orders.filter(o => ['searching','pending','accepted','picked_up','on_the_way','cooking','ready'].includes(o.status));
  const done = orders.filter(o => !['searching','pending','accepted','picked_up','on_the_way','cooking','ready'].includes(o.status));
  document.getElementById('active-orders').innerHTML = active.map(o => renderOrderCard(o)).join('');
  document.getElementById('done-orders').innerHTML = done.map(o => renderOrderCard(o)).join('');
  document.getElementById('empty-orders').style.display = orders.length ? 'none' : 'block';
}

const STATUS_LABELS = {
  searching:'⏳ กำลังหาไรเดอร์', 
  pending:'🔔 รอไรเดอร์รับงาน',

  picked_up:'📦 ไรเดอร์รับของแล้ว',

function renderOrderCard(o) {

    searching:'⏳', pending:'🔔', accepted:'🛵', picked_up:'📦',

      ${['accepted','picked_up','on_the_way','cooking','ready','done'].includes(o.status) ? `<div class="timeline-item done"><div class="timeline-dot">✓</div><div><div class="timeline-text">ไรเดอร์รับงาน</div></div></div>` : ''}
      ${['cooking','ready','picked_up','on_the_way','done'].includes(o.status) ? `<div class="timeline-item done"><div class="timeline-dot">✓</div><div><div class="timeline-text">ร้านกำลังทำ</div></div></div>` : ''}
      ${['picked_up','on_the_way','done'].includes(o.status) ? `<div class="timeline-item done"><div class="timeline-dot">✓</div><div><div class="timeline-text">ไรเดอร์รับของแล้ว</div></div></div>` : ''}
      ${['on_the_way','done'].includes(o.status) ? `<div class="timeline-item done"><div class="timeline-dot">✓</div><div><div class="timeline-text">กำลังมาส่ง</div></div></div>` : ''}
      ${o.status === 'done' ? `<div class="timeline-item done"><div class="timeline-dot">✓</div><div><div class="timeline-text">ส่งสำเร็จ</div></div></div>` : ''}

      <div style="font-size:12px;color:#888;margin-bottom:4px">🏪 ต้นทาง</div>

    </div>
    
    <div style="background:#f8f9fa;padding:15px;border-radius:12px;margin-bottom:15px">
      <div style="font-size:12px;color:#888;margin-bottom:4px">🏠 ปลายทาง</div>
      <div style="font-size:14px;font-weight:600">${esc(o.address)}</div>
      <div style="font-size:12px;color:#888;margin-top:8px">📍 ${o.distStr} • ⏱️ ~${o.timeMin} นาที</div>

    <div style="background:linear-gradient(135deg,#E1F5FE,#B3E5FC);padding:12px;border-radius:12px;margin-bottom:15px;display:flex;align-items:center;gap:10px">
      <div style="font-size:28px">${vehicle.icon}</div>
      <div>
        <div style="font-size:11px;color:#0277BD;font-weight:800;text-transform:uppercase">ประเภทรถ</div>
        <div style="font-size:14px;font-weight:900;color:#01579B;margin-top:2px">${vehicle.shortName}</div>

      <div class="summary-row"><span class="label">🚩 ค่าบริการเริ่มต้น</span><span class="value">${o.basePrice || 0}฿</span></div>

    </div>

    ${o.status === 'done' && o.rider && !o.rated ? `
      <button class="btn-full" style="background:linear-gradient(135deg,#FFB300,#FF8F00);color:#fff" onclick="closeModal();setTimeout(()=>openRatingDialog('${jsStr(o.id)}'),200)">
        ⭐ ให้คะแนนไรเดอร์
      </button>` : ''}
    ${o.status === 'done' && o.rated ? `
      <div style="background:#E8F5E9;padding:12px;border-radius:12px;text-align:center;margin-bottom:10px">
        <div style="font-size:20px;margin-bottom:4px">${'⭐'.repeat(o.ratingStars || 5)}</div>
        <div style="font-size:12px;color:#2E7D32;font-weight:800">ให้คะแนนแล้ว</div>
      </div>` : ''}
    
    <button class="btn-full btn-green" onclick="closeModal();setTimeout(()=>openChat('${jsStr(o.id)}'),200)">💬 แชทกับไรเดอร์</button>

  `;
  document.getElementById('modal').classList.add('active');
  
  if (showTracking) setTimeout(() => startTracking(o), 200);
