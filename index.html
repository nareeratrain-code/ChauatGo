// ═══════════════════════════════════════════
//  LIVE TRACKING
// ═══════════════════════════════════════════
function startTracking(o) {
  const mapEl = document.getElementById('tracking-map');
  if (!mapEl) return;
  if (trackingMap) { try { trackingMap.remove(); } catch(e) {} trackingMap = null; }
  if (trackingUnsub) { try { trackingUnsub(); } catch(e) {} trackingUnsub = null; }
  
  trackingMap = L.map('tracking-map', { zoomControl:false, attributionControl:false }).setView([USER_LOC.lat, USER_LOC.lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19 }).addTo(trackingMap);
  
  if (o.pickupLat && o.pickupLng) {
    L.marker([o.pickupLat, o.pickupLng], { 
      icon: L.divIcon({ 
        html:'<div style="background:#FF6B35;border:3px solid white;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.3)">🏪</div>', 
        iconSize:[32,32], iconAnchor:[16,16] 
      }) 
    }).addTo(trackingMap);
  }
  
  L.marker([USER_LOC.lat, USER_LOC.lng], { 
    icon: L.divIcon({ 
      html:'<div style="background:#4A90D9;border:3px solid white;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px">🏠</div>', 
      iconSize:[32,32], iconAnchor:[16,16] 
    }) 
  }).addTo(trackingMap);
  
  trackingRiderMarker = L.marker([USER_LOC.lat, USER_LOC.lng], { 
    icon: L.divIcon({ 
      html:'<div style="background:#00A651;border:3px solid white;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 0 4px rgba(0,166,81,.3)">🛵</div>', 
      iconSize:[40,40], iconAnchor:[20,20] 
    }) 
  }).addTo(trackingMap);
  
  trackingUnsub = db.collection('rider_locations').doc(o.riderId).onSnapshot(snap => {
    if (!snap.exists) return;
    const loc = snap.data();
    if (!loc.lat || !loc.lng) return;
    trackingRiderMarker.setLatLng([loc.lat, loc.lng]);
    let target = o.status === 'accepted' ? { lat:o.pickupLat, lng:o.pickupLng } : { lat:USER_LOC.lat, lng:USER_LOC.lng };
    if (target.lat && target.lng) {
      const dist = calcDist(loc.lat, loc.lng, target.lat, target.lng);
      document.getElementById('tracking-dist-km').textContent = formatDist(dist);
      document.getElementById('tracking-dist-eta').textContent = `~${Math.max(1, Math.ceil(dist*3))} นาที`;
      const bounds = L.latLngBounds([[loc.lat,loc.lng],[target.lat,target.lng]]);
      trackingMap.fitBounds(bounds, { padding:[40,40] });
    }
    document.getElementById('tracking-updated').textContent = `อัพเดต: ${new Date().toLocaleTimeString('th-TH')}`;
  });
}

function closeModal() {
  if (trackingUnsub) { try { trackingUnsub(); } catch(e) {} trackingUnsub = null; }
  if (trackingMap) { try { trackingMap.remove(); } catch(e) {} trackingMap = null; }
  if (chatUnsub) { try { chatUnsub(); } catch(e) {} chatUnsub = null; }
  document.getElementById('modal').classList.remove('active');
}

<script>
// ═══════════════════════════════════════════
//  CHAT SYSTEM
// ═══════════════════════════════════════════
function openChat(orderId) {
  let order;
  if (orderId && typeof orderId === 'string') order = orders.find(o => String(o.id) === String(orderId));
  else order = orders.find(o => o.rider && ['pending','accepted','picked_up','on_the_way','cooking','ready'].includes(o.status));
  if (!order) { showToast('⚠️ ยังไม่มีออเดอร์ที่มอบหมาย'); return; }
  
  currentChatOrderId = order.id;
  const rider = order.rider || { name:'ไรเดอร์', avatar:'?' };
  
  document.getElementById('modal-body').innerHTML = `
    <div class="chat-container">
      <div class="chat-header">
        <button class="back-btn" onclick="closeChat()">←</button>
        <div class="info">
          <div class="name">${esc(rider.name)}</div>
          <div class="status">🛵 ไรเดอร์ Chauat Go</div>
        </div>
      </div>
      <div class="chat-quick-actions">
        <div class="quick-action" onclick="sendQuickMessage('ผมอยู่หน้าร้านแล้วครับ 🏪')">📍 ถึงร้านแล้ว</div>
        <div class="quick-action" onclick="sendQuickMessage('กำลังออกจากร้านครับ 🛵')">🚀 ออกร้าน</div>
        <div class="quick-action" onclick="sendQuickMessage('ใกล้ถึงแล้วครับ 🏠')">🏠 ใกล้ถึง</div>
        <div class="quick-action" onclick="sendQuickMessage('ขอบคุณครับ 🙏')">🙏 ขอบคุณ</div>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="chat-msg system">เริ่มการสนทนาแล้ว</div>
      </div>
      <div class="chat-input-area">
        <button class="chat-attach-btn" onclick="document.getElementById('chat-image-input').click()">📷</button>
        <input type="text" id="chat-input-text" placeholder="พิมพ์ข้อความ..." onkeypress="if(event.key==='Enter')sendChatMessage()">
        <button class="chat-send-btn" onclick="sendChatMessage()">➤</button>
      </div>
      <input type="file" id="chat-image-input" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
    </div>`;
  document.getElementById('modal').classList.add('active');
  ensureChatDoc(order);
  setTimeout(() => { 
    subscribeChatMessages(order.id); 
    setTimeout(scrollChatToBottom, 200); 
  }, 100);
}

function closeChat() { closeModal(); }

async function ensureChatDoc(order) {
  try {
    const ref = db.collection('chats').doc(order.id);
    const doc = await ref.get();
    if (!doc.exists) {
      await ref.set({
        orderId: order.id, 
        userId: order.userId, 
        userName: order.userName || '',
        riderId: order.riderId, 
        riderName: order.rider?.name || '',
        lastMessage: '', 
        lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
        unreadByUser: 0, 
        unreadByRider: 0,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
  } catch (e) { console.error(e); }
}

function subscribeChatMessages(orderId) {
  if (chatUnsub) chatUnsub();
  chatUnsub = db.collection('chats').doc(orderId).collection('messages')
    .orderBy('createdAt','asc').limit(200)
    .onSnapshot(snap => {
      const c = document.getElementById('chat-messages');
      if (!c) return;
      if (snap.empty) { 
        c.innerHTML = '<div class="chat-msg system">เริ่มการสนทนาแล้ว</div>'; 
        return; 
      }
      c.innerHTML = snap.docs.map(d => {
        const m = d.data();
        const t = m.createdAt?.toDate ? m.createdAt.toDate() : new Date();
        const ts = t.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
        if (m.sender === 'system') return `<div class="chat-msg system">${esc(m.text||'')}</div>`;
        const isSent = m.sender === 'user';
        let content = '';
        if (m.imageUrl) content += `<div class="img-label">📸 รูป</div><img src="${esc(m.imageUrl)}" onclick="openLightbox('${esc(m.imageUrl)}')" onerror="this.style.display='none'">`;
        if (m.text) content += `<div>${esc(m.text)}</div>`;
        return `<div class="chat-msg ${isSent?'sent':'received'}">${content}<span class="msg-time">${ts}</span></div>`;
      }).join('');
      scrollChatToBottom();
    });
}

function scrollChatToBottom() { 
  const c = document.getElementById('chat-messages'); 
  if (c) c.scrollTop = c.scrollHeight; 
}

async function sendChatMessage() {
  const inp = document.getElementById('chat-input-text');
  if (!inp || !currentChatOrderId) return;
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  await sendChatContent({ text, type:'text' });
}

async function sendQuickMessage(text) { 
  if (!currentChatOrderId) return; 
  await sendChatContent({ text, type:'text' }); 
}

async function sendChatContent(content) {
  if (!currentChatOrderId) return;
  try {
    const ref = db.collection('chats').doc(currentChatOrderId);
    await ref.collection('messages').add({
      sender: 'user', 
      text: content.text || '',
      imageUrl: content.imageUrl || null, 
      type: content.type || 'text',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(), 
      read: false
    });
    await ref.update({
      lastMessage: content.text || (content.imageUrl ? '📷 ส่งรูป' : ''),
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
      unreadByRider: firebase.firestore.FieldValue.increment(1)
    });
  } catch (e) { 
    console.error(e); 
    showToast('❌ ส่งไม่สำเร็จ'); 
  }
}

async function handleImageUpload(event) {
  const file = event.target.files[0];
  if (!file || !currentChatOrderId) return;
  if (file.size > 5 * 1024 * 1024) { 
    showToast('⚠️ ใหญ่เกิน 5MB'); 
    event.target.value = ''; 
    return; 
  }
  
  const prog = document.createElement('div');
  prog.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);color:#fff;padding:16px 24px;border-radius:12px;z-index:9999;font-weight:800';
  prog.textContent = '⏳ กำลังอัพโหลด...';
  document.body.appendChild(prog);
  
  try {
    const ext = file.name.split('.').pop() || 'jpg';
    const ref = storage.ref(`chats/${currentChatOrderId}/${Date.now()}.${ext}`);
    const snap = await ref.put(file);
    const url = await snap.ref.getDownloadURL();
    await sendChatContent({ imageUrl: url, text:'', type:'image' });
    showToast('✅ ส่งรูปแล้ว');
  } catch (e) { 
    console.error(e); 
    showToast('❌ อัพโหลดไม่สำเร็จ'); 
  }
  prog.remove();
  event.target.value = '';
}

function openLightbox(url) { 
  document.getElementById('lightbox-img').src = url; 
  document.getElementById('img-lightbox').style.display = 'flex'; 
}
function closeLightbox() { 
  document.getElementById('img-lightbox').style.display = 'none'; 
}

// ═══════════════════════════════════════════
//  RATING SYSTEM
// ═══════════════════════════════════════════
function openRatingDialog(orderId) {
  const o = orders.find(x => String(x.id) === String(orderId));
  if (!o || !o.rider) return;
  if (o.rated) { showToast('ให้คะแนนแล้ว'); return; }
  
  document.getElementById('modal-body').innerHTML = `
    <div style="text-align:center;margin-bottom:20px">
      <div style="width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#FF6B35,#E55A2B);display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;font-weight:900;margin:0 auto 12px">
        ${esc(o.rider.avatar || o.rider.name?.[0] || '?')}
      </div>
      <h2 style="font-size:20px;font-weight:900">${esc(o.rider.name)}</h2>
      <p style="font-size:13px;color:#888">ให้คะแนนการให้บริการ</p>
    </div>
    <div style="display:flex;justify-content:center;gap:10px;margin:20px 0" id="rating-stars">
      ${[1,2,3,4,5].map(n => `<div class="rating-star" data-star="${n}" onclick="setRating(${n})">⭐</div>`).join('')}
    </div>
    <div id="rating-label" style="text-align:center;font-size:14px;font-weight:800;min-height:24px;margin-bottom:12px;color:#00A651">กดดาวเพื่อให้คะแนน</div>
    <textarea id="rating-comment" placeholder="คอมเมนต์ (ไม่บังคับ)" maxlength="500" style="width:100%;padding:14px;border:2px solid #e8e8e8;border-radius:14px;font-size:14px;font-family:inherit;min-height:80px;outline:none"></textarea>
    <button id="submit-rating-btn" class="btn-full btn-green" style="margin-top:16px" onclick="submitRating('${jsStr(o.id)}')" disabled>✅ ส่งคะแนน</button>
    <button class="btn-full btn-gray" onclick="closeModal()">ข้ามไปก่อน</button>
  `;
  window._currentRating = 0;
  document.getElementById('modal').classList.add('active');
}

function setRating(stars) {
  window._currentRating = stars;
  document.querySelectorAll('.rating-star').forEach(el => {
    const s = Number(el.dataset.star);
    el.classList.toggle('active', s <= stars);
  });
  const labels = { 1:'😞 แย่มาก', 2:'😕 ไม่ค่อยดี', 3:'🙂 พอใช้', 4:'😊 ดี', 5:'🤩 ยอดเยี่ยม!' };
  document.getElementById('rating-label').textContent = labels[stars] || '';
  document.getElementById('submit-rating-btn').disabled = false;
}

async function submitRating(orderId) {
  const stars = window._currentRating || 0;
  if (stars < 1) return showToast('⚠️ กดดาวก่อน');
  const o = orders.find(x => String(x.id) === String(orderId));
  if (!o || !o.rider) return;
  
  const comment = (document.getElementById('rating-comment')?.value || '').trim().slice(0,500);
  const btn = document.getElementById('submit-rating-btn');
  if (btn) btn.disabled = true;
  
  try {
    // ⭐ 1) บันทึก rating
    await db.collection('ratings').add({
      orderId: o.id, 
      riderId: o.riderId, 
      riderName: o.rider.name || '',
      userId: currentUser.uid, 
      userName: currentUser.displayName || currentUser.email || 'ลูกค้า',
      stars, 
      comment, 
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    
    // ⭐ 2) อัพเดตคะแนนไรเดอร์
    const ref = db.collection('riders').doc(o.riderId);
    await db.runTransaction(async tx => {
      const doc = await tx.get(ref);
      if (!doc.exists) return;
      const d = doc.data();
      const cur = Number(d.totalRatings || 0), sum = Number(d.ratingSum || 0);
      const n = cur + 1, ns = sum + stars;
      const avg = Math.round((ns/n)*10)/10;
      const key = `rating${stars}`;
      tx.update(ref, { 
        rating: avg, 
        totalRatings: n, 
        ratingSum: ns, 
        [key]: Number(d[key]||0) + 1 
      });
    });
    
    // ⭐ 3) มาร์คออเดอร์
    await db.collection('orders').doc(o.id).update({ 
      rated: true, 
      ratingStars: stars, 
      ratedAt: firebase.firestore.FieldValue.serverTimestamp() 
    });
    
    showToast('🙏 ขอบคุณสำหรับคะแนน!');
    closeModal();
  } catch (e) { 
    console.error(e); 
    showToast('❌ ส่งไม่สำเร็จ'); 
    if (btn) btn.disabled = false; 
  }
}

// ═══════════════════════════════════════════
//  RIDER LEVEL
// ═══════════════════════════════════════════
function getRiderLevel(rating, totalRatings) {
  if (!totalRatings || totalRatings < 5) {
    return { key:'new', icon:'🌱', label:'ใหม่', cls:'level-new' };
  }
  if (rating >= 4.9) return { key:'elite',  icon:'🏆', label:'Elite',  cls:'level-elite' };
  if (rating >= 4.7) return { key:'gold',   icon:'🥇', label:'Gold',   cls:'level-gold' };
  if (rating >= 4.5) return { key:'silver', icon:'🥈', label:'Silver', cls:'level-silver' };
  if (rating >= 4.0) return { key:'bronze', icon:'🥉', label:'Bronze', cls:'level-bronze' };
  return { key:'warn', icon:'⚠️', label:'ปรับปรุง', cls:'level-new' };
}
</script>
<script>
// ═══════════════════════════════════════════
//  MAP
// ═══════════════════════════════════════════
function openMapPage() {
  document.getElementById('map-page').classList.add('active');
  document.body.style.paddingBottom = '0';
  setTimeout(() => { 
    if (!mainMap) initMap(); 
    else mainMap.invalidateSize(); 
  }, 100);
}

function closeMapPage() {
  document.getElementById('map-page').classList.remove('active');
  document.body.style.paddingBottom = 'calc(88px + env(safe-area-inset-bottom))';
}

function initMap() {
  mainMap = L.map('main-map', { 
    center:[USER_LOC.lat, USER_LOC.lng], 
    zoom:14, 
    attributionControl:false 
  });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, minZoom:10 }).addTo(mainMap);
  L.control.attribution({ prefix:false }).addAttribution('© OpenStreetMap').addTo(mainMap);
  
  userMarker = L.marker([USER_LOC.lat, USER_LOC.lng], { 
    icon: L.divIcon({ 
      html:'<div style="background:#4A90D9;border:3px solid white;border-radius:50%;width:24px;height:24px;box-shadow:0 2px 8px rgba(74,144,217,.5)"></div>', 
      iconSize:[24,24], iconAnchor:[12,12] 
    }) 
  }).addTo(mainMap).bindPopup('<b>📍 ตำแหน่งของคุณ</b>');
  
  const pb = fn => `<button onclick="${fn}" style="background:#00A651;color:white;border:none;padding:6px 12px;border-radius:8px;margin-top:8px;cursor:pointer">📍 ตั้งปลายทาง</button>`;
  
  TAMBONS.forEach((t, i) => {
    const m = L.marker([t.lat, t.lng], { 
      icon: L.divIcon({ 
        html:`<div style="background:#FF6B35;color:white;border:3px solid white;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold">${i+1}</div>`, 
        iconSize:[32,32], iconAnchor:[16,16] 
      }) 
    }).addTo(mainMap).bindPopup(`<b>${esc(t.name)}</b><br>${esc(t.desc)}<br>${pb(`pickTambon(${i})`)}`);
    tambonMarkers.push(m);
  });
  
  const colors = { 
    temple:'#FFD700', edu:'#43e97b', gov:'#667eea', health:'#ff6b6b', 
    tourist:'#11998e', hotel:'#a18cd1', gas:'#fa709a', bank:'#30cfd0', market:'#ff9a9e' 
  };
  
  PLACES.filter(p => colors[p.c]).forEach(p => {
    const m = L.marker([p.lat, p.lng], { 
      icon: L.divIcon({ 
        html:`<div style="background:${colors[p.c]};color:white;border:3px solid white;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px">${CAT_ICON[p.c]}</div>`, 
        iconSize:[28,28], iconAnchor:[14,14] 
      }) 
    }).addTo(mainMap).bindPopup(`<b>${esc(p.n)}</b><br>⭐ ${p.rating}<br>${pb(`pickPlace(${p.id})`)}`);
    placeMarkers.push(m);
  });
  
  mainMap.on('click', e => setDestination(e.latlng.lat, e.latlng.lng, 'จุดที่เลือก', 'custom'));
  
  const list = document.getElementById('tambon-list');
  TAMBONS.forEach((t, i) => {
    const item = document.createElement('div');
    item.className = 'tambon-item';
    item.innerHTML = `<div class="tambon-dot"></div><span>${i+1}. ${esc(t.name)}</span>`;
    item.onclick = () => { 
      mainMap.setView([t.lat, t.lng], 16); 
      tambonMarkers[i].openPopup(); 
      toggleTambonList(); 
    };
    list.appendChild(item);
  });
}

function pickPlace(id) { 
  const p = PLACES[id]; 
  mainMap.closePopup(); 
  setDestination(p.lat, p.lng, p.n, p.c); 
}

function pickTambon(i) { 
  const t = TAMBONS[i]; 
  mainMap.closePopup(); 
  setDestination(t.lat, t.lng, t.name, 'tambon'); 
}

function setDestination(lat, lng, name, cat) {
  if (!mainMap) return;
  if (destinationMarker) mainMap.removeLayer(destinationMarker);
  destinationMarker = L.marker([lat, lng], { 
    draggable:true, 
    icon: L.divIcon({ 
      html:'<div style="background:#E91E63;color:white;border:3px solid white;border-radius:50% 50% 50% 0;transform:rotate(-45deg);width:36px;height:36px;display:flex;align-items:center;justify-content:center"><span style="transform:rotate(45deg)">📍</span></div>', 
      iconSize:[36,36], iconAnchor:[18,36] 
    }) 
  }).addTo(mainMap);
  
  currentDestination = { lat, lng, name, cat };
  updateMapInfoPanel(lat, lng, name);
  drawRoute(lat, lng);
  document.getElementById('map-info-panel').classList.add('active');
  showToast(`📍 ตั้ง "${name}" ปลายทางแล้ว`);
}

function drawRoute(lat, lng) {
  if (routeLine) mainMap.removeLayer(routeLine);
  routeLine = L.polyline([[USER_LOC.lat, USER_LOC.lng], [lat, lng]], { 
    color:'#00A651', weight:5, opacity:.8, dashArray:'10, 10' 
  }).addTo(mainMap);
  mainMap.fitBounds(routeLine.getBounds(), { padding:[50,50] });
}

function updateMapInfoPanel(lat, lng, name) {
  const dist = calcDist(USER_LOC.lat, USER_LOC.lng, lat, lng);
  const vehicle = VEHICLE_CONFIG.motorcycle;
  const extra = Math.ceil(Math.max(0, dist-1)) * vehicle.perKm;
  document.getElementById('map-info-title').innerHTML = `📍 ${esc(name)}`;
  document.getElementById('map-info-content').innerHTML = `
    <div class="map-info-sub">ระยะทาง: <strong>${formatDist(dist)}</strong></div>
    <div class="map-info-sub">เวลา: <strong>${Math.max(2, Math.ceil(dist*4))} นาที</strong></div>
    <div class="map-info-cost">
      <div class="cost-row"><span>🚩 ค่าเริ่มต้น</span><span>${vehicle.basePrice}฿</span></div>
      <div class="cost-row"><span>📏 ระยะเพิ่ม</span><span>${extra}฿</span></div>
      <div class="cost-total"><span>💰 รวม</span><span>${vehicle.basePrice + extra}฿</span></div>
    </div>`;
}

async function callRiderFromMap() {
  if (!currentUser) { showToast('⚠️ เข้าสู่ระบบก่อน'); showLoginModal(); return; }
  if (!currentDestination) return showToast('⚠️ ยังไม่ได้ตั้งปลายทาง');
  
  let phone = '';
  try { 
    const s = await db.collection('users').doc(currentUser.uid).get(); 
    if (s.exists) phone = s.data().phone || ''; 
  } catch (e) {}
  if (!phone) return showToast('⚠️ กรอกเบอร์ในโปรไฟล์ก่อน');
  
  const { lat, lng, name } = currentDestination;
  const dist = calcDist(USER_LOC.lat, USER_LOC.lng, lat, lng);
  const vehicle = VEHICLE_CONFIG.motorcycle;
  const extra = Math.ceil(Math.max(0, dist-1)) * vehicle.perKm;
  const fare = vehicle.basePrice + extra;
  
  const order = {
    type:'map', 
    serviceType:'express', 
    vehicleType:'motorcycle', 
    vehicleName:'มอเตอร์ไซค์',
    title:name, 
    items:'ปลายทางจากแผนที่', 
    price:0, 
    fare, 
    basePrice:vehicle.basePrice, 
    perKmPrice:vehicle.perKm,
    serviceFee:0, 
    total:fare, 
    distance:dist, 
    address:name, 
    note:'',
    userPhone:phone, 
    pickupLat:lat, 
    pickupLng:lng, 
    status:'searching'
  };
  
  showToast('🔍 กำลังเรียกไรเดอร์...');
  if (!(await saveOrderToFirestore(order))) { 
    showToast('❌ ไม่สำเร็จ'); 
    return; 
  }
  closeMapPage();
  switchTab('orders', document.querySelectorAll('.nav-item')[1]);
  showToast('✅ เรียกสำเร็จ!');
}

function navigateToDestination() {
  if (!currentDestination) return showToast('⚠️ ยังไม่ได้ตั้งปลายทาง');
  const { lat, lng, name } = currentDestination;
  showToast(`🧭 นำทางไป ${name}`);
  setTimeout(() => window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`, '_blank'), 500);
}

function clearDestination() {
  if (mainMap) { 
    if (destinationMarker) mainMap.removeLayer(destinationMarker); 
    if (routeLine) mainMap.removeLayer(routeLine); 
  }
  destinationMarker = routeLine = currentDestination = null;
  document.getElementById('map-info-panel').classList.remove('active');
  showToast('🗑️ ล้างปลายทาง');
}

function centerToUser() { 
  if (!mainMap) return; 
  mainMap.setView([USER_LOC.lat, USER_LOC.lng], 16); 
  userMarker.openPopup(); 
}

function toggleTambonList() { 
  document.getElementById('tambon-list').classList.toggle('active'); 
}

function showAllPlacesOnMap() {
  if (!mainMap) return;
  const b = L.latLngBounds([[USER_LOC.lat, USER_LOC.lng]]);
  placeMarkers.concat(tambonMarkers).forEach(m => b.extend(m.getLatLng()));
  mainMap.fitBounds(b, { padding:[50,50] });
  showToast(`📌 ${placeMarkers.length + tambonMarkers.length} แห่ง`);
}

// ═══════════════════════════════════════════
//  TABS
// ═══════════════════════════════════════════
function switchTab(tab, el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById('tab-home').style.display = tab === 'home' ? 'block' : 'none';
  document.getElementById('tab-orders').classList.toggle('active', tab === 'orders');
  document.getElementById('tab-messages').classList.toggle('active', tab === 'messages');
  if (tab === 'home') {
    document.getElementById('search-input').value = '';
    document.getElementById('search-results').classList.remove('active');
    document.getElementById('search-results').innerHTML = '';
    closeCategoryView();
  }
  if (tab === 'orders') renderOrders();
  window.scrollTo(0, 0);
}

//  PDPA
// ═══════════════════════════════════════════
function checkPDPA() {
  if (!store('chauatgo_pdpa_consent')) {
    document.getElementById('pdpa-overlay').classList.remove('hidden');
  } else {
    document.getElementById('pdpa-overlay').classList.add('hidden');
    document.getElementById('legal-footer').style.display = 'block';
    checkLocationPopup();
  }
}

function acceptPDPA() {
  store('chauatgo_pdpa_consent', 'true');
  document.getElementById('pdpa-overlay').classList.add('hidden');
  document.getElementById('legal-footer').style.display = 'block';
  showToast('✅ ยอมรับนโยบาย');
  setTimeout(checkLocationPopup, 500);
}

function checkLocationPopup() {
  const g = store('chauatgo_location_granted');
  if (g === null) { 
    document.getElementById('loc-popup-overlay').classList.remove('hidden'); 
    return; 
  }
  document.getElementById('loc-popup-overlay').classList.add('hidden');
  if (g === 'true' && navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(applyLocation, () => {}, { 
      enableHighAccuracy: true, 
      timeout: 5000 
    });
  }
}

// ═══════════════════════════════════════════
//  PWA
// ═══════════════════════════════════════════
let deferredPrompt = null;
const installBtn = document.getElementById('install-btn');
const installModal = document.getElementById('install-modal');
const installConfirmBtn = document.getElementById('install-confirm-btn');

function getInstallInstructions() {
  const ua = navigator.userAgent;
  if (/iPhone|iPad|iPod/.test(ua)) {
    return '📱 <b>iOS Safari:</b><br>1. กดปุ่มแชร์<br>2. เลือก "เพิ่มไปยังหน้าจอโฮม"<br>3. กด "เพิ่ม"';
  }
  if (/Android/.test(ua)) {
    return '🤖 <b>Android Chrome:</b><br>1. กดเมนู ⋮<br>2. เลือก "ติดตั้งแอป"<br>3. กด "ติดตั้ง"';
  }
  return '💻 <b>Desktop:</b><br>1. กดไอคอน ⬇️ ที่ address bar<br>2. กด "ติดตั้ง"';
}

window.addEventListener('beforeinstallprompt', e => { 
  e.preventDefault(); 
  deferredPrompt = e; 
  installBtn.style.display = 'block'; 
});

function showInstallModal() { 
  document.getElementById('install-text').innerHTML = getInstallInstructions(); 
  installConfirmBtn.style.display = deferredPrompt ? 'flex' : 'none'; 
  installModal.classList.add('active'); 
}

async function triggerInstall() { 
  if (!deferredPrompt) return; 
  deferredPrompt.prompt(); 
  const { outcome } = await deferredPrompt.userChoice; 
  if (outcome === 'accepted') { 
    showToast('✅ ติดตั้งสำเร็จ!'); 
    installBtn.style.display = 'none'; 
  } 
  deferredPrompt = null; 
  closeInstallModal(); 
}

function closeInstallModal() { 
  installModal.classList.remove('active'); 
}

// Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .catch(err => console.warn('[PWA] SW failed', err));
  });
}

// Online / Offline
window.addEventListener('online', () => { 
  showToast('🟢 กลับมาออนไลน์'); 
  document.getElementById('offline-banner').classList.remove('active'); 
});
window.addEventListener('offline', () => { 
  showToast('🔴 ออฟไลน์'); 
  document.getElementById('offline-banner').classList.add('active'); 
});

// ═══════════════════════════════════════════
//  AUTO RATING PROMPT
// ═══════════════════════════════════════════
let ratingPromptShown = new Set();
setInterval(() => {
  if (!currentUser) return;
  orders.forEach(o => {
    if (o.status === 'done' && o.rider && !o.rated) {
      const doneTime = o.completedAt?.toDate ? o.completedAt.toDate() : null;
      if (!doneTime) return;
      const ageMin = (Date.now() - doneTime.getTime()) / 1000 / 60;
      if (ageMin >= 1 && ageMin <= 15 && !ratingPromptShown.has(o.id)) {
        const modalOpen = document.getElementById('modal').classList.contains('active');
        if (!modalOpen) { 
          ratingPromptShown.add(o.id); 
          openRatingDialog(o.id); 
        }
      }
    }
  });
}, 30000);
</script>
