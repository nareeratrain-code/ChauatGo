# Deploy Cloud Functions and Firestore indexes for chauat-go-b9841.
# Does not deploy hosting and does not publish security rules.
# Run by hand: Actions → Deploy Functions → Run workflow.
# The owner must create the FIREBASE_SERVICE_ACCOUNT secret first
# (the whole service-account JSON). See RULES_TH.md.
name: Deploy Functions

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy functions and indexes
        run: firebase deploy --only functions,firestore:indexes --project chauat-go-b9841 --non-interactive --force
