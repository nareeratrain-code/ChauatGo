
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase Test</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; background: #f8f9fa; }
h1 { color: #00A651; }
button { padding: 12px 20px; margin: 5px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }
.btn-green { background: #00A651; color: white; }
.btn-blue { background: #4285F4; color: white; }
.btn-gray { background: #f0f0f0; color: #333; }
#result { margin-top: 20px; padding: 15px; border-radius: 8px; background: white; border: 1px solid #ddd; min-height: 50px; }
.error { color: #e74c3c; font-weight: bold; }
.success { color: #27ae60; font-weight: bold; }
input { padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; width: 100%; box-sizing: border-box; font-size: 14px; }
label { font-weight: bold; display: block; margin-top: 10px; }
</style>
</head>
<body>
<h1>🔥 Firebase Auth Test</h1>
<p>ทดสอบระบบ Login/Signup ของ Chauat Go</p>

<div id="status" style="padding:10px;background:#fff3cd;border-radius:8px;margin:10px 0;">⏳ กำลังโหลด Firebase...</div>

<h3>📝 สมัครสมาชิก</h3>
<label>ชื่อ-นามสกุล</label>
<input type="text" id="signup-name" placeholder="ชื่อ" value="Test User">
<label>อีเมล</label>
<input type="email" id="signup-email" placeholder="อีเมล" value="testuser12345@gmail.com">
<label>รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
<input type="password" id="signup-password" placeholder="รหัสผ่าน" value="12345678">
<button class="btn-green" onclick="testSignup()">✅ สมัครสมาชิก</button>

<h3> เข้าสู่ระบบ</h3>
<label>อีเมล</label>
<input type="email" id="login-email" placeholder="อีเมล" value="">
<label>รหัสผ่าน</label>
<input type="password" id="login-password" placeholder="รหัสผ่าน" value="">
<button class="btn-blue" onclick="testLogin()">🔑 เข้าสู่ระบบ</button>

<button class="btn-gray" onclick="testGoogle()"> Login ด้วย Google</button>
<button class="btn-gray" onclick="testLogout()">🚪 Logout</button>

<h3>📊 ผลลัพธ์</h3>
<div id="result">รอการทดสอบ...</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB6PnikectfjjYfvo07VhpuxEIXQdJeASBM",
  authDomain: "chauat-go-b9841.firebaseapp.com",
  projectId: "chauat-go-b9841",
  storageBucket: "chauat-go-b9841.firebasestorage.app",
  messagingSenderId: "282197694521",
  appId: "1:282197694521:web:b6de0324410e0dedd815e8"
};

let app, auth, db;

try {
  app = firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
  document.getElementById('status').innerHTML = '✅ Firebase โหลดสำเร็จ!';
  document.getElementById('status').style.background = '#d4edda';
  console.log('✅ Firebase initialized');
} catch (e) {
  document.getElementById('status').innerHTML = '❌ Firebase โหลดไม่สำเร็จ: ' + e.message;
  document.getElementById('status').style.background = '#f8d7da';
  console.error('❌ Firebase init error:', e);
}

auth.onAuthStateChanged(user => {
  if (user) {
    console.log(' User logged in:', user.email);
    document.getElementById('status').innerHTML = '👤 Login แล้ว: ' + user.email;
    document.getElementById('status').style.background = '#d4edda';
  } else {
    console.log('👋 No user logged in');
  }
});

async function testSignup() {
  const name = document.getElementById('signup-name').value;
  const email = document.getElementById('signup-email').value;
  const password = document.getElementById('signup-password').value;
  
  document.getElementById('result').innerHTML = '⏳ กำลังสมัครสมาชิก...';
  
  try {
    if (!auth) throw new Error('Auth not initialized');
    
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await cred.user.updateProfile({ displayName: name });
    
    await db.collection('users').doc(cred.user.uid).set({
      name: name,
      email: email,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    
    document.getElementById('result').innerHTML = 
      '<div class="success">✅ สมัครสมาชิกสำเร็จ!</div>' +
      '<p><b>UID:</b> ' + cred.user.uid + '</p>' +
      '<p><b>Email:</b> ' + cred.user.email + '</p>' +
      '<p><b>Name:</b> ' + cred.user.displayName + '</p>';
  } catch (error) {
    console.error('Signup error:', error);
    document.getElementById('result').innerHTML = 
      '<div class="error">❌ Error Code: ' + error.code + '</div>' +
      '<div class="error">Message: ' + error.message + '</div>' +
      '<p>ดู Console (F12) สำหรับรายละเอียดเพิ่มเติม</p>';
  }
}

async function testLogin() {
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  
  document.getElementById('result').innerHTML = '⏳ กำลังเข้าสู่ระบบ...';
  
  try {
    if (!auth) throw new Error('Auth not initialized');
    
    const cred = await auth.signInWithEmailAndPassword(email, password);
    document.getElementById('result').innerHTML = 
      '<div class="success">✅ เข้าสู่ระบบสำเร็จ!</div>' +
      '<p><b>UID:</b> ' + cred.user.uid + '</p>' +
      '<p><b>Email:</b> ' + cred.user.email + '</p>' +
      '<p><b>Name:</b> ' + cred.user.displayName + '</p>';
  } catch (error) {
    console.error('Login error:', error);
    document.getElementById('result').innerHTML = 
      '<div class="error">❌ Error Code: ' + error.code + '</div>' +
      '<div class="error">Message: ' + error.message + '</div>';
  }
}

async function testGoogle() {
  document.getElementById('result').innerHTML = '⏳ กำลังเปิด Google Login...';
  
  try {
    if (!auth) throw new Error('Auth not initialized');
    
    const provider = new firebase.auth.GoogleAuthProvider();
    const result = await auth.signInWithPopup(provider);
    document.getElementById('result').innerHTML = 
      '<div class="success">✅ Google Login สำเร็จ!</div>' +
      '<p><b>UID:</b> ' + result.user.uid + '</p>' +
      '<p><b>Email:</b> ' + result.user.email + '</p>' +
      '<p><b>Name:</b> ' + result.user.displayName + '</p>';
  } catch (error) {
    console.error('Google login error:', error);
    document.getElementById('result').innerHTML = 
      '<div class="error">❌ Error Code: ' + error.code + '</div>' +
      '<div class="error">Message: ' + error.message + '</div>';
  }
}

async function testLogout() {
  try {
    await auth.signOut();
    document.getElementById('result').innerHTML = '<div class="success">✅ Logout สำเร็จ!</div>';
    document.getElementById('status').innerHTML = '👋 Logout แล้ว';
    document.getElementById('status').style.background = '#fff3cd';
  } catch (error) {
    document.getElementById('result').innerHTML = '<div class="error">❌ Logout error: ' + error.message + '</div>';
  }
}
</script>
</body>
</html>
