<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Chauat Go Admin</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'IBM Plex Sans Thai',sans-serif;-webkit-tap-highlight-color:transparent}
:root{--brand:#00A651;--brand-dark:#008C45;--bg:#EDF6DC;--text:#1A1A1A;--mut:#6B7280;--danger:#E53935;--warn:#E65100;--blue:#1565C0;--surface:#fff;--border:#e5e7eb}
body{background:var(--bg);color:var(--text);max-width:1000px;margin:0 auto;min-height:100vh;padding-bottom:40px}
.hidden{display:none!important}

/* Login Screen */
#login{position:fixed;inset:0;background:linear-gradient(135deg,#76B82A,#3B7A16);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.box{background:#fff;border-radius:20px;padding:32px 24px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.15)}
.box h1{font-size:22px;color:var(--brand);text-align:center;margin-bottom:20px}
input,select,textarea{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:12px;transition:border-color .2s;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
button{cursor:pointer;border:none;border-radius:10px;font-weight:800;font-size:13px;padding:10px 16px;transition:transform .1s,opacity .2s}
button:active{transform:scale(.97)}
.pri{background:var(--brand);color:#fff}.sec{background:#f0f0f0;color:#555}.dan{background:#FFEBEE;color:var(--danger)}.blue{background:var(--blue);color:#fff}
.big{width:100%;padding:14px;font-size:15px;border-radius:12px;margin-top:8px}

/* App Layout */
header{background:linear-gradient(135deg,#76B82A,#3B7A16);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;border-radius:0 0 20px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 4px 12px rgba(0,0,0,.1)}
header h1{flex:1;font-size:18px;font-weight:800}
header .admin-info{text-align:right;font-size:11px;opacity:.9;line-height:1.4}

nav{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:40;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;color:var(--mut);padding:10px 16px;font-size:13px;white-space:nowrap;border-radius:12px}
nav button.on{background:#E8F5E9;color:var(--brand);font-weight:800}

main{padding:16px}

/* Components */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.04);transition:transform .15s}
.card:active{transform:scale(.99)}
.num{font-size:28px;font-weight:800;color:var(--brand)}.lbl{font-size:12px;color:var(--mut);font-weight:600;margin-top:4px}
.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.nm{font-weight:800;font-size:15px}.meta{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.5;word-break:break-word}
.tag{font-size:11px;font-weight:800;padding:4px 10px;border-radius:12px;background:#E8F5E9;color:#2E7D32;display:inline-block}
.tag.w{background:#FFF3E0;color:var(--warn)}.tag.x{background:#f0f0f0;color:#888}.tag.b{background:#E3F2FD;color:var(--blue)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:14px;background:var(--surface);border-radius:16px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #eee}
.modal-hdr h2{font-size:18px;font-weight:800}
.close-btn{background:#f0f0f0;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);background:#222;color:#fff;padding:12px 20px;border-radius:16px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:999;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.err{background:var(--danger)}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- Login Screen -->
<div id="login">
  <form class="box" id="login-form">
    <h1>🛵 Chauat Go Admin</h1>
    <input type="email" id="em" placeholder="อีเมลผู้ดูแล (admin@chauatgo.com)" autocomplete="username" required>
    <input type="password" id="pw" placeholder="รหัสผ่าน" autocomplete="current-password" required>
    <button class="pri big" type="submit">เข้าสู่ระบบ</button>
  </form>
</div>

<!-- App Screen -->
<div id="app" class="hidden">
  <header>
    <h1>Chauat Go Admin</h1>
    <div class="admin-info">
      <div id="who">admin@chauatgo.com</div>
      <button class="sec" id="logout" style="padding:4px 10px;font-size:11px;margin-top:4px">ออกจากระบบ</button>
    </div>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<!-- Generic Modal Container -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-box">
    <div class="modal-hdr">
      <h2 id="modal-title">Title</h2>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
// ─── Firebase Config ───
firebase.initializeApp({
  apiKey: "AIzaSyB6PnikectfjjYfvO7VhpuxEIXQdJeASBM",
  authDomain: "chauat-go-b9841.firebaseapp.com",
  projectId: "chauat-go-b9841",
  storageBucket: "chauat-go-b9841.firebasestorage.app",
  messagingSenderId: "282197694521",
  appId: "1:282197694521:web:0528c22747a0c04bd815e8"
});
const auth = firebase.auth(), db = firebase.firestore();

// ─── Helpers ──
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m, err) {
  const t = $('toast');
  t.textContent = m;
  t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast', 3000);
}

// ─── State ───
const SECTIONS = [
  ['dashboard', '📊 แดชบอร์ด'],
  ['merchants', '🏪 ร้านค้า'],
  ['orders', '📋 ออเดอร์'],
  ['riders', '🛵 ไรเดอร์'],
  ['users', '👥 ผู้ใช้']
];
const store = { merchants: [], orders: [], riders: [], users: [] };
const filters = { orders: 'all', q: '' };
let current = 'dashboard', unsubs = [];

const STATUS = {
  searching: '⏳ กำลังหาไรเดอร์', pending: '🔔 รอรับงาน', accepted: '🛵 รับงานแล้ว',
  picked_up: '📦 รับของแล้ว', on_the_way: '🚀 กำลังมาส่ง', done: '✅ เสร็จสิ้น', cancelled: '❌ ยกเลิก'
};

const itemsText = i => Array.isArray(i) ? i.map(x => `${x.name} x${x.qty}`).join(', ') : String(i ?? '');
const fmtTime = t => {
  if (!t) return '—';
  const d = t.toDate ? t.toDate() : new Date(t);
  return d.toLocaleString('th-TH', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
};
const ts = o => o.createdAt?.seconds || 0;

// ─── Auth Logic ───
$('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('em').value.trim();
  const pw = $('pw').value;
  
  // Client-side check for speed (Server-side enforced by Rules)
  if (email !== 'admin@chauatgo.com') {
    toast('อีเมลนี้ไม่มีสิทธิ์เป็นผู้ดูแล', true);
    return;
  }

  try {
    await auth.signInWithEmailAndPassword(email, pw);
  } catch (err) {
    toast('อีเมลหรือรหัสผ่านไม่ถูกต้อง', true);
  }
  $('pw').value = '';
});

$('logout').addEventListener('click', () => {
  stop();
  auth.signOut();
});

auth.onAuthStateChanged(async user => {
  stop();
  if (!user) {
    $('login').classList.remove('hidden');
    $('app').classList.add('hidden');
    return;
  }
  
  // Verify Claims strictly matching Firestore Rules
  const tok = await user.getIdTokenResult(true);
  const isAuthorized = tok.claims.admin === true || 
                       (user.email === 'admin@chauatgo.com' && tok.claims.email_verified);
                       
  if (!isAuthorized) {
    toast('บัญชีนี้ไม่มีสิทธิ์ผู้ดูแล (ต้องยืนยันอีเมลก่อน)', true);
    await auth.signOut();
    return;
  }

  $('who').textContent = user.email;
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  start();
});

// ─── Data Listeners ───
function start() {
  const collections = ['merchants', 'orders', 'riders', 'users'];
  for (const k of collections) {
    const unsub = db.collection(k).onSnapshot(s => {
      store[k] = s.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, err => {
      console.error(`Error loading ${k}:`, err);
      toast('โหลดข้อมูล ' + k + ' ไม่สำเร็จ: ' + err.code, true);
    });
    unsubs.push(unsub);
  }
  renderNav();
  render();
}

function stop() {
  unsubs.forEach(u => u());
  unsubs = [];
  for (const k in store) store[k] = [];
}

// ─── UI Rendering ───
function renderNav() {
  $('nav').innerHTML = SECTIONS.map(([k, l]) => 
    `<button data-go="${k}" class="${k === current ? 'on' : ''}">${l}</button>`
  ).join('');
}

function render() {
  const f = { dashboard, merchants, orders, riders, users }[current];
  $('main').innerHTML = f();
}

function searchInput(ph) {
  return `<input id="q" placeholder="${ph}" value="${esc(filters.q)}" style="margin-bottom:16px">`;
}

function dashboard() {
  const done = store.orders.filter(o => o.status === 'done');
  const rev = done.reduce((s, o) => s + (Number(o.total) || 0), 0);
  const recent = [...store.orders].sort((a, b) => ts(b) - ts(a)).slice(0, 5);
  
  const stats = [
    ['ร้านค้า', store.merchants.length],
    ['ออเดอร์ทั้งหมด', store.orders.length],
    ['ไรเดอร์', store.riders.length],
    ['ผู้ใช้', store.users.length],
    ['รายได้รวม (เสร็จสิ้น)', '฿' + rev.toLocaleString()],
    ['รอไรเดอร์', store.orders.filter(o => o.status === 'searching').length]
  ];

  return `
    <div class="grid">
      ${stats.map(([l, n]) => `<div class="card"><div class="num">${esc(n)}</div><div class="lbl">${l}</div></div>`).join('')}
    </div>
    <div style="font-weight:800;font-size:16px;margin-bottom:12px">ออเดอร์ล่าสุด</div>
    ${recent.length ? recent.map(o => `
      <div class="card" data-order="${esc(o.id)}" style="cursor:pointer">
        <div class="row">
          <div style="flex:1">
            <div class="nm">${esc(o.title || 'ออเดอร์')}</div>
            <div class="meta">฿${esc(o.total || 0)} • ${esc(o.userName || 'ไม่ระบุ')} • ${fmtTime(o.createdAt)}</div>
          </div>
          <span class="tag ${o.status === 'done' ? '' : o.status === 'cancelled' ? 'x' : 'w'}">${esc(STATUS[o.status] || o.status)}</span>
        </div>
      </div>
    `).join('') : '<div class="empty">ยังไม่มีออเดอร์</div>'}
  `;
}

function merchants() {
  const q = filters.q.toLowerCase();
  const list = store.merchants.filter(m => !q || String(m.name || '').toLowerCase().includes(q));
  
  return searchInput('ค้นหาร้านค้า...') + (list.map(m => `
    <div class="card">
      <div class="row">
        <div style="flex:1">
          <div class="nm">${esc(m.name || 'ไม่ระบุชื่อ')}</div>
          <div class="meta">⭐ ${esc(m.rating || 0)} • 📞 ${esc(m.phone || 'ไม่มีเบอร์')}</div>
          <div class="meta">📍 ${esc(m.address || 'ไม่ระบุที่อยู่')}</div>
        </div>
        <span class="tag ${m.verified ? '' : 'w'}">${m.verified ? 'อนุมัติแล้ว' : 'รอยืนยัน'}</span>
      </div>
      <div class="acts">
        <button class="blue" data-edit-m="${esc(m.id)}">✏️ แก้ไข</button>
        <button class="pri" data-verify="${esc(m.id)}">${m.verified ? 'ยกเลิกอนุมัติ' : '✅ อนุมัติ'}</button>
        <button class="dan" data-del="merchants:${esc(m.id)}">🗑️ ลบ</button>
      </div>
    </div>
  `).join('') || '<div class="empty">ไม่พบร้านค้า</div>');
}

function orders() {
  const q = filters.q.toLowerCase();
  let list = store.orders.filter(o => 
    (filters.orders === 'all' || o.status === filters.orders) &&
    (!q || [o.title, o.userName, o.id].some(v => String(v || '').toLowerCase().includes(q)))
  );
  list = [...list].sort((a, b) => ts(b) - ts(a));
  
  const sel = `<select id="ofilter" style="margin-bottom:16px;width:auto;display:inline-block">
    <option value="all">ทุกสถานะ</option>
    ${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${filters.orders === k ? 'selected' : ''}>${v}</option>`).join('')}
  </select>`;

  return searchInput('ค้นหาออเดอร์...') + sel + (list.map(o => `
    <div class="card" data-order="${esc(o.id)}" style="cursor:pointer">
      <div class="row">
        <div style="flex:1">
          <div class="nm">${esc(o.title || 'ออเดอร์')}</div>
          <div class="meta">฿${esc(o.total || 0)} • 👤 ${esc(o.userName || 'ไม่ระบุ')}</div>
          <div class="meta">🕐 ${fmtTime(o.createdAt)} • 📍 ${esc(o.address || '')}</div>
        </div>
        <span class="tag ${o.status === 'done' ? '' : o.status === 'cancelled' ? 'x' : 'w'}">${esc(STATUS[o.status] || o.status)}</span>
      </div>
    </div>
  `).join('') || '<div class="empty">ไม่พบออเดอร์</div>');
}

function riders() {
  const q = filters.q.toLowerCase();
  const list = store.riders.filter(r => !q || String(r.name || '').toLowerCase().includes(q) || String(r.phone || '').includes(q));
  
  return searchInput('ค้นหาไรเดอร์...') + (list.map(r => `
    <div class="card">
      <div class="row">
        <div style="flex:1">
          <div class="nm">${esc(r.name || 'ไม่ระบุชื่อ')}</div>
          <div class="meta">📞 ${esc(r.phone || '—')} • ⭐ ${esc(r.rating || 0)} • 📦 ${esc(r.totalTrips || 0)} เที่ยว</div>
          <div class="meta">🛵 ${esc(r.vehicle || 'ไม่ระบุ')}</div>
        </div>
        <span class="tag ${r.status === 'active' ? '' : 'x'}">${esc(r.status === 'active' ? '🟢 ทำงาน' : '⚫ หยุด')}</span>
      </div>
      <div class="acts">
        <button class="pri" data-rider="${esc(r.id)}">${r.status === 'active' ? '⏸️ หยุดงาน' : '▶️ เปิดงาน'}</button>
        <button class="dan" data-del="riders:${esc(r.id)}">🗑️ ลบ</button>
      </div>
    </div>
  `).join('') || '<div class="empty">ไม่พบไรเดอร์</div>');
}

function users() {
  const q = filters.q.toLowerCase();
  const list = store.users.filter(u => !q || [u.name, u.email, u.phone].some(v => String(v || '').toLowerCase().includes(q)));
  
  return searchInput('ค้นหาผู้ใช้...') + (list.map(u => `
    <div class="card">
      <div class="nm">👤 ${esc(u.name || 'ไม่ระบุชื่อ')}</div>
      <div class="meta">📧 ${esc(u.email || '—')} • 📞 ${esc(u.phone || '—')}</div>
      <div class="meta">📍 ${esc(u.address || 'ไม่ระบุที่อยู่')} • 🕐 สมัคร: ${fmtTime(u.createdAt)}</div>
      <div class="acts">
        <button class="dan" data-del="users:${esc(u.id)}">🗑️ ลบผู้ใช้</button>
      </div>
    </div>
  `).join('') || '<div class="empty">ไม่พบผู้ใช้</div>');
}

// ─── Modals & Actions ───

function openModal(title, bodyHtml) {
  $('modal-title').textContent = title;
  $('modal-body').innerHTML = bodyHtml;
  $('modal-overlay').classList.add('show');
}

function closeModal() {
  $('modal-overlay').classList.remove('show');
}

function orderDetail(id) {
  const o = store.orders.find(x => x.id === id);
  if (!o) return;
  
  const opts = Object.entries(STATUS).map(([k, v]) => 
    `<option value="${k}" ${o.status === k ? 'selected' : ''}>${v}</option>`
  ).join('');

  const html = `
    <div class="meta" style="font-family:monospace;font-size:12px;margin-bottom:8px">ID: ${esc(o.id)}</div>
    <div class="nm" style="font-size:18px;margin-bottom:8px">${esc(o.title || '')}</div>
    <div class="meta" style="white-space:pre-wrap;background:#f8f9fa;padding:12px;border-radius:10px;margin-bottom:12px">${esc(itemsText(o.items))}</div>
    
    <div style="font-weight:800;margin-bottom:4px">👤 ข้อมูลลูกค้า</div>
    <div class="meta">${esc(o.userName || '')} • ${esc(o.userPhone || '')}</div>
    <div class="meta">📍 ${esc(o.address || '')} ${o.note ? '<br>📝 ' + esc(o.note) : ''}</div>
    
    <div style="margin-top:16px;padding-top:12px;border-top:1px solid #eee;display:flex;justify-content:space-between;align-items:center">
      <div>
        <div class="meta">ค่าสินค้า ฿${esc(o.price || 0)} + ค่าส่ง ฿${esc(o.fare || 0)}</div>
        <div style="font-size:20px;font-weight:800;color:var(--brand)">รวม ฿${esc(o.total || 0)}</div>
      </div>
      <select id="ostatus" data-oid="${esc(o.id)}" style="width:auto;margin:0;padding:8px 12px;font-weight:700;border-color:var(--brand)">
        ${opts}
      </select>
    </div>
    <button class="dan big" style="margin-top:16px" onclick="cancelOrder('${esc(o.id)}')">❌ ยกเลิกออเดอร์นี้</button>
  `;
  openModal('📋 รายละเอียดออเดอร์', html);
}

function editMerchantForm(id) {
  const m = store.merchants.find(x => x.id === id);
  if(!m) return;
  
  const html = `
    <label>ชื่อร้าน *</label>
    <input type="text" id="edit-name" value="${esc(m.name || '')}">
    <label>เบอร์โทร</label>
    <input type="tel" id="edit-phone" value="${esc(m.phone || '')}">
    <label>ที่อยู่</label>
    <textarea id="edit-address" rows="2">${esc(m.address || '')}</textarea>
    <label>ละติจูด (Lat)</label>
    <input type="number" step="any" id="edit-lat" value="${m.lat || ''}">
    <label>ลองจิจูด (Lng)</label>
    <input type="number" step="any" id="edit-lng" value="${m.lng || ''}">
    <button class="pri big" onclick="saveMerchantEdit('${esc(id)}')">💾 บันทึกการแก้ไข</button>
  `;
  openModal('✏️ แก้ไขร้านค้า', html);
}

async function saveMerchantEdit(id) {
  const updates = {
    name: $('edit-name').value.trim(),
    phone: $('edit-phone').value.trim(),
    address: $('edit-address').value.trim(),
    lat: parseFloat($('edit-lat').value) || null,
    lng: parseFloat($('edit-lng').value) || null,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  
  if(!updates.name) return toast('กรุณากรอกชื่อร้าน', true);

  try {
    await db.collection('merchants').doc(id).update(updates);
    toast('บันทึกเรียบร้อย');
    closeModal();
  } catch(e) {
    toast('บันทึกไม่สำเร็จ: ' + e.message, true);
  }
}

async function cancelOrder(id) {
  if(!confirm('ยืนยันการยกเลิกออเดอร์นี้?')) return;
  try {
    await db.collection('orders').doc(id).update({
      status: 'cancelled',
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('ยกเลิกออเดอร์แล้ว');
    closeModal();
  } catch(e) {
    toast('ยกเลิกไม่สำเร็จ', true);
  }
}

// ─── Event Delegation ───
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-go],[data-order],[data-verify],[data-rider],[data-del],[data-edit-m]');
  if (!t) return;
  
  try {
    if (t.dataset.go) {
      current = t.dataset.go;
      filters.q = '';
      renderNav();
      render();
      window.scrollTo(0, 0);
    } 
    else if (t.dataset.order) {
      orderDetail(t.dataset.order);
    } 
    else if (t.dataset.editM) {
      editMerchantForm(t.dataset.editM);
    }
    else if (t.dataset.verify) {
      const m = store.merchants.find(x => x.id === t.dataset.verify);
      await db.collection('merchants').doc(m.id).update({ 
        verified: !m.verified, 
        updatedAt: firebase.firestore.FieldValue.serverTimestamp() 
      });
      toast('อัปเดตสถานะร้านสำเร็จ');
    } 
    else if (t.dataset.rider) {
      const r = store.riders.find(x => x.id === t.dataset.rider);
      await db.collection('riders').doc(r.id).update({ 
        status: r.status === 'active' ? 'inactive' : 'active' 
      });
      toast('อัปเดตสถานะไรเดอร์สำเร็จ');
    } 
    else if (t.dataset.del) {
      const [col, id] = t.dataset.del.split(':');
      if (confirm('⚠️ ยืนยันการลบข้อมูลนี้?\nการกระทำนี้ไม่สามารถย้อนกลับได้')) {
        await db.collection(col).doc(id).delete();
        toast('ลบข้อมูลสำเร็จ');
      }
    }
  } catch (err) {
    console.error(err);
    toast('ไม่สำเร็จ: ' + err.code, true);
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    filters.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const q = $('q');
    if (q) {
      q.focus();
      q.setSelectionRange(pos, pos);
    }
  }
});

document.addEventListener('change', async e => {
  if (e.target.id === 'ofilter') {
    filters.orders = e.target.value;
    render();
  }
  if (e.target.id === 'ostatus') {
    try {
      await db.collection('orders').doc(e.target.dataset.oid).update({ 
        status: e.target.value, 
        updatedAt: firebase.firestore.FieldValue.serverTimestamp() 
      });
      toast('อัปเดตสถานะออเดอร์แล้ว');
      closeModal();
    } catch (err) {
      toast('ไม่สำเร็จ: ' + err.code, true);
    }
  }
});

// Close modal on outside click
$('modal-overlay').addEventListener('click', e => {
  if (e.target === $('modal-overlay')) closeModal();
});
</script>
</body>
