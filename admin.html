<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#00A651">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chauat Admin">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Chauat Go Admin</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'IBM Plex Sans Thai',sans-serif;-webkit-tap-highlight-color:transparent}
:root{--brand:#00A651;--bg:#EDF6DC;--text:#1A1A1A;--mut:#6B7280;--danger:#E53935;--warn:#E65100;--blue:#1565C0;--purple:#9C27B0;--teal:#00897B;--border:#e5e7eb}
body{background:var(--bg);color:var(--text);max-width:1000px;margin:0 auto;min-height:100vh;padding-bottom:40px}
.hidden{display:none!important}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#76B82A,#3B7A16);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;overflow-y:auto}
.box{background:#fff;border-radius:20px;padding:32px 24px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.15);margin:auto}
.box h1{font-size:22px;color:var(--brand);text-align:center;margin-bottom:20px;font-weight:900}
input,select,textarea{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:12px;font-family:inherit;font-weight:600;min-height:52px;outline:none;background:#fafafa}
input:focus,textarea:focus,select:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(0,166,81,.1)}
button{cursor:pointer;border:none;border-radius:10px;font-weight:800;font-size:13px;padding:10px 16px;font-family:inherit;min-height:44px}
button:disabled{opacity:.5}
.pri{background:var(--brand);color:#fff}.sec{background:#f0f0f0;color:#555}.dan{background:#FFEBEE;color:var(--danger)}.blue{background:var(--blue);color:#fff}
.big{width:100%;padding:14px;font-size:15px;border-radius:12px;margin-top:8px;min-height:56px}

/* PWA Install Button */
#installBtn{position:fixed;bottom:20px;left:20px;background:linear-gradient(135deg,#00A651,#008C45);color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;font-weight:900;box-shadow:0 8px 24px rgba(0,166,81,.4);z-index:9990;display:none;gap:8px;align-items:center;border:2px solid #fff}
#installBtn.show{display:flex}

header{background:linear-gradient(135deg,#76B82A,#3B7A16);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;border-radius:0 0 20px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 4px 12px rgba(0,0,0,.1)}
header h1{flex:1;font-size:18px;font-weight:900}
header .admin-info{text-align:right;font-size:11px;line-height:1.4}
header .admin-info button{padding:8px 14px;font-size:11px;margin-top:4px;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3);min-height:36px}

nav{background:#fff;padding:12px 8px;border-bottom:1px solid var(--border);position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:40;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav button{background:transparent;color:var(--mut);padding:10px 4px;border-radius:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:auto;position:relative}
nav button .nav-icon{font-size:26px;line-height:1;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#f5f5f5}
nav button .nav-label{font-size:10px;font-weight:900;text-align:center;line-height:1.2}
nav button .nav-badge{position:absolute;top:2px;right:6px;background:var(--danger);color:#fff;font-size:9px;font-weight:900;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff;z-index:2}
nav button.on{color:var(--brand)}
nav button.on .nav-icon{background:#E8F5E9}
main{padding:16px}

.stat-card{border-radius:16px;padding:16px;color:#fff;min-height:110px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.stat-card .stat-icon{font-size:28px;margin-bottom:8px}
.stat-card .stat-value{font-size:28px;font-weight:900;line-height:1;letter-spacing:-1px}
.stat-card .stat-label{font-size:12px;font-weight:700;margin-top:6px;opacity:.95}
.stat-card .stat-sub{font-size:10px;opacity:.8;margin-top:2px;font-weight:700}
.stat-card.green{background:linear-gradient(135deg,#00A651,#008C45)}
.stat-card.blue{background:linear-gradient(135deg,#1565C0,#0D47A1)}
.stat-card.orange{background:linear-gradient(135deg,#FF6B35,#E55A2B)}
.stat-card.purple{background:linear-gradient(135deg,#9C27B0,#6A1B9A)}
.stat-card.teal{background:linear-gradient(135deg,#00897B,#00695C)}
.stat-card.gold{background:linear-gradient(135deg,#F57C00,#E65100)}
.stat-card.red{background:linear-gradient(135deg,#E53935,#C62828)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}

.hero-card{background:linear-gradient(135deg,#00A651,#008C45);border-radius:24px;padding:24px 20px;color:#fff;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,166,81,.25)}
.hero-label{font-size:13px;opacity:.9;font-weight:700;margin-bottom:6px}
.hero-amount{font-size:44px;font-weight:900;line-height:1;letter-spacing:-1px}
.hero-trend{display:inline-block;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:12px;font-weight:800;margin-top:10px}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.2)}
.hero-grid-cell .lbl{font-size:11px;opacity:.85;font-weight:700}
.hero-grid-cell .val{font-size:20px;font-weight:900;margin-top:2px}

.section-divider{display:flex;align-items:center;gap:8px;margin:24px 0 12px}
.section-divider .title{font-size:14px;font-weight:900}
.section-divider .line{flex:1;height:1px;background:linear-gradient(90deg,#ddd,transparent)}

.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.data-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.data-card-header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.data-card-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.data-card-info{flex:1;min-width:0}
.data-card-name{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.data-card-meta{font-size:11px;color:var(--mut);font-weight:700;margin-top:2px}
.data-card-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.data-card-actions button{padding:10px 14px;border-radius:10px;border:none;font-size:11px;font-weight:900;min-height:44px}

.tag{font-size:11px;font-weight:900;padding:6px 12px;border-radius:12px;background:#E8F5E9;color:#2E7D32;display:inline-block}
.tag.w{background:#FFF3E0;color:var(--warn)}
.tag.x{background:#f0f0f0;color:#888}
.tag.d{background:#FFEBEE;color:var(--danger)}
.tag.b{background:#E3F2FD;color:var(--blue)}
.tag.p{background:#F3E5F5;color:var(--purple)}

.empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:14px;background:#fff;border-radius:16px;font-weight:600}
.search-box{background:#fff;border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.04);margin-bottom:12px;min-height:52px}
.search-box input{border:none;outline:none;font-size:14px;font-weight:600;flex:1;background:transparent;padding:0;margin:0;min-height:auto}

.filter-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{padding:10px 16px;border-radius:16px;font-size:12px;font-weight:900;background:#fff;color:var(--mut);cursor:pointer;white-space:nowrap;border:1px solid var(--border);min-height:40px;display:flex;align-items:center;font-family:inherit}
.filter-chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}

.table-wrap{overflow-x:auto;background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
table.gp-table{width:100%;border-collapse:collapse;font-size:13px;min-width:500px}
table.gp-table th{background:#f8f9fa;padding:12px;text-align:left;border-bottom:2px solid #ddd;white-space:nowrap;font-weight:900;font-size:12px}
table.gp-table td{padding:12px;border-bottom:1px solid #eee;font-weight:600}
.money-pos{color:var(--brand);font-weight:900}
.text-right{text-align:right}
.text-center{text-align:center}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #eee}
.modal-hdr h2{font-size:18px;font-weight:900}
.close-btn{background:#f0f0f0;width:44px;height:44px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);background:#222;color:#fff;padding:14px 22px;border-radius:16px;font-size:14px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;z-index:999;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger)}

/* Chat */
.chat-container{position:fixed;inset:0;background:#EDF6DC;z-index:300;display:none;flex-direction:column}
.chat-container.show{display:flex}
.chat-header{background:linear-gradient(135deg,#00A651,#008C45);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:12px}
.chat-header .back-btn{background:rgba(255,255,255,.2);color:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;padding:0}
.chat-header .chat-info{flex:1}
.chat-header .chat-name{font-size:15px;font-weight:900}
.chat-header .chat-sub{font-size:11px;opacity:.85;font-weight:600;margin-top:2px}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.chat-msg{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;font-weight:600;line-height:1.4;word-wrap:break-word}
.chat-msg.out{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.chat-msg.in{align-self:flex-start;background:#fff;border-bottom-left-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.chat-msg .msg-time{font-size:10px;opacity:.7;margin-top:4px;font-weight:700}
.chat-msg .msg-image{max-width:100%;border-radius:10px;margin-bottom:6px;display:block;cursor:pointer}
.chat-msg .msg-slip{max-width:100%;border-radius:10px;margin-bottom:6px;display:block;cursor:pointer;border:2px solid #FFA500}
.chat-msg .msg-label{font-size:10px;opacity:.85;font-weight:800;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.chat-input-bar{background:#fff;padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--border)}
.chat-input-bar textarea{flex:1;margin:0;min-height:44px;max-height:120px;padding:10px 14px;resize:none;border-radius:22px;line-height:1.4;font-weight:600}
.chat-input-bar .icon-btn{width:44px;height:44px;min-height:44px;border-radius:50%;background:#f0f0f0;color:#555;font-size:20px;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.chat-input-bar .slip-btn{background:#FFF3E0;color:var(--warn)}
.chat-input-bar .send-btn{width:44px;height:44px;min-height:44px;border-radius:50%;background:var(--brand);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.chat-list-item{background:#fff;border-radius:14px;padding:14px;margin-bottom:8px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.04);cursor:pointer}
.chat-list-item .avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#00A651,#008C45);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-list-item .chat-info{flex:1;min-width:0}
.chat-list-item .chat-title{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-list-item .chat-preview{font-size:12px;color:var(--mut);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-list-item .chat-meta{text-align:right;flex-shrink:0}
.chat-list-item .chat-time{font-size:10px;color:var(--mut);font-weight:700}
.chat-list-item .chat-unread{background:var(--danger);color:#fff;font-size:10px;font-weight:900;border-radius:10px;padding:2px 6px;min-width:20px;text-align:center;margin-top:4px;display:inline-block}

.slip-badge{display:inline-flex;align-items:center;gap:4px;background:#FFF3E0;color:var(--warn);padding:2px 8px;border-radius:8px;font-size:10px;font-weight:900;margin-top:4px}

#debugConsole{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.9);color:#0f0;font-size:11px;font-family:monospace;padding:8px 12px;max-height:100px;overflow-y:auto;z-index:9999;display:none;border-top:2px solid #333}
#debugConsole.show{display:block}
#debugToggle{position:fixed;bottom:100px;right:12px;background:rgba(0,0,0,.7);color:#0f0;width:44px;height:44px;border-radius:50%;font-size:18px;z-index:9998;display:flex;align-items:center;justify-content:center;padding:0}

.install-banner{background:linear-gradient(135deg,#00A651,#008C45);color:#fff;padding:14px 16px;border-radius:16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,166,81,.3)}
.install-banner .txt{flex:1;font-size:13px;font-weight:700;line-height:1.4}
.install-banner button{background:#fff;color:var(--brand);padding:10px 16px;font-size:12px;font-weight:900;min-height:40px;flex-shrink:0}

.gp-progress{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.gp-progress-bar{height:10px;background:#f0f0f0;border-radius:5px;overflow:hidden;margin:8px 0}
.gp-progress-fill{height:100%;background:linear-gradient(90deg,#FFA500,#E65100);border-radius:5px;transition:width .5s}
</style>
</head>
<body>

<div class="toast" id="toast"></div>
<button id="debugToggle" onclick="toggleDebug()">🐞</button>
<div id="debugConsole"></div>
<button id="installBtn" onclick="installPWA()">
  <span style="font-size:20px">📲</span>
  <span>ติดตั้งแอป</span>
</button>

<!-- LOGIN -->
<div id="login">
  <div class="box">
    <h1>🛵 Chauat Go Admin</h1>
    <input type="email" id="em" placeholder="อีเมลผู้ดูแล" value="adminchauatgo@gmail.com" autocomplete="username">
    <input type="password" id="pw" placeholder="รหัสผ่าน" autocomplete="current-password">
    <button class="pri big" id="btn-login" onclick="handleLogin()">🔓 เข้าสู่ระบบ</button>
    <button class="sec big" style="margin-top:8px" onclick="handleForgot()">🔑 ลืมรหัสผ่าน</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <h1>Chauat Go Admin</h1>
    <div class="admin-info">
      <div id="who">-</div>
      <button onclick="handleLogout()">ออกจากระบบ</button>
    </div>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<!-- CHAT -->
<div class="chat-container" id="chat-container">
  <div class="chat-header">
    <button class="back-btn" onclick="closeChat()">←</button>
    <div class="chat-info">
      <div class="chat-name" id="chat-name">-</div>
      <div class="chat-sub" id="chat-sub">-</div>
    </div>
  </div>
  <div class="chat-messages" id="chat-messages"></div>
  <div class="chat-input-bar">
    <button class="icon-btn" onclick="pickChatImage()">📷</button>
    <button class="icon-btn slip-btn" onclick="pickChatSlip()">🧾</button>
    <input type="file" id="chat-image-input" accept="image/*" style="display:none">
    <input type="file" id="chat-slip-input" accept="image/*" style="display:none">
    <textarea id="chat-input" placeholder="พิมพ์ข้อความ..." rows="1"></textarea>
    <button class="send-btn" onclick="sendChatText()">➤</button>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-hdr">
      <h2 id="modal-title">Title</h2>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

<script>
// ═══════════════════════════════════════════════════════════════════
//  🛵 CHAUAT GO ADMIN v5.0 - PWA + GP 3% + Chat Images
// ═══════════════════════════════════════════════════════════════════

// ─── Firebase Init ───
firebase.initializeApp({
  apiKey: "AIzaSyB6PnikectfjjYfvO7VhpuxEIXQdJeASBM",
  authDomain: "chauat-go-b9841.firebaseapp.com",
  projectId: "chauat-go-b9841",
  storageBucket: "chauat-go-b9841.firebasestorage.app",
  messagingSenderId: "282197694521",
  appId: "1:282197694521:web:0528c22747a0c04bd815e8"
});

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

// ─── Constants ───
const GP_MERCHANT_RATE = 0.03;    // ร้านค้าจ่าย 3%
const GP_RIDER_RATE = 0.02;       // ไรเดอร์ได้ 2%
const GP_PLATFORM_RATE = 0.01;    // แพลตฟอร์มได้ 1%
const GP_FREE_DAYS = 60;          // 60 วันแรกฟรี
const GP_CYCLE_DAYS = 14;         // รอบตัดทุก 2 สัปดาห์

const store = { merchants: [], orders: [], riders: [], users: [], chats: [], gpSettlements: [] };
const filters = { orders: 'all', q: '', riderStatus: '', merchantStatus: 'all', gpRange: 'today', gpView: 'cycle' };
let current = 'dashboard';
let unsubs = [];
let activeChatId = null;
let activeChatUnsub = null;
let deferredPrompt = null;

const MASTER_ADMINS = ['adminchauatgo@gmail.com', 'admin@chauatgo.com', 'chauatgo@gmail.com'];

const SECTIONS = [
  ['dashboard', '📊', 'แดชบอร์ด'],
  ['gp', '💰', 'GP'],
  ['chats', '💬', 'แชท'],
  ['merchants', '🏪', 'ร้านค้า'],
  ['orders', '📋', 'ออเดอร์'],
  ['riders', '🛵', 'ไรเดอร์'],
  ['users', '👥', 'ผู้ใช้'],
  ['settings', '⚙️', 'ตั้งค่า']
];

const STATUS = {
  searching: '⏳ หาไรเดอร์', pending: '🔔 รอรับ', accepted: '🛵 รับแล้ว',
  picked_up: '📦 รับของ', on_the_way: '🚀 กำลังส่ง', done: '✅ เสร็จ', cancelled: '❌ ยกเลิก'
};

// ─── Helpers ───
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtInt = n => Number(n || 0).toLocaleString('th-TH');

function toast(m, err) {
  const t = $('toast');
  t.textContent = m;
  t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast', 3000);
}

function logToScreen(msg, isError = false) {
  const el = $('debugConsole');
  if (!el) return;
  el.innerHTML += `<div style="color:${isError ? '#ff4444' : '#00ff00'}">> ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

// ═══════════════════════════════════════════════════════════════════
//  💰 GP CALCULATION
// ═══════════════════════════════════════════════════════════════════

/**
 * คำนวณวันหมดอายุ GP ฟรี
 */
function getGPFreeEndDate(merchant) {
  const created = toDate(merchant.createdAt || merchant.gpAcceptedAt);
  if (!created) return null;
  const end = new Date(created);
  end.setDate(end.getDate() + GP_FREE_DAYS);
  return end;
}

/**
 * เช็คว่าร้านค้าเริ่มจ่าย GP หรือยัง
 */
function isMerchantGPActive(merchant) {
  const end = getGPFreeEndDate(merchant);
  if (!end) return false;
  return new Date() >= end;
}

/**
 * วันเหลือ GP ฟรี
 */
function getDaysLeftGP(merchant) {
  const end = getGPFreeEndDate(merchant);
  if (!end) return 0;
  const diff = Math.ceil((end - new Date()) / (1000 * 60 * 60 * 24));
  return Math.max(0, diff);
}

/**
 * คำนวณ GP จากยอดขาย
 */
function calcGP(amount, merchant) {
  if (!isMerchantGPActive(merchant)) {
    return { total: 0, rider: 0, platform: 0, free: true };
  }
  const total = Math.round(amount * GP_MERCHANT_RATE * 100) / 100;
  const rider = Math.round(amount * GP_RIDER_RATE * 100) / 100;
  const platform = Math.round(amount * GP_PLATFORM_RATE * 100) / 100;
  return { total, rider, platform, free: false };
}

/**
 * หา Round ของรอบ 2 สัปดาห์ (นับจากวันแรกของเดือน หรือวันสมัคร)
 */
function getCurrentCycle() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  // รอบที่ 1: วันที่ 1-14, รอบที่ 2: วันที่ 15-สิ้นเดือน
  const day = now.getDate();
  let start, end, cycleNum;
  if (day <= 14) {
    start = new Date(year, month, 1, 0, 0, 0);
    end = new Date(year, month, 14, 23, 59, 59);
    cycleNum = 1;
  } else {
    start = new Date(year, month, 15, 0, 0, 0);
    end = new Date(year, month + 1, 0, 23, 59, 59); // วันสุดท้ายของเดือน
    cycleNum = 2;
  }
  return { start, end, cycleNum, label: `${start.toLocaleDateString('th-TH', { day: '2-digit', month: 'short' })} - ${end.toLocaleDateString('th-TH', { day: '2-digit', month: 'short' })}` };
}

function getPreviousCycle() {
  const curr = getCurrentCycle();
  const prevEnd = new Date(curr.start);
  prevEnd.setDate(prevEnd.getDate() - 1);
  prevEnd.setHours(23, 59, 59);
  const day = prevEnd.getDate();
  const year = prevEnd.getFullYear();
  const month = prevEnd.getMonth();
  let start, cycleNum;
  if (day <= 14) {
    start = new Date(year, month, 1, 0, 0, 0);
    cycleNum = 1;
  } else {
    start = new Date(year, month, 15, 0, 0, 0);
    cycleNum = 2;
  }
  return { start, end: prevEnd, cycleNum, label: `${start.toLocaleDateString('th-TH', { day: '2-digit', month: 'short' })} - ${prevEnd.toLocaleDateString('th-TH', { day: '2-digit', month: 'short' })}` };
}

/**
 * คำนวณ GP ของร้านค้า ตามช่วงเวลา
 */
function getMerchantGPByRange(range) {
  const now = new Date();
  let from = new Date();
  let to = new Date();
  let label = '';

  if (range === 'today') {
    from.setHours(0, 0, 0, 0);
    label = 'วันนี้';
  } else if (range === 'yesterday') {
    from.setDate(from.getDate() - 1);
    from.setHours(0, 0, 0, 0);
    to.setDate(to.getDate() - 1);
    to.setHours(23, 59, 59);
    label = 'เมื่อวาน';
  } else if (range === 'cycle') {
    const c = getCurrentCycle();
    from = c.start;
    to = c.end;
    label = `รอบปัจจุบัน (${c.label})`;
  } else if (range === 'prev_cycle') {
    const c = getPreviousCycle();
    from = c.start;
    to = c.end;
    label = `รอบที่แล้ว (${c.label})`;
  } else if (range === 'month') {
    from = new Date(now.getFullYear(), now.getMonth(), 1);
    to = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
    label = 'เดือนนี้';
  }

  const completed = store.orders.filter(o => {
    if (o.status !== 'done') return false;
    const d = toDate(o.createdAt);
    return d && d >= from && d <= to;
  });

  let totalSales = 0, totalGP = 0, riderShare = 0, platformShare = 0, count = 0;
  const byMerchant = {};

  completed.forEach(o => {
    const fare = Number(o.fare || 0);
    const merchantId = o.merchantId || 'unknown';
    const merchant = store.merchants.find(m => m.id === merchantId);
    if (!merchant) return;

    const gp = calcGP(fare, merchant);
    
    const mName = merchant.name || 'ไม่ระบุ';
    if (!byMerchant[merchantId]) {
      byMerchant[merchantId] = {
        name: mName, sales: 0, gp: 0, riderShare: 0, platformShare: 0, count: 0,
        isActive: isMerchantGPActive(merchant),
        daysLeft: getDaysLeftGP(merchant)
      };
    }
    byMerchant[merchantId].sales += fare;
    byMerchant[merchantId].gp += gp.total;
    byMerchant[merchantId].riderShare += gp.rider;
    byMerchant[merchantId].platformShare += gp.platform;
    byMerchant[merchantId].count++;

    totalSales += fare;
    totalGP += gp.total;
    riderShare += gp.rider;
    platformShare += gp.platform;
    count++;
  });

  return { totalSales, totalGP, riderShare, platformShare, count, byMerchant, label, from, to };
}

async function handleLogin() {
  const btn = $('btn-login');
  const email = $('em').value.trim().toLowerCase();
  const pw = $('pw').value;

  if (!email || !pw) return toast('กรอกอีเมลและรหัสผ่าน', true);

  btn.disabled = true;
  btn.textContent = '⏳ กำลังเข้าสู่ระบบ...';
  logToScreen(`🔐 ล็อกอิน: ${email}`);

  try {
    const cred = await auth.signInWithEmailAndPassword(email, pw);
    logToScreen(`✅ ${cred.user.email}`);
    toast('✅ เข้าสู่ระบบสำเร็จ');
  } catch (err) {
    logToScreen(`❌ ${err.code}`, true);
    const msg = err.code === 'auth/wrong-password' ? 'รหัสผ่านไม่ถูกต้อง'
      : err.code === 'auth/user-not-found' ? 'ไม่พบบัญชีนี้'
      : err.code === 'auth/invalid-credential' ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง'
      : err.code === 'auth/too-many-requests' ? 'ลองหลายครั้งเกินไป รอ 5 นาที'
      : err.code === 'auth/network-request-failed' ? 'ไม่มีการเชื่อมต่อ'
      : 'ล้มเหลว: ' + err.code;
    toast(msg, true);
    btn.disabled = false;
    btn.textContent = '🔓 เข้าสู่ระบบ';
  }
  $('pw').value = '';
}

async function handleForgot() {
  const email = $('em').value.trim();
  if (!email) return toast('กรอกอีเมลก่อน', true);
  try {
    await auth.sendPasswordResetEmail(email);
    toast('📧 ส่งลิงก์รีเซ็ตแล้ว');
  } catch (err) { toast('ส่งไม่สำเร็จ', true); }
}

async function handleLogout() {
  if (!confirm('ออกจากระบบ?')) return;
  stop();
  await auth.signOut();
}

auth.onAuthStateChanged(async user => {
  stop();
  if (!user) {
    logToScreen('⛔ ยังไม่ล็อกอิน');
    $('login').classList.remove('hidden');
    $('app').classList.add('hidden');
    return;
  }

  const userEmail = (user.email || '').toLowerCase().trim();
  const isMasterAdmin = MASTER_ADMINS.some(e => e.toLowerCase() === userEmail);
  logToScreen(`👤 ${userEmail}`);

  if (!isMasterAdmin) {
    try {
      const adminSnap = await db.collection('admins').doc(user.uid).get();
      const isFirestoreAdmin = adminSnap.exists && ['active', 'super', 'admin'].includes(adminSnap.data().role);
      if (!isFirestoreAdmin) {
        toast('บัญชีนี้ไม่มีสิทธิ์เป็นผู้ดูแล', true);
        await auth.signOut();
        return;
      }
    } catch (err) {
      if (err.code === 'permission-denied' && !isMasterAdmin) {
        toast('ไม่มีสิทธิ์', true);
        await auth.signOut();
        return;
      }
    }
  }

  logToScreen('🚀 เข้า Dashboard');
  $('who').textContent = user.email;
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  start();
});

function start() {
  for (const k of ['merchants', 'orders', 'riders', 'users', 'chats']) {
    const unsub = db.collection(k).onSnapshot(s => {
      store[k] = s.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, err => logToScreen(`❌ [${k}] ${err.code}`, true));
    unsubs.push(unsub);
  }
  renderNav();
  render();
}

function stop() {
  unsubs.forEach(u => u());
  unsubs = [];
  for (const k in store) store[k] = [];
}

function getBadgeCounts() {
  const pendingMerchants = store.merchants.filter(m => !m.verified).length;
  const pendingRiders = store.riders.filter(r => r.verified === false).length;
  const newOrders = store.orders.filter(o => ['searching', 'pending'].includes(o.status)).length;
  const unreadChats = store.chats.reduce((sum, c) => sum + (c.unreadAdmin || 0), 0);
  return { pendingMerchants, pendingRiders, newOrders, unreadChats };
}

function renderNav() {
  const b = getBadgeCounts();
  $('nav').innerHTML = SECTIONS.map(([k, icon, label]) => {
    let badge = '';
    if (k === 'merchants' && b.pendingMerchants > 0) badge = `<span class="nav-badge">${b.pendingMerchants}</span>`;
    else if (k === 'riders' && b.pendingRiders > 0) badge = `<span class="nav-badge">${b.pendingRiders}</span>`;
    else if (k === 'orders' && b.newOrders > 0) badge = `<span class="nav-badge">${b.newOrders}</span>`;
    else if (k === 'chats' && b.unreadChats > 0) badge = `<span class="nav-badge">${b.unreadChats}</span>`;
    return `<button class="${k === current ? 'on' : ''}" data-go="${k}">
      ${badge}
      <div class="nav-icon">${icon}</div>
      <div class="nav-label">${label}</div>
    </button>`;
  }).join('');
}

function render() {
  const fn = { dashboard, gp, chats, merchants, orders, riders, users, settings }[current];
  if (fn) $('main').innerHTML = fn();
  renderNav();
}

function searchInput(ph) {
  return `<div class="search-box"><span style="font-size:18px;opacity:.5">🔍</span><input id="q" placeholder="${ph}" value="${esc(filters.q)}"></div>`;
}

        <tbody>${merchantTable}</tbody>

    ` : `
      <div style="font-size:12px;color:var(--mut);font-weight:700;margin-bottom:12px;padding:12px;background:#fff;border-radius:12px">
        ℹ️ ร้านค้าที่สมัครใหม่จะได้ฟรี GP 60 วันแรก หลังจากนั้นเริ่มจ่าย 3% (ไรเดอร์ 2% + แพลตฟอร์ม 1%)

function chats() {
  const list = [...store.chats].sort((a, b) => ts(b) - ts(a));
  if (list.length === 0) {
    return `<div class="empty"><div style="font-size:48px;margin-bottom:8px">💬</div>
      <div style="font-weight:800;font-size:15px">ยังไม่มีการสนทนา</div>
      <div style="font-size:12px;font-weight:600;margin-top:4px">แชทระหว่างไรเดอร์ ↔ ร้านค้า จะปรากฏที่นี่</div></div>`;
  }
  return list.map(c => {
    const title = c.participants?.map(p => p.name).join(' ↔ ') || 'การสนทนา';
    const unread = c.unreadAdmin || 0;
    return `<div class="chat-list-item" data-chat="${esc(c.id)}">
      <div class="avatar">💬</div>
      <div class="chat-info">
        <div class="chat-title">${esc(title)}</div>
        <div class="chat-preview">${esc((c.lastMessage || '—').substring(0, 50))}</div>
      </div>
      <div class="chat-meta">
        <div class="chat-time">${fmtTimeShort(c.lastMessageAt || c.createdAt)}</div>
        ${unread > 0 ? `<div class="chat-unread">${unread}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function openChat(chatId) {
  activeChatId = chatId;
  const c = store.chats.find(x => x.id === chatId);
  if (!c) return;
  $('chat-name').textContent = c.participants?.map(p => p.name).join(' ↔ ') || 'แชท';
  $('chat-sub').textContent = 'ไรเดอร์ ↔ ร้านค้า';
  $('chat-container').classList.add('show');
  $('chat-input').value = '';
  if (c.unreadAdmin > 0) db.collection('chats').doc(chatId).update({ unreadAdmin: 0 }).catch(() => {});
  if (activeChatUnsub) activeChatUnsub();
  activeChatUnsub = db.collection('chats').doc(chatId).collection('messages')
    .orderBy('createdAt', 'asc').limitToLast(100)
    .onSnapshot(snap => renderChatMessages(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
}

function closeChat() {
  $('chat-container').classList.remove('show');
  if (activeChatUnsub) { activeChatUnsub(); activeChatUnsub = null; }
  activeChatId = null;
}

function renderChatMessages(msgs) {
  if (msgs.length === 0) {
    $('chat-messages').innerHTML = '<div style="text-align:center;padding:40px;color:#999">เริ่มสนทนาได้เลย</div>';
    return;
  }
  const html = msgs.map(m => {
    const isAdmin = m.senderRole === 'admin';
    const cls = isAdmin ? 'out' : 'in';
    const senderName = !isAdmin && m.senderName ? `<div style="font-size:10px;font-weight:900;opacity:.8;margin-bottom:4px">${esc(m.senderName)}</div>` : '';
    let content = '';
    if (m.imageUrl) {
      const isSlip = m.type === 'slip';
      content += `<img src="${esc(m.imageUrl)}" class="msg-image${isSlip ? ' msg-slip' : ''}" onclick="window.open('${esc(m.imageUrl)}','_blank')">`;
      if (isSlip) content += `<div class="msg-label">🧾 สลิปโอนเงิน</div>`;
    }
    if (m.text) content += `<div>${esc(m.text)}</div>`;
    return `<div class="chat-msg ${cls}">${senderName}${content}<div class="msg-time">${fmtTimeShort(m.createdAt)}</div></div>`;
  }).join('');
  $('chat-messages').innerHTML = html;
  setTimeout(() => { $('chat-messages').scrollTop = $('chat-messages').scrollHeight; }, 50);
}

async function sendChatText() {
  const text = $('chat-input').value.trim();
  if (!text || !activeChatId) return;
  $('chat-input').value = '';
  try {
    await db.collection('chats').doc(activeChatId).collection('messages').add({
      text, senderRole: 'admin', senderName: 'Admin',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('chats').doc(activeChatId).update({
      lastMessage: `[Admin] ${text}`,
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) { toast('ส่งไม่สำเร็จ', true); }
}

function pickChatImage() {
  const input = $('chat-image-input');
  input.onchange = (e) => sendChatImage(e.target.files[0], false);
  input.click();
}

function pickChatSlip() {
  const input = $('chat-slip-input');
  input.onchange = (e) => sendChatImage(e.target.files[0], true);
  input.click();
}

async function sendChatImage(file, isSlip) {
  if (!file || !activeChatId) return;
  if (file.size > 5 * 1024 * 1024) return toast('รูปใหญ่เกิน 5MB', true);
  toast('⏳ กำลังอัปโหลด...');
  try {
    const folder = isSlip ? 'slips' : 'images';
    const path = `chats/${activeChatId}/${folder}/${Date.now()}.jpg`;
    const ref = storage.ref(path);
    await ref.put(file);
    const url = await ref.getDownloadURL();
    await db.collection('chats').doc(activeChatId).collection('messages').add({
      imageUrl: url,
      type: isSlip ? 'slip' : 'image',
      senderRole: 'admin',
      senderName: 'Admin',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('chats').doc(activeChatId).update({
      lastMessage: `[Admin] ${isSlip ? '🧾 สลิป' : '📷 รูปภาพ'}`,
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast(isSlip ? '✅ ส่งสลิปแล้ว' : '✅ ส่งรูปแล้ว');
  } catch (e) {
    toast('อัปโหลดไม่สำเร็จ: ' + e.message, true);
  }
}

function merchants() {
  const q = filters.q.toLowerCase(), st = filters.merchantStatus;
  const list = store.merchants.filter(m => {
    const mQ = !q || String(m.name || '').toLowerCase().includes(q);
    const mS = st === 'all' || (st === 'pending' && !m.verified) || (st === 'verified' && m.verified);
    return mQ && mS;
  });
  const pendingCount = store.merchants.filter(m => !m.verified).length;
  const verifiedCount = store.merchants.length - pendingCount;

  const filterBar = `<div class="filter-bar">
    <button class="filter-chip ${st === 'all' ? 'active' : ''}" data-mfilter="all">📋 ทั้งหมด (${store.merchants.length})</button>
    <button class="filter-chip ${st === 'pending' ? 'active' : ''}" data-mfilter="pending">⏳ รอ (${pendingCount})</button>
    <button class="filter-chip ${st === 'verified' ? 'active' : ''}" data-mfilter="verified">✅ อนุมัติ (${verifiedCount})</button>
  </div>`;

  return filterBar + searchInput('ค้นหาร้านค้า...') + (list.map(m => {
    const active = isMerchantGPActive(m);
    const daysLeft = getDaysLeftGP(m);
    return `<div class="data-card">
      <div class="data-card-header">
        <div class="data-card-icon" style="background:#E8F5E9">🏪</div>
        <div class="data-card-info">
          <div class="data-card-name">${esc(m.name || 'ไม่ระบุ')}</div>
          <div class="data-card-meta">📞 ${esc(m.phone || '—')} • ⭐ ${esc(m.rating || 0)}</div>
          <div class="data-card-meta">สมัคร ${fmtDate(m.createdAt || m.gpAcceptedAt)}</div>
        </div>
        <span class="tag ${m.verified ? '' : 'w'}">${m.verified ? '✅' : '⏳'}</span>
      </div>
      <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap">
        <span class="slip-badge">${active ? '💰 จ่าย GP 3%' : `🎁 ฟรี GP (${daysLeft} วัน)`}</span>
      </div>
      <div class="data-card-actions">
        <button class="${m.verified ? 'dan' : 'pri'}" data-verify-m="${esc(m.id)}">${m.verified ? '🚫 ยกเลิก' : '✅ อนุมัติ'}</button>
        <button class="blue" data-reset-gp="${esc(m.id)}">🔄 รีเซ็ตวัน GP</button>
        <button class="dan" data-del="merchants:${esc(m.id)}">🗑️ ลบ</button>
      </div>
    </div>`;
  }).join('') || '<div class="empty">ไม่พบร้านค้า</div>');
}

function orders() {
  const q = filters.q.toLowerCase();
  let list = store.orders.filter(o =>
    (filters.orders === 'all' || o.status === filters.orders) &&
    (!q || [o.title, o.userName, o.id].some(v => String(v || '').toLowerCase().includes(q)))
  );
  list = [...list].sort((a, b) => ts(b) - ts(a));

  const sel = `<select id="ofilter" style="margin-bottom:16px;padding:12px;min-height:52px">
    <option value="all">ทุกสถานะ</option>
    ${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${filters.orders === k ? 'selected' : ''}>${v}</option>`).join('')}
  </select>`;

  return searchInput('ค้นหาออเดอร์...') + sel + (list.map(o => {
    const merchant = store.merchants.find(m => m.id === o.merchantId);
    const gp = merchant ? calcGP(Number(o.fare || 0), merchant) : { total: 0 };
    return `<div class="data-card" data-order="${esc(o.id)}" style="cursor:pointer">
      <div class="data-card-header">
        <div class="data-card-icon" style="background:#E3F2FD">📋</div>
        <div class="data-card-info">
          <div class="data-card-name">${esc(o.title || 'ออเดอร์')}</div>
          <div class="data-card-meta">฿${esc(o.total || 0)} • GP ฿${gp.total.toFixed(2)}</div>
          <div class="data-card-meta">🕐 ${fmtTime(o.createdAt)}</div>
        </div>
        <span class="tag ${o.status === 'done' ? '' : o.status === 'cancelled' ? 'x' : 'w'}">${esc(STATUS[o.status] || o.status)}</span>
      </div>
    </div>`;
  }).join('') || '<div class="empty">ไม่พบออเดอร์</div>');
}

function riders() {
  const q = filters.q.toLowerCase();
  const verifiedCount = store.riders.filter(r => r.verified !== false).length;
  const pendingCount = store.riders.filter(r => r.verified === false).length;

  const filterBar = `<div class="filter-bar">
    <button class="filter-chip ${filters.riderStatus === '' ? 'active' : ''}" data-rfilter="">📋 ทั้งหมด (${store.riders.length})</button>
    <button class="filter-chip ${filters.riderStatus === 'pending' ? 'active' : ''}" data-rfilter="pending">⏳ รอ (${pendingCount})</button>
    <button class="filter-chip ${filters.riderStatus === 'verified' ? 'active' : ''}" data-rfilter="verified">✅ อนุมัติ (${verifiedCount})</button>
  </div>`;

  const filteredList = store.riders.filter(r => {
    const mQ = !q || String(r.name || '').toLowerCase().includes(q);
    if (filters.riderStatus === 'pending') return mQ && r.verified === false;
    if (filters.riderStatus === 'verified') return mQ && r.verified !== false;
    return mQ;
  });

  return filterBar + searchInput('ค้นหาไรเดอร์...') + (filteredList.map(r => {
    const verified = r.verified !== false;
    return `<div class="data-card">
      <div class="data-card-header">
        <div class="data-card-icon" style="background:#E8F5E9">🛵</div>
        <div class="data-card-info">
          <div class="data-card-name">${esc(r.name || 'ไม่ระบุ')}</div>
          <div class="data-card-meta">📞 ${esc(r.phone || '—')} • ⭐ ${esc(r.rating || 0)}</div>
        </div>
        <span class="tag ${verified ? '' : 'w'}">${verified ? '✅' : '⏳'}</span>
      </div>
      <div class="data-card-actions">
        <button class="${verified ? 'dan' : 'pri'}" data-verify-r="${esc(r.id)}">${verified ? '🚫 ยกเลิก' : '✅ อนุมัติ'}</button>
        <button class="dan" data-del="riders:${esc(r.id)}">🗑️ ลบ</button>
      </div>
    </div>`;
  }).join('') || '<div class="empty">ไม่พบไรเดอร์</div>');
}

function users() {
  const q = filters.q.toLowerCase();
  const list = store.users.filter(u => !q || [u.name, u.email, u.phone].some(v => String(v || '').toLowerCase().includes(q)));

function closeModal() { $('modal-overlay').classList.remove('show'); }

    <div style="font-weight:900;font-size:18px;margin:8px 0">${esc(o.title || '')}</div>

    </div>
    <button class="dan big" style="margin-top:16px" data-cancel-order="${esc(o.id)}">❌ ยกเลิกออเดอร์</button>
  `);
}

// ═══════════════════════════════════════════════════════════════════
//  🎯 EVENT DELEGATION
// ═══════════════════════════════════════════════════════════════════

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-go],[data-order],[data-verify-m],[data-verify-r],[data-del],[data-mfilter],[data-rfilter],[data-gp],[data-gpview],[data-chat],[data-cancel-order],[data-reset-gp]');
  if (!t) return;

  try {
    if (t.dataset.go) { current = t.dataset.go; filters.q = ''; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.gp) { filters.gpRange = t.dataset.gp; render(); return; }
    if (t.dataset.gpview) { filters.gpView = t.dataset.gpview; render(); return; }
    if (t.hasAttribute('data-mfilter')) { filters.merchantStatus = t.dataset.mfilter; render(); return; }
    if (t.hasAttribute('data-rfilter')) { filters.riderStatus = t.dataset.rfilter; render(); return; }
    if (t.dataset.chat) { openChat(t.dataset.chat); return; }
    if (t.dataset.order) { orderDetail(t.dataset.order); return; }

    if (t.dataset.verifyM) {
      const m = store.merchants.find(x => x.id === t.dataset.verifyM);
      if (!m) return;
      await db.collection('merchants').doc(m.id).update({
        verified: !m.verified,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      toast('✅ อัปเดตแล้ว');
      return;
    }

    if (t.dataset.resetGp) {
      if (!confirm('รีเซ็ตวันเริ่ม GP ของร้านนี้เป็นวันนี้?\n\n(ร้านจะได้ฟรี GP อีก 60 วัน)')) return;
      await db.collection('merchants').doc(t.dataset.resetGp).update({
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        gpAcceptedAt: firebase.firestore.FieldValue.serverTimestamp(),
        gpResetAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      toast('🔄 รีเซ็ตวัน GP สำเร็จ');
      return;
    }

    if (t.dataset.verifyR) {
      const r = store.riders.find(x => x.id === t.dataset.verifyR);
      if (!r) return;
      const nv = r.verified === false;
      await db.collection('riders').doc(r.id).update({
        verified: nv,
        verifiedAt: nv ? firebase.firestore.FieldValue.serverTimestamp() : null,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      toast(nv ? '✅ อนุมัติไรเดอร์' : '🚫 ยกเลิก');
      return;
    }

    if (t.dataset.cancelOrder) {
      if (!confirm('ยกเลิกออเดอร์?')) return;
      await db.collection('orders').doc(t.dataset.cancelOrder).update({
        status: 'cancelled',
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      toast('ยกเลิกแล้ว');
      closeModal();
      return;
    }

    if (t.dataset.del) {
      const [col, id] = t.dataset.del.split(':');
      if (confirm('⚠️ ยืนยันการลบ?')) {
        await db.collection(col).doc(id).delete();
        toast('ลบแล้ว');
      }
      return;
    }
  } catch (err) {
    console.error(err);
    toast('ไม่สำเร็จ: ' + (err.message || err.code), true);
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    filters.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const q = $('q');
    if (q) { q.focus(); q.setSelectionRange(pos, pos); }
  }
});

document.addEventListener('change', async e => {
  if (e.target.id === 'ofilter') { filters.orders = e.target.value; render(); }
  if (e.target.id === 'ostatus') {
    await db.collection('orders').doc(e.target.dataset.oid).update({
      status: e.target.value,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('✅ อัปเดต');
    closeModal();
  }
});

$('modal-overlay').addEventListener('click', e => {
  if (e.target === $('modal-overlay')) closeModal();
});

$('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChatText();
  }
});
