<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Chauat Go Admin</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'IBM Plex Sans Thai',sans-serif;-webkit-tap-highlight-color:transparent}
:root{--brand:#00A651;--brand-dark:#008C45;--bg:#EDF6DC;--text:#1A1A1A;--mut:#6B7280;--danger:#E53935;--warn:#E65100;--blue:#1565C0;--surface:#fff;--border:#e5e7eb}
body{background:var(--bg);color:var(--text);max-width:1000px;margin:0 auto;min-height:100vh;padding-bottom:40px}
.hidden{display:none!important}

/* Login Screen */
#login{position:fixed;inset:0;background:linear-gradient(135deg,#76B82A,#3B7A16);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.box{background:#fff;border-radius:20px;padding:32px 24px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.15)}
.box h1{font-size:22px;color:var(--brand);text-align:center;margin-bottom:20px}
input,select,textarea{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:12px;transition:border-color .2s;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
button{cursor:pointer;border:none;border-radius:10px;font-weight:800;font-size:13px;padding:10px 16px;transition:transform .1s,opacity .2s}
button:active{transform:scale(.97)}
.pri{background:var(--brand);color:#fff}.sec{background:#f0f0f0;color:#555}.dan{background:#FFEBEE;color:var(--danger)}.blue{background:var(--blue);color:#fff}
.big{width:100%;padding:14px;font-size:15px;border-radius:12px;margin-top:8px}
.tab-btns{display:flex;gap:6px;margin-bottom:16px;background:#f5f5f5;padding:4px;border-radius:12px}
.tab-btn{flex:1;padding:10px;border:none;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;background:transparent;color:var(--mut);transition:.2s}
.tab-btn.active{background:#fff;color:var(--brand);box-shadow:0 2px 6px rgba(0,0,0,.08)}

/* App Layout */
header{background:linear-gradient(135deg,#76B82A,#3B7A16);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;border-radius:0 0 20px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 4px 12px rgba(0,0,0,.1)}
header h1{flex:1;font-size:18px;font-weight:800}
header .admin-info{text-align:right;font-size:11px;opacity:.9;line-height:1.4}

nav{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:40;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;color:var(--mut);padding:10px 16px;font-size:13px;white-space:nowrap;border-radius:12px}
nav button.on{background:#E8F5E9;color:var(--brand);font-weight:800}

main{padding:16px}

/* Components */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.04);transition:transform .15s}
.card:active{transform:scale(.99)}
.num{font-size:28px;font-weight:800;color:var(--brand)}.lbl{font-size:12px;color:var(--mut);font-weight:600;margin-top:4px}
.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.nm{font-weight:800;font-size:15px}.meta{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.5;word-break:break-word}
.tag{font-size:11px;font-weight:800;padding:4px 10px;border-radius:12px;background:#E8F5E9;color:#2E7D32;display:inline-block}
.tag.w{background:#FFF3E0;color:var(--warn)}.tag.x{background:#f0f0f0;color:#888}.tag.b{background:#E3F2FD;color:var(--blue)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:14px;background:var(--surface);border-radius:16px}

/* Finance Table Styles */
.fin-table-wrap{overflow-x:auto;background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
table.fin-table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
table.fin-table th{background:#f8f9fa;padding:12px;text-align:left;border-bottom:2px solid #ddd;white-space:nowrap}
table.fin-table td{padding:10px 12px;border-bottom:1px solid #eee;vertical-align:middle}
table.fin-table tr:hover{background:#fafafa}
.highlight-row{background:#E8F5E9 !important}
.text-right{text-align:right}.text-center{text-align:center}
.money-pos{color:var(--brand);font-weight:800}.money-neg{color:var(--danger);font-weight:800}
.badge-warning{margin-top:10px;padding:8px;background:#fef2f2;border-radius:8px;font-size:11px;color:#b91c1c;font-weight:700;text-align:center;border:1px solid #fecaca}
.phase2-note{font-size:11px;color:#888;margin-top:8px;line-height:1.6}
.phase2-highlight{color:var(--brand);font-weight:700;display:block;margin-top:4px}
.bar-container{height:10px;background:#eee;border-radius:5px;overflow:hidden;margin-top:6px}
.bar-fill{height:100%;transition:width 0.5s}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #eee}
.modal-hdr h2{font-size:18px;font-weight:800}
.close-btn{background:#f0f0f0;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);background:#222;color:#fff;padding:12px 20px;border-radius:16px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:999;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.err{background:var(--danger)}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- Login Screen -->
<div id="login">
  <form class="box" id="login-form">
    <h1>🛵 Chauat Go Admin</h1>
    
    <!-- Tab Buttons -->
    <div class="tab-btns">
      <button type="button" class="tab-btn active" onclick="switchTab('login')">เข้าสู่ระบบ</button>
      <button type="button" class="tab-btn" onclick="switchTab('signup')">สมัครสมาชิก</button>
    </div>

    <!-- Login Form -->
    <div id="form-login">
      <input type="email" id="em" placeholder="อีเมลผู้ดูแล" autocomplete="username" required>
      <input type="password" id="pw" placeholder="รหัสผ่าน" autocomplete="current-password" required>
      <button class="pri big" type="submit">เข้าสู่ระบบ</button>
    </div>

    <!-- Signup Form -->
    <div id="form-signup" style="display:none">
      <input type="text" id="su-name" placeholder="ชื่อ-นามสกุล ผู้ดูแล" required>
      <input type="email" id="su-email" placeholder="อีเมล (เช่น admin@example.com)" required>
      <input type="password" id="su-pw" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)" minlength="6" required>
      <input type="password" id="su-pw2" placeholder="ยืนยันรหัสผ่าน" minlength="6" required>
      <button class="pri big" type="button" onclick="handleSignup()">✅ สมัครสมาชิก</button>
      <p style="font-size:11px;color:var(--mut);margin-top:12px;text-align:center">
        ⚠️ บัญชีใหม่ที่สมัครจะต้องถูกเพิ่มในรายชื่อ Admin<br>จึงจะสามารถเข้าถึงระบบได้
      </p>
    </div>
  </form>
</div>

<!-- App Screen -->
<div id="app" class="hidden">
  <header>
    <h1>Chauat Go Admin</h1>
    <div class="admin-info">
      <div id="who">admin@chauatgo.com</div>
      <button class="sec" id="logout" style="padding:4px 10px;font-size:11px;margin-top:4px">ออกจากระบบ</button>
    </div>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<!-- Generic Modal Container -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-box">
    <div class="modal-hdr">
      <h2 id="modal-title">Title</h2>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
// ─── Firebase Config ───
firebase.initializeApp({
  apiKey: "AIzaSyB6PnikectfjjYfvO7VhpuxEIXQdJeASBM",
  authDomain: "chauat-go-b9841.firebaseapp.com",
  projectId: "chauat-go-b9841",
  storageBucket: "chauat-go-b9841.firebasestorage.app",
  messagingSenderId: "282197694521",
  appId: "1:282197694521:web:0528c22747a0c04bd815e8"
});
const auth = firebase.auth(), db = firebase.firestore();

// ─── Helpers ──
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m, err) {
  const t = $('toast');
  t.textContent = m;
  t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast', 3000);
}

// ─── State ───
const SECTIONS = [
  ['dashboard', '📊 แดชบอร์ด'],
  ['finance', '💰 สรุปบัญชี'], // เพิ่มเมนูการเงิน
  ['merchants', '🏪 ร้านค้า'],
  ['orders', '📋 ออเดอร์'],
  ['riders', '🛵 ไรเดอร์'],
  ['users', '👥 ผู้ใช้']
];
const store = { merchants: [], orders: [], riders: [], users: [] };
const filters = { orders: 'all', q: '' };
let current = 'dashboard', unsubs = [];

const STATUS = {
  searching: '⏳ กำลังหาไรเดอร์', pending: '🔔 รอรับงาน', accepted: '🛵 รับงานแล้ว',
  picked_up: '📦 รับของแล้ว', on_the_way: '🚀 กำลังมาส่ง', done: '✅ เสร็จสิ้น', cancelled: '❌ ยกเลิก'
};

const itemsText = i => Array.isArray(i) ? i.map(x => `${x.name} x${x.qty}`).join(', ') : String(i ?? '');
const fmtTime = t => {
  if (!t) return '—';
  const d = t.toDate ? t.toDate() : new Date(t);
  return d.toLocaleString('th-TH', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
};
const ts = o => o.createdAt?.seconds || 0;

// ─── Tab Switching ───
function switchTab(tab) {
  const isLogin = tab === 'login';
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (i === 0 && isLogin) || (i === 1 && !isLogin));
  });
  $('form-login').style.display = isLogin ? 'block' : 'none';
  $('form-signup').style.display = isLogin ? 'none' : 'block';
}

// ─── Auth Logic ───
$('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('em').value.trim();
  const pw = $('pw').value;
  
  try {
    await auth.signInWithEmailAndPassword(email, pw);
  } catch (err) {
    toast('อีเมลหรือรหัสผ่านไม่ถูกต้อง', true);
  }
  $('pw').value = '';
});

async function handleSignup() {
  const name = $('su-name').value.trim();
  const email = $('su-email').value.trim();
  const pw = $('su-pw').value;
  const pw2 = $('su-pw2').value;

  if (!name || !email || !pw) return toast('กรุณากรอกข้อมูลให้ครบถ้วน', true);
  if (pw.length < 6) return toast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร', true);
  if (pw !== pw2) return toast('รหัสผ่านทั้งสองช่องไม่ตรงกัน', true);

  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pw);
    await cred.user.updateProfile({ displayName: name });
    
    // สร้างเอกสารใน collection admins เพื่อบันทึกประวัติ
    await db.collection('admins').doc(cred.user.uid).set({
      name, email, role: 'pending', // สถานะรอการอนุมัติ
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    toast('✅ สมัครสำเร็จ! กรุณาแจ้ง Super Admin เพื่ออนุมัติสิทธิ์');
    switchTab('login');
    $('em').value = email;
  } catch (err) {
    toast('สมัครไม่สำเร็จ: ' + err.message, true);
  }
}

$('logout').addEventListener('click', () => {
  stop();
  auth.signOut();
});

auth.onAuthStateChanged(async user => {
  stop();
  if (!user) {
    $('login').classList.remove('hidden');
    $('app').classList.add('hidden');
    return;
  }
  
  // ตรวจสอบสิทธิ์ Admin ตาม Rules ใหม่ (เช็คแค่ email ก็พอ)
  const ADMIN_EMAILS = ['adminchauatgo@gmail.com']; // เพิ่มอีเมลอื่นได้ที่นี่
  
  if (!ADMIN_EMAILS.includes(user.email)) {
    toast('บัญชีนี้ไม่มีสิทธิ์เป็นผู้ดูแล', true);
    await auth.signOut();
    return;
  }

  $('who').textContent = user.email;
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  start();
});

// ─── Data Listeners ───
function start() {
  const collections = ['merchants', 'orders', 'riders', 'users'];
  for (const k of collections) {
    const unsub = db.collection(k).onSnapshot(s => {
      store[k] = s.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, err => {
      console.error(`Error loading ${k}:`, err);
      toast('โหลดข้อมูล ' + k + ' ไม่สำเร็จ: ' + err.code, true);
    });
    unsubs.push(unsub);
  }
  renderNav();
  render();
}

function stop() {
  unsubs.forEach(u => u());
  unsubs = [];
  for (const k in store) store[k] = [];
}

// ─── UI Rendering ───
function renderNav() {
  $('nav').innerHTML = SECTIONS.map(([k, l]) => 
    `<button data-go="${k}" class="${k === current ? 'on' : ''}">${l}</button>`
  ).join('');
}

function render() {
  const f = { dashboard, finance, merchants, orders, riders, users }[current];
  $('main').innerHTML = f();
}

function searchInput(ph) {
  return `<input id="q" placeholder="${ph}" value="${esc(filters.q)}" style="margin-bottom:16px">`;
}

// ─── DASHBOARD (PHASE 1: CASH-IN-HAND MODEL) ───
function dashboard() {
  const today = new Date(); today.setHours(0,0,0,0);
  
  // 1. กรองเฉพาะงานเสร็จสิ้น (Done) เพื่อคิดเงินจริง
  const completedOrders = store.orders.filter(o => o.status === 'done');
  
  // ตัวแปรเก็บสถิติรวม
  let totalGrossFare = 0;      // ค่าขนส่งรวมก่อนหัก (Base Amount ที่ Rider เก็บมาจากลูกค้า)
  let platformRevenue = 0;     // รายได้แพลตฟอร์ม (20% ของ Fare) <- นี่คือเงินที่ต้องโอนเข้าบริษัท
  let riderPayoutDue = 0;      // เงินที่ Rider ได้ keeping ไว้ (80% ของ Fare) <- ไม่ใช่หนี้สินเรา แต่เป็นสิทธิเขา
  
  // สถิติแยกตามประเภทงาน (Food vs Transport vs Shopping)
  const typeStats = {
    food: { label: '🍽️ อาหาร', count: 0, fee: 0 },       
    transport: { label: '🛵 เดินทาง', count: 0, fee: 0 },  
    shopping: { label: '🛒 ซื้อของ', count: 0, fee: 0 },   
    other: { label: '📦 อื่นๆ', count: 0, fee: 0 }
  };

  // สถิติแยกตามยานพาหนะ
  const vehicleStats = {
    motorcycle: { name: '🏍️ มอเตอร์ไซค์', count: 0, revenue: 0 },
    car: { name: '🚗 รถเก๋ง/SUV', count: 0, revenue: 0 },
    truck: { name: '🚙 กระบะ/ตู้', count: 0, revenue: 0 },
    unknown: { name: '❓ ไม่ระบุ', count: 0, revenue: 0 }
  };

  // 2. Loop ผ่านทุกออเดอร์เพื่อคำนวณแบบ Real-time
  completedOrders.forEach(o => {
    const fare = Number(o.fare || 0);          // ค่าบริการขนส่ง (บาท)
    const rawType = (o.type || '').toLowerCase();
    
    // --- A. คำนวณส่วนแบ่ง 80/20 (Current Model) ---
    // แอปได้ 20% จากค่าขนส่งเท่านั้น (ไม่รวมค่าสินค้า)
    const cutPlatform = Math.round(fare * 0.20 * 100) / 100; 
    
    totalGrossFare += fare;
    platformRevenue += cutPlatform;
    riderPayoutDue += (fare - cutPlatform); // ส่วนที่ Rider เก็บไว้ใช้เอง
    
    // --- B. แยกสถิติตามประเภทงาน ---
    if (rawType.includes('food') || rawType.includes('eat')) {
      typeStats.food.count++; typeStats.food.fee += cutPlatform;
    } else if (rawType.includes('trans') || rawType.includes('ride') || rawType.includes('taxi')) {
      typeStats.transport.count++; typeStats.transport.fee += cutPlatform;
    } else if (rawType.includes('shop') || rawType.includes('buy') || rawType.includes('expres')) {
      typeStats.shopping.count++; typeStats.shopping.fee += cutPlatform;
    } else {
      typeStats.other.count++; typeStats.other.fee += cutPlatform;
    }

    // --- C. แยกสถิติตามยานพาหนะ (ดึงจาก Rider Profile หรือ Order Data) ---
    let vKey = 'unknown';
    // พยายามหาข้อมูลรถจาก order.rider.vehicle ก่อน ถ้าไม่มีค่อยเช็คจาก store.riders
    const rData = o.rider?.vehicle || (store.riders.find(r => r.id === o.riderId)?.vehicle) || '';
    const vLower = String(rData).toLowerCase();
    
    if (vLower.includes('moto') || vLower.includes('bike') || vLower.includes('มอไซ')) vKey = 'motorcycle';
    else if (vLower.includes('car') || vLower.includes('sedan') || vLower.includes('เก๋ง')) vKey = 'car';
    else if (vLower.includes('truck') || vLower.includes('van') || vLower.includes('กระบะ') || vLower.includes('ตู้')) vKey = 'truck';
    
    vehicleStats[vKey].count++;
    vehicleStats[vKey].revenue += cutPlatform;
  });

  // 3. สร้าง HTML Display
  
  // ส่วนที่ 1: การ์ดสรุปการเงินหลัก (เน้นความเข้าใจง่ายเรื่อง Cash Flow)
  const financeCards = `
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:16px; margin-bottom:24px;">
      
      <!-- การ์ด 1: รายได้จริงของแพลตฟอร์ม (สิ่งที่แอปได้รับเมื่อ Rider โอนเข้ามา) -->
      <div class="card" style="border-top:5px solid var(--brand); background:#f0fdf4;">
        <div style="font-size:13px; color:#166534; font-weight:800; margin-bottom:4px;">💰 รายได้แพลตฟอร์ม (20% GP)</div>
        <div style="font-size:36px; font-weight:900; color:var(--brand); line-height:1;">฿${platformRevenue.toLocaleString(undefined,{minimumFractionDigits:2})}</div>
        <div style="font-size:12px; color:#166534; margin-top:8px; opacity:0.8;">จาก ${completedOrders.length} งานวันนี้</div>
        <div class="badge-warning">⚠️ รอ Rider โอนเข้าบัญชี</div>
      </div>

// ─── FINANCE REPORT FUNCTION ───
function finance() {
  const today = new Date(); today.setHours(0,0,0,0);
  const yesterdayStart = new Date(today); yesterdayStart.setDate(yesterdayStart.getDate() - 1);
  
  // Filter orders ที่เสร็จสิ้นเท่านั้น
  const completedOrders = store.orders.filter(o => o.status === 'done');
  
  let totalGrossAll = 0;      // ยอดขายรวมทั้งหมด (ก่อนหัก)
  let totalPlatformFeeAll = 0; // ค่าธรรมเนียมแพลตฟอร์ม (20%)
  let totalRiderEarnAll = 0;   // รายได้ไรเดอร์สุทธิ (80%)
  
  // Structure data per rider
  const riderStats = {}; 

  completedOrders.forEach(o => {
    const fare = Number(o.fare || 0); // ค่าส่งอย่างเดียว ไม่รวมค่าสินค้า
    if (fare <= 0) return; 

    const platformFee = Math.round(fare * 0.20 * 100) / 100; // 20%
    const riderEarn = fare - platformFee; // 80%
    
    const rId = o.riderId || 'unknown';
    const rName = o.rider?.name || o.riderName || 'ไม่ระบุชื่อ';
    const orderDate = o.createdAt ? (o.createdAt.toDate ? o.createdAt.toDate() : new Date(o.createdAt)) : null;
    
    if (!orderDate) return;

    // Initialize rider object if not exists
    if (!riderStats[rId]) {
      riderStats[rId] = {
        id: rId, name: rName,
        today: { count: 0, amount: 0 },
        yesterday: { count: 0, amount: 0 },
        total: { count: 0, amount: 0 }
      };
    }

    // Update Totals
    totalGrossAll += fare;
    totalPlatformFeeAll += platformFee;
    totalRiderEarnAll += riderEarn;

    // Update Per-Rider Stats
    riderStats[rId].total.count++;
    riderStats[rId].total.amount += riderEarn;

    if (orderDate >= today) {
      riderStats[rId].today.count++;
      riderStats[rId].today.amount += riderEarn;
    } else if (orderDate >= yesterdayStart && orderDate < today) {
      riderStats[rId].yesterday.count++;
      riderStats[rId].yesterday.amount += riderEarn;
    }
  });

  // Convert to array and sort by Today's earning (Highest first)
  const sortedRiders = Object.values(riderStats).sort((a,b) => b.today.amount - a.today.amount);

  // Generate HTML Table Rows
  let tableRows = '';
  if (sortedRiders.length === 0) {
    tableRows = '<tr><td colspan="6" style="text-align:center;padding:20px;color:#999">ยังไม่มีออเดอร์ที่เสร็จสมบูรณ์</td></tr>';
  } else {
    sortedRiders.forEach(r => {
      // Highlight row if has earnings today
      const highlightStyle = r.today.amount > 0 ? 'class="highlight-row"' : '';
      
      tableRows += `
        <tr ${highlightStyle}>
          <td style="font-weight:800">${esc(r.name)}</td>
          <td class="text-center">${r.today.count}</td>
          <td class="text-right money-pos">฿${r.today.amount.toFixed(2)}</td>
          <td class="text-center" style="color:#888">${r.yesterday.count}</td>
          <td class="text-right" style="color:#888">฿${r.yesterday.amount.toFixed(2)}</td>
          <td class="text-right" style="font-weight:900;color:var(--warn)">฿${r.total.amount.toFixed(2)}</td>
        </tr>
      `;
    });
  }

  return `
    <!-- Summary Cards -->
    <div class="grid" style="margin-bottom:20px">
      <div class="card" style="border-left:4px solid var(--mut)">
        <div class="num" style="color:var(--mut)">฿${totalGrossAll.toLocaleString(undefined,{minimumFractionDigits:2})}</div>
        <div class="lbl">ยอดขายรวม (ก่อนหัก)</div>
      </div>
      <div class="card" style="border-left:4px solid var(--danger)">
        <div class="num" style="color:var(--danger)">฿${totalPlatformFeeAll.toLocaleString(undefined,{minimumFractionDigits:2})}</div>
        <div class="lbl">รายได้แพลตฟอร์ม (20%)</div>
      </div>
      <div class="card" style="border-left:4px solid var(--brand)">
        <div class="num" style="color:var(--brand)">฿${totalRiderEarnAll.toLocaleString(undefined,{minimumFractionDigits:2})}</div>
        <div class="lbl">ค่าตอบแทนไรเดอร์ (80%)</div>
      </div>
    </div>

    <!-- Detailed Table -->
    <div class="fin-table-wrap">
      <table class="fin-table">
        <thead>
          <tr>
            <th>ไรเดอร์</th>
            <th class="text-center">วันนี้<br>(งาน)</th>
            <th class="text-right">วันนี้<br>(บาท)</th>
            <th class="text-center">เมื่อวาน<br>(งาน)</th>
            <th class="text-right">เมื่อวาน<br>(บาท)</th>
            <th class="text-right" style="background:#FFF3E0;color:var(--warn)">ยอดค้างจ่าย<br>(สะสม)</th>
          </tr>
        </thead>
        <tbody>
          ${tableRows}
        </tbody>
        <tfoot>
          <tr style="background:#eee;font-weight:900;border-top:2px solid #ccc">
            <td>รวมทั้งหมด</td>
            <td class="text-center">${completedOrders.length}</td>
            <td class="text-right">-</td>
            <td class="text-center">-</td>
            <td class="text-right">-</td>
            <td class="text-right" style="color:var(--warn)">฿${totalRiderEarnAll.toFixed(2)}</td>
          </tr>
        </tfoot>
      </table>
    </div>
    
    <p style="font-size:11px;color:#888;margin-top:10px;text-align:center">
      * ข้อมูลอัปเดตอัตโนมัติเมื่อมีออเดอร์สถานะ "เสร็จสิ้น"<br>
      * คอลัมน์สุดท้ายคือยอดรวมที่ไรเดอร์ได้รับ (หลังหัก 20%) แต่ยังไม่ได้ตัดยอดโอนจริง
    </p>
  `;
}

async function saveMerchantEdit(id) {
  const updates = {
    name: $('edit-name').value.trim(),
    phone: $('edit-phone').value.trim(),
    address: $('edit-address').value.trim(),
    lat: parseFloat($('edit-lat').value) || null,
    lng: parseFloat($('edit-lng').value) || null,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  
  if(!updates.name) return toast('กรุณากรอกชื่อร้าน', true);

  try {
    await db.collection('merchants').doc(id).update(updates);
    toast('บันทึกเรียบร้อย');
    closeModal();
  } catch(e) {
    toast('บันทึกไม่สำเร็จ: ' + e.message, true);
  }
}

async function cancelOrder(id) {
  if(!confirm('ยืนยันการยกเลิกออเดอร์นี้?')) return;
  try {
    await db.collection('orders').doc(id).update({
      status: 'cancelled',
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('ยกเลิกออเดอร์แล้ว');
    closeModal();
  } catch(e) {
    toast('ยกเลิกไม่สำเร็จ', true);
  }
}

// ─── Event Delegation ───
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-go],[data-order],[data-verify],[data-rider],[data-del],[data-edit-m]');
  if (!t) return;
  
  try {
    if (t.dataset.go) {
      current = t.dataset.go;
      filters.q = '';
      renderNav();
      render();
      window.scrollTo(0, 0);
    } 
    else if (t.dataset.order) {
      orderDetail(t.dataset.order);
    } 
    else if (t.dataset.editM) {
      editMerchantForm(t.dataset.editM);
    }
    else if (t.dataset.verify) {
      const m = store.merchants.find(x => x.id === t.dataset.verify);
      await db.collection('merchants').doc(m.id).update({ 
        verified: !m.verified, 
        updatedAt: firebase.firestore.FieldValue.serverTimestamp() 
      });
      toast('อัปเดตสถานะร้านสำเร็จ');
    } 
    else if (t.dataset.rider) {
      const r = store.riders.find(x => x.id === t.dataset.rider);
      await db.collection('riders').doc(r.id).update({ 
        status: r.status === 'active' ? 'inactive' : 'active' 
      });
      toast('อัปเดตสถานะไรเดอร์สำเร็จ');
    } 
    else if (t.dataset.del) {
      const [col, id] = t.dataset.del.split(':');
      if (confirm('⚠️ ยืนยันการลบข้อมูลนี้?\nการกระทำนี้ไม่สามารถย้อนกลับได้')) {
        await db.collection(col).doc(id).delete();
        toast('ลบข้อมูลสำเร็จ');
      }
    }
  } catch (err) {
    console.error(err);
    toast('ไม่สำเร็จ: ' + err.code, true);
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    filters.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const q = $('q');
    if (q) {
      q.focus();
      q.setSelectionRange(pos, pos);
    }
  }
});

document.addEventListener('change', async e => {
  if (e.target.id === 'ofilter') {
    filters.orders = e.target.value;
    render();
  }
  if (e.target.id === 'ostatus') {
    try {
      await db.collection('orders').doc(e.target.dataset.oid).update({ 
        status: e.target.value, 
        updatedAt: firebase.firestore.FieldValue.serverTimestamp() 
      });
      toast('อัปเดตสถานะออเดอร์แล้ว');
      closeModal();
    } catch (err) {
      toast('ไม่สำเร็จ: ' + err.code, true);
    }
  }
});

// Close modal on outside click
$('modal-overlay').addEventListener('click', e => {
  if (e.target === $('modal-overlay')) closeModal();
});
</script>
</body>
</html>
