<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Chauat Go Admin</title>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script>
(function() {
  const APP_VERSION = 'v3.3.0';
  const savedVersion = localStorage.getItem('chauat_app_version');
  if (savedVersion && savedVersion !== APP_VERSION) {
    localStorage.setItem('chauat_app_version', APP_VERSION);
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage('FORCE_UPDATE');
    }
    if ('caches' in window) {
      caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k))))
        .then(() => location.reload(true));
    } else { location.reload(true); }
    return;
  }
  localStorage.setItem('chauat_app_version', APP_VERSION);
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
        .then(reg => {
          setInterval(() => reg.update(), 30000);
          reg.update();
        }).catch(err => console.warn('[SW]', err));
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload(true);
      });
    });
  }
})();
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'IBM Plex Sans Thai',sans-serif;-webkit-tap-highlight-color:transparent}
:root{--brand:#00A651;--brand-dark:#008C45;--bg:#EDF6DC;--text:#1A1A1A;--mut:#6B7280;--danger:#E53935;--warn:#E65100;--blue:#1565C0;--purple:#9C27B0;--surface:#fff;--border:#e5e7eb}
body{background:var(--bg);color:var(--text);max-width:1000px;margin:0 auto;min-height:100vh;padding-bottom:40px}
.hidden{display:none!important}
.ripple{position:relative;overflow:hidden;isolation:isolate}
.ripple::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle,rgba(255,255,255,.45) 10%,transparent 11%);background-position:center;background-size:0% 0%;background-repeat:no-repeat;transition:background-size .5s ease-out;pointer-events:none}
.ripple:active::after{background-size:250% 250%}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#76B82A,#3B7A16);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;overflow-y:auto}
.box{background:#fff;border-radius:20px;padding:32px 24px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.15);margin:auto}
.box h1{font-size:22px;color:var(--brand);text-align:center;margin-bottom:20px;font-weight:900}
input,select,textarea{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:12px;transition:border-color .2s;font-family:inherit;font-weight:600;min-height:52px;outline:none;background:#fafafa}
input:focus,select:focus,textarea:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(0,166,81,.1)}
button{cursor:pointer;border:none;border-radius:10px;font-weight:800;font-size:13px;padding:10px 16px;transition:transform .1s;font-family:inherit;min-height:44px}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:not-allowed}
.pri{background:var(--brand);color:#fff}
.sec{background:#f0f0f0;color:#555}
.dan{background:#FFEBEE;color:var(--danger)}
.blue{background:var(--blue);color:#fff}
.big{width:100%;padding:14px;font-size:15px;border-radius:12px;margin-top:8px;min-height:56px}
.tab-btns{display:flex;gap:6px;margin-bottom:16px;background:#f5f5f5;padding:4px;border-radius:12px}
.tab-btn{flex:1;padding:12px;border:none;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;background:transparent;color:var(--mut);transition:.2s;font-family:inherit}
.tab-btn.active{background:#fff;color:var(--brand);box-shadow:0 2px 6px rgba(0,0,0,.08)}
header{background:linear-gradient(135deg,#76B82A,#3B7A16);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;border-radius:0 0 20px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 4px 12px rgba(0,0,0,.1)}
header h1{flex:1;font-size:18px;font-weight:900;display:flex;align-items:center;gap:6px}
header h1 .vbadge{font-size:10px;background:rgba(255,255,255,.25);padding:3px 8px;border-radius:10px;font-weight:700}
header .admin-info{text-align:right;font-size:11px;opacity:.95;line-height:1.4}
header .admin-info button{padding:8px 14px;font-size:11px;margin-top:4px;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3);min-height:36px}

/* ─── NAV ใหม่: Grid 4×2, Icon 44×44 ─── */
nav{background:#fff;padding:12px 8px;border-bottom:1px solid var(--border);position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:40;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav button{background:transparent;color:var(--mut);padding:10px 4px;border-radius:12px;font-weight:700;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.2s;min-height:auto}
nav button .nav-icon{font-size:26px;line-height:1;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#f5f5f5;transition:.2s}
nav button .nav-label{font-size:10px;font-weight:900;text-align:center;line-height:1.2}
nav button .nav-badge{position:absolute;top:2px;right:2px;background:var(--danger);color:#fff;font-size:9px;font-weight:900;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
nav button{position:relative}
nav button.on{color:var(--brand)}
nav button.on .nav-icon{background:#E8F5E9;box-shadow:0 4px 12px rgba(0,166,81,.2)}

main{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.04);transition:transform .15s}
.card:active{transform:scale(.99)}
.num{font-size:28px;font-weight:900;color:var(--brand)}
.lbl{font-size:12px;color:var(--mut);font-weight:600;margin-top:4px}
.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.nm{font-weight:900;font-size:15px}
.meta{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.5;word-break:break-word;font-weight:600}
.tag{font-size:11px;font-weight:900;padding:6px 12px;border-radius:12px;background:#E8F5E9;color:#2E7D32;display:inline-block;min-height:28px;line-height:1.2}
.tag.w{background:#FFF3E0;color:var(--warn)}
.tag.x{background:#f0f0f0;color:#888}
.tag.b{background:#E3F2FD;color:var(--blue)}
.tag.d{background:#FFEBEE;color:var(--danger)}
.empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:14px;background:var(--surface);border-radius:16px;font-weight:600}
.fin-table-wrap{overflow-x:auto;background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
table.fin-table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
table.fin-table th{background:#f8f9fa;padding:12px;text-align:left;border-bottom:2px solid #ddd;white-space:nowrap;font-weight:900}
table.fin-table td{padding:12px;border-bottom:1px solid #eee;vertical-align:middle}
.highlight-row{background:#E8F5E9!important}
.text-right{text-align:right}
.text-center{text-align:center}
.money-pos{color:var(--brand);font-weight:900}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(0px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s,backdrop-filter .3s}
.modal-overlay.show{opacity:1;pointer-events:auto;backdrop-filter:blur(4px)}
.modal{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;transform:translateY(20px) scale(.95);transition:transform .35s cubic-bezier(.32,.72,0,1)}
.modal-overlay.show .modal{transform:translateY(0) scale(1);animation:modalBounce .4s cubic-bezier(.32,.72,0,1)}
@keyframes modalBounce{0%{transform:translateY(20px) scale(.95)}55%{transform:translateY(-4px) scale(1.01)}100%{transform:translateY(0) scale(1)}}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #eee}
.modal-hdr h2{font-size:18px;font-weight:900}
.close-btn{background:#f0f0f0;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;min-height:44px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);background:#222;color:#fff;padding:14px 22px;border-radius:16px;font-size:14px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;z-index:999;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger)}
.hero-card{background:linear-gradient(135deg,#00A651 0%,#008C45 100%);border-radius:24px;padding:24px 20px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,166,81,.25)}
.hero-card::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%);border-radius:50%;pointer-events:none}
.hero-label{font-size:13px;opacity:.9;font-weight:700;margin-bottom:6px;position:relative;z-index:1}
.hero-amount{font-size:44px;font-weight:900;line-height:1;letter-spacing:-1px;position:relative;z-index:1}
.hero-trend{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:12px;font-weight:800;margin-top:10px;position:relative;z-index:1}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.2);position:relative;z-index:1}
.hero-grid-cell .lbl{font-size:11px;opacity:.85;font-weight:700}
.hero-grid-cell .val{font-size:20px;font-weight:900;margin-top:2px}
.section-divider{display:flex;align-items:center;gap:8px;margin:24px 0 12px}
.section-divider .title{font-size:14px;font-weight:900;color:var(--text)}
.section-divider .line{flex:1;height:1px;background:linear-gradient(90deg,#ddd,transparent)}
.action-card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,.04);cursor:pointer;transition:transform .15s;min-height:76px}
.action-card:active{transform:scale(.98)}
.action-card.warn{border-left:4px solid var(--warn);background:#FFFBEB}
.action-card.danger{border-left:4px solid var(--danger);background:#FFEBEE}
.action-card.blue{border-left:4px solid var(--blue);background:#EFF6FF}
.action-card.green{border-left:4px solid var(--brand);background:#F0FDF4}
.action-icon{font-size:28px;flex-shrink:0;line-height:1}
.action-info{flex:1;min-width:0}
.action-title{font-size:14px;font-weight:800;line-height:1.3}
.action-card.warn .action-title{color:#92400e}
.action-card.danger .action-title{color:#991b1b}
.action-card.blue .action-title{color:#1e40af}
.action-card.green .action-title{color:#166534}
.action-value{font-size:20px;font-weight:900;margin-top:2px;letter-spacing:-.3px}
.action-card.warn .action-value{color:var(--warn)}
.action-card.danger .action-value{color:var(--danger)}
.action-card.blue .action-value{color:var(--blue)}
.action-card.green .action-value{color:var(--brand)}
.action-sub{font-size:11px;color:var(--mut);margin-top:2px;font-weight:700}
.action-btn{flex-shrink:0;padding:10px 14px;border-radius:12px;font-size:12px;font-weight:900;border:none;cursor:pointer;font-family:inherit;transition:transform .15s;min-height:44px}
.action-btn:active{transform:scale(.95)}
.action-btn.green{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(0,166,81,.25)}
.action-btn.orange{background:var(--warn);color:#fff;box-shadow:0 4px 12px rgba(230,81,0,.25)}
.action-btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(21,101,192,.25)}
.data-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:0 2px 12px rgba(0,0,0,.04);transition:transform .15s}
.data-card:active{transform:scale(.98)}
.data-card-header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.data-card-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.data-card-info{flex:1;min-width:0}
.data-card-name{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.data-card-meta{font-size:11px;color:var(--mut);font-weight:700;margin-top:2px}
.data-card-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.data-card-actions button{padding:10px 14px;border-radius:10px;border:none;font-size:11px;font-weight:900;cursor:pointer;font-family:inherit;transition:transform .15s;min-height:44px}
.data-card-actions button:active{transform:scale(.95)}
.search-box{background:#fff;border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.04);margin-bottom:12px;min-height:52px}
.search-box input{border:none;outline:none;font-size:14px;font-weight:600;flex:1;background:transparent;padding:0;margin:0;min-height:auto}
.filter-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{padding:10px 16px;border-radius:16px;font-size:12px;font-weight:900;background:#fff;color:var(--mut);cursor:pointer;white-space:nowrap;border:1px solid var(--border);min-height:40px;display:flex;align-items:center;font-family:inherit}
.filter-chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}

/* ─── Dashboard: ร้านค้าที่ร่วม ChauatGo ─── */
.merchant-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;margin-bottom:12px}
.merchant-scroll::-webkit-scrollbar{display:none}
.merchant-mini{flex-shrink:0;width:140px;background:#fff;border-radius:14px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04);border:2px solid transparent;cursor:pointer;transition:.2s}
.merchant-mini:active{transform:scale(.97);border-color:var(--brand)}
.merchant-mini .mini-icon{font-size:32px;margin-bottom:6px}
.merchant-mini .mini-name{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.merchant-mini .mini-verified{font-size:10px;font-weight:900}
.merchant-mini.verified{border-color:#86efac}
.merchant-mini.pending{border-color:#fdba74}

/* ─── Slip ─── */
.slip-upload-box{background:#F0FDF4;border:2px dashed #86efac;border-radius:14px;padding:20px;text-align:center;cursor:pointer;transition:.2s;margin-bottom:12px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.slip-upload-box:active{transform:scale(.98);background:#DCFCE7}
.slip-upload-box .icon{font-size:38px;line-height:1}
.slip-upload-box .label{font-size:13px;font-weight:900;color:#166534}
.slip-upload-box .hint{font-size:11px;color:#166534;opacity:.7;font-weight:600}
.slip-preview{width:100%;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1);margin-bottom:12px;display:block;max-height:400px;object-fit:contain;background:#f5f5f5}
.slip-progress{height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden;margin-bottom:12px}
.slip-progress-bar{height:100%;background:var(--brand);width:0%;transition:width .3s ease-out;border-radius:3px}
.slip-status-banner{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;margin-bottom:12px;font-size:12px;font-weight:800}
.slip-status-banner.pending{background:#FFFBEB;color:#92400e;border-left:4px solid var(--warn)}
.slip-status-banner.ok{background:#F0FDF4;color:#166534;border-left:4px solid var(--brand)}

/* ─── Chat ─── */
.chat-container{position:fixed;inset:0;background:#EDF6DC;z-index:300;display:flex;flex-direction:column;max-width:1000px;margin:0 auto;opacity:0;pointer-events:none;transition:opacity .25s}
.chat-container.show{opacity:1;pointer-events:auto}
.chat-header{background:linear-gradient(135deg,#00A651,#008C45);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.chat-header .back-btn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;padding:0;min-height:44px}
.chat-header .chat-info{flex:1;min-width:0}
.chat-header .chat-name{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-header .chat-sub{font-size:11px;opacity:.85;font-weight:600;margin-top:2px}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:#EDF6DC}
.chat-msg{max-width:75%;padding:10px 14px;border-radius:16px;font-size:14px;font-weight:600;line-height:1.4;word-wrap:break-word;animation:msgIn .2s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.chat-msg.out{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.chat-msg.in{align-self:flex-start;background:#fff;color:var(--text);border-bottom-left-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.chat-msg .msg-time{font-size:10px;opacity:.7;margin-top:4px;font-weight:700}
.chat-msg .msg-image{max-width:100%;border-radius:10px;margin-bottom:6px;display:block;cursor:pointer}
.chat-msg.from-admin{background:linear-gradient(135deg,#9C27B0,#6A1B9A)}
.chat-input-bar{background:#fff;padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--border);box-shadow:0 -4px 12px rgba(0,0,0,.05)}
.chat-input-bar textarea{flex:1;margin:0;min-height:44px;max-height:120px;padding:10px 14px;font-size:14px;resize:none;border-radius:22px;line-height:1.4;font-weight:600}
.chat-input-bar .icon-btn{width:44px;height:44px;min-height:44px;border-radius:50%;background:#f0f0f0;color:#555;font-size:20px;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.chat-input-bar .send-btn{width:44px;height:44px;min-height:44px;border-radius:50%;background:var(--brand);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.chat-input-bar .send-btn:disabled{background:#ccc;cursor:not-allowed}
.chat-empty{text-align:center;padding:40px 20px;color:var(--mut);font-size:13px;font-weight:600}
.chat-day-divider{text-align:center;font-size:11px;color:var(--mut);font-weight:800;margin:12px 0;padding:4px 12px;background:rgba(255,255,255,.7);border-radius:12px;align-self:center}
.chat-list-item{background:#fff;border-radius:14px;padding:14px;margin-bottom:8px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.04);cursor:pointer;transition:.15s}
.chat-list-item:active{transform:scale(.98);background:#f8fdf8}
.chat-list-item .avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#00A651,#008C45);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-list-item .chat-info{flex:1;min-width:0}
.chat-list-item .chat-title{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-list-item .chat-preview{font-size:12px;color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat-list-item .chat-meta{text-align:right;flex-shrink:0}
.chat-list-item .chat-time{font-size:10px;color:var(--mut);font-weight:700}
.chat-list-item .chat-unread{background:var(--danger);color:#fff;font-size:10px;font-weight:900;border-radius:10px;padding:2px 6px;min-width:20px;text-align:center;margin-top:4px;display:inline-block}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div id="login">
  <form class="box" id="login-form">
    <h1>🛵 Chauat Go Admin</h1>
    <div class="tab-btns">
      <button type="button" class="tab-btn active" onclick="switchTab('login')">เข้าสู่ระบบ</button>
      <button type="button" class="tab-btn" onclick="switchTab('signup')">สมัครสมาชิก</button>
    </div>

async function handleSignup() {
  const name = $('su-name').value.trim(), email = $('su-email').value.trim();
  const pw = $('su-pw').value, pw2 = $('su-pw2').value;
  if (!name || !email || !pw) return toast('กรอกข้อมูลให้ครบ', true);
  if (pw.length < 6) return toast('รหัสผ่านต้อง 6+ ตัว', true);
  if (pw !== pw2) return toast('รหัสผ่านไม่ตรงกัน', true);
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pw);
    await cred.user.updateProfile({ displayName: name });
    await db.collection('admins').doc(cred.user.uid).set({
      name, email, role: 'pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('✅ สมัครสำเร็จ! รออนุมัติ');
    switchTab('login');
    $('em').value = email;
  } catch (err) { toast('สมัครไม่สำเร็จ: ' + err.message, true); }
}

function start() {
  for (const k of ['merchants','orders','riders','users','chats']) {
    const unsub = db.collection(k).onSnapshot(s => {
      store[k] = s.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, err => {
      console.error(`[${k}]`, err);
      toast('โหลด ' + k + ' ไม่สำเร็จ: ' + err.code, true);
    });
    unsubs.push(unsub);
  }
  const unsubPlaces = db.collection('places').onSnapshot(s => {
    if (s.docs.length > 0) {
      store.places = s.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    } else { autoUploadPlaces(); }
  }, err => {
    store.places = PLACES;
    render();
  });
  unsubs.push(unsubPlaces);
  renderNav();
  render();
}
function stop() {
  unsubs.forEach(u => u());
  unsubs = [];
  for (const k in store) store[k] = [];
}

async function autoUploadPlaces() {
  const uploaded = localStorage.getItem('chauat_places_uploaded');
  if (uploaded === 'v3.3.0') { store.places = PLACES; render(); return; }
  store.places = PLACES;
  render();
  try {
    const batches = [db.batch(), db.batch()];
    let count = 0;
    for (const p of PLACES) {
      const b = Math.floor(count / 250);
      batches[b].set(db.collection('places').doc(p.id), { ...p, merchantId: null, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      count++;
    }
    await batches[0].commit();
    await batches[1].commit();
    localStorage.setItem('chauat_places_uploaded', 'v3.3.0');
    toast('✅ อัปโหลด 490 สถานที่สำเร็จ');
  } catch (e) { console.error('Upload failed:', e); }
}

function renderNav() {
  const pendingMerchants = store.merchants.filter(m => !m.verified).length;
  const pendingRiders = store.riders.filter(r => r.verified === false).length;
  const unreadChats = store.chats.filter(c => c.unreadAdmin > 0).length;

  $('nav').innerHTML = SECTIONS.map(([k, icon, label]) => {
    let badge = '';
    if (k === 'merchants' && pendingMerchants > 0) badge = `<span class="nav-badge">${pendingMerchants}</span>`;
    else if (k === 'riders' && pendingRiders > 0) badge = `<span class="nav-badge">${pendingRiders}</span>`;
    else if (k === 'chats' && unreadChats > 0) badge = `<span class="nav-badge">${unreadChats}</span>`;
    return `<button class="ripple ${k === current ? 'on' : ''}" data-go="${k}">
      ${badge}
      <div class="nav-icon">${icon}</div>
      <div class="nav-label">${label}</div>
    </button>`;
  }).join('');
}

function render() {
  const fn = { dashboard, finance, chats, merchants, orders, riders, users, places }[current];

}

function dashboard() {
  const today = new Date(); today.setHours(0,0,0,0);
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);

  const completedAll = store.orders.filter(o => o.status === 'done');
  const activeOrders = store.orders.filter(o => ['searching','pending','accepted','picked_up','on_the_way'].includes(o.status));

  let todayRevenue = 0, todayOrders = 0, yesterdayRevenue = 0, pendingRevenue = 0;
  const riderSummary = {};

  completedAll.forEach(o => {
    const fare = Number(o.fare || 0);
    const myCut = Math.round(fare * 0.20 * 100) / 100;
    const d = toDate(o.createdAt); if (!d) return;
    const rId = o.riderId || 'unknown';
    const rName = o.rider?.name || o.riderName || 'ไม่ระบุ';
    if (!riderSummary[rId]) riderSummary[rId] = { name: rName, owe: 0, todayCount: 0 };
    if (d >= today) { todayRevenue += myCut; todayOrders++; riderSummary[rId].todayCount++; }
    else if (d >= yesterday && d < today) { yesterdayRevenue += myCut; }
    if (!o.riderPaid) { pendingRevenue += myCut; riderSummary[rId].owe += myCut; }
  });

  const trend = yesterdayRevenue > 0 ? Math.round((todayRevenue - yesterdayRevenue) / yesterdayRevenue * 100) : (todayRevenue > 0 ? 100 : 0);
  const trendUp = trend >= 0;
  const topDebtors = Object.entries(riderSummary).filter(([_, v]) => v.owe > 0).sort((a, b) => b[1].owe - a[1].owe).slice(0, 3);

// ══════════════════════════════════════════════════════════════════════
//  💰 FINANCE
// ══════════════════════════════════════════════════════════════════════
function finance() {
  const today = new Date(); today.setHours(0,0,0,0);
  const yesterdayStart = new Date(today); yesterdayStart.setDate(yesterdayStart.getDate() - 1);
  const completedOrders = store.orders.filter(o => o.status === 'done');
  let totalGrossAll = 0, totalPlatformFeeAll = 0, totalRiderEarnAll = 0;
  const riderStats = {};

  completedOrders.forEach(o => {
    const fare = Number(o.fare || 0);
    if (fare <= 0) return;
    const platformFee = Math.round(fare * 0.20 * 100) / 100;
    const riderEarn = fare - platformFee;
    const rId = o.riderId || 'unknown';
    const rName = o.rider?.name || o.riderName || 'ไม่ระบุชื่อ';
    const orderDate = toDate(o.createdAt);
    if (!orderDate) return;
    if (!riderStats[rId]) riderStats[rId] = { id: rId, name: rName, today:{c:0,a:0}, yesterday:{c:0,a:0}, total:{c:0,a:0} };
    totalGrossAll += fare; totalPlatformFeeAll += platformFee; totalRiderEarnAll += riderEarn;
    riderStats[rId].total.c++; riderStats[rId].total.a += riderEarn;
    if (orderDate >= today) { riderStats[rId].today.c++; riderStats[rId].today.a += riderEarn; }
    else if (orderDate >= yesterdayStart && orderDate < today) { riderStats[rId].yesterday.c++; riderStats[rId].yesterday.a += riderEarn; }
  });

  const sortedRiders = Object.values(riderStats).sort((a,b) => b.today.a - a.today.a);
  const tableRows = sortedRiders.length === 0
    ? '<tr><td colspan="6" style="text-align:center;padding:20px;color:#999;font-weight:600">ยังไม่มีออเดอร์ที่เสร็จสมบูรณ์</td></tr>'
    : sortedRiders.map(r => `
      <tr class="${r.today.a > 0 ? 'highlight-row' : ''}">
        <td style="font-weight:900">${esc(r.name)}</td>
        <td class="text-center">${r.today.c}</td>
        <td class="text-right money-pos">฿${r.today.a.toFixed(2)}</td>
        <td class="text-center" style="color:#888">${r.yesterday.c}</td>
        <td class="text-right" style="color:#888">฿${r.yesterday.a.toFixed(2)}</td>
        <td class="text-right" style="font-weight:900;color:var(--warn)">฿${r.total.a.toFixed(2)}</td>
      </tr>`).join('');

  return `
    <div class="grid" style="margin-bottom:20px">
      <div class="card" style="border-left:4px solid var(--mut)"><div class="num" style="color:var(--mut)">฿${totalGrossAll.toLocaleString(undefined,{minimumFractionDigits:2})}</div><div class="lbl">ยอดขายรวม</div></div>
      <div class="card" style="border-left:4px solid var(--danger)"><div class="num" style="color:var(--danger)">฿${totalPlatformFeeAll.toLocaleString(undefined,{minimumFractionDigits:2})}</div><div class="lbl">รายได้แพลตฟอร์ม (20%)</div></div>
      <div class="card" style="border-left:4px solid var(--brand)"><div class="num" style="color:var(--brand)">฿${totalRiderEarnAll.toLocaleString(undefined,{minimumFractionDigits:2})}</div><div class="lbl">ค่าตอบแทนไรเดอร์ (80%)</div></div>
    </div>
    <div class="fin-table-wrap">
      <table class="fin-table">
        <thead><tr>
          <th>ไรเดอร์</th><th class="text-center">วันนี้(งาน)</th><th class="text-right">วันนี้(บาท)</th>
          <th class="text-center">เมื่อวาน(งาน)</th><th class="text-right">เมื่อวาน(บาท)</th>
          <th class="text-right" style="background:#FFF3E0;color:var(--warn)">ยอดค้างจ่าย</th>
        </tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
  `;
}

function chats() {
  const list = [...store.chats].sort((a,b) => ts(b) - ts(a));

  if (list.length === 0) {
    return `<div class="empty">
      <div style="font-size:48px;margin-bottom:8px">💬</div>
      <div style="font-weight:800;font-size:15px;margin-bottom:6px">ยังไม่มีการสนทนา</div>
      <div style="font-size:12px;font-weight:600">แชทระหว่างไรเดอร์ ↔ ร้านค้า จะปรากฏที่นี่</div>
    </div>`;
  }

  return list.map(c => {
    const isRiderMerchant = c.type === 'rider_merchant';
    const avatar = isRiderMerchant ? '💬' : '👤';
    const title = c.participants?.map(p => p.name).join(' ↔ ') || 'การสนทนา';
    const preview = c.lastMessage || '—';
    const unread = c.unreadAdmin || 0;
    return `
      <div class="chat-list-item" onclick="openChat('${esc(c.id)}')">
        <div class="avatar">${avatar}</div>
        <div class="chat-info">
          <div class="chat-title">${esc(title)}</div>
          <div class="chat-preview">${esc(preview.substring(0, 50))}</div>
        </div>
        <div class="chat-meta">
          <div class="chat-time">${fmtTimeShort(c.lastMessageAt || c.createdAt)}</div>
          ${unread > 0 ? `<div class="chat-unread">${unread}</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

// ─── Chat Detail ───
let activeChatId = null, activeChatUnsub = null;

function openChat(chatId) {
  activeChatId = chatId;
  const c = store.chats.find(x => x.id === chatId);
  if (!c) return;

  $('chat-name').textContent = c.participants?.map(p => p.name).join(' ↔ ') || 'แชท';
  $('chat-sub').textContent = c.type === 'rider_merchant' ? 'ไรเดอร์ ↔ ร้านค้า' : 'การสนทนา';
  $('chat-container').classList.add('show');
  $('chat-input').value = '';

  // Mark read
  if (c.unreadAdmin > 0) {
    db.collection('chats').doc(chatId).update({ unreadAdmin: 0 }).catch(() => {});
  }

  // Listen messages
  if (activeChatUnsub) activeChatUnsub();
  activeChatUnsub = db.collection('chats').doc(chatId).collection('messages')
    .orderBy('createdAt', 'asc').limitToLast(100)
    .onSnapshot(snap => {
      const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderChatMessages(msgs);
    });
}

function closeChat() {
  $('chat-container').classList.remove('show');
  if (activeChatUnsub) { activeChatUnsub(); activeChatUnsub = null; }
  activeChatId = null;
}

function renderChatMessages(msgs) {
  if (msgs.length === 0) {
    $('chat-messages').innerHTML = '<div class="chat-empty">เริ่มการสนทนาได้เลย</div>';
    return;
  }
  const adminEmail = auth.currentUser?.email || 'admin';
  let lastDay = '';
  const html = msgs.map(m => {
    const isAdmin = m.senderRole === 'admin';
    const isSystem = m.senderRole === 'system';
    const d = toDate(m.createdAt) || new Date();
    const day = d.toLocaleDateString('th-TH', { day: '2-digit', month: 'short' });
    let dayDiv = '';
    if (day !== lastDay) { dayDiv = `<div class="chat-day-divider">${day}</div>`; lastDay = day; }

    if (isSystem) {
      return `${dayDiv}<div style="align-self:center;background:rgba(0,0,0,.1);color:#555;font-size:11px;padding:6px 12px;border-radius:12px;font-weight:700">${esc(m.text || '')}</div>`;
    }

    const cls = isAdmin ? 'out from-admin' : 'in';
    const imageHtml = m.imageUrl ? `<img src="${esc(m.imageUrl)}" class="msg-image" onclick="window.open('${esc(m.imageUrl)}','_blank')">` : '';
    const textHtml = m.text ? `<div>${esc(m.text)}</div>` : '';
    const senderName = !isAdmin && m.senderName ? `<div style="font-size:10px;font-weight:900;opacity:.8;margin-bottom:4px">${esc(m.senderName)}</div>` : '';

    return `${dayDiv}<div class="chat-msg ${cls}">
      ${senderName}
      ${imageHtml}
      ${textHtml}
      <div class="msg-time">${fmtTimeShort(m.createdAt)}</div>
    </div>`;
  }).join('');
  $('chat-messages').innerHTML = html;
  setTimeout(() => { $('chat-messages').scrollTop = $('chat-messages').scrollHeight; }, 50);
}

async function sendChatText() {
  const text = $('chat-input').value.trim();
  if (!text || !activeChatId) return;
  $('chat-input').value = '';
  $('chat-input').style.height = 'auto';
  try {
    await db.collection('chats').doc(activeChatId).collection('messages').add({
      text, senderRole: 'admin', senderName: 'Admin',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('chats').doc(activeChatId).update({
      lastMessage: `[Admin] ${text}`,
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) { toast('ส่งไม่สำเร็จ: ' + e.message, true); }
}

function pickChatImage() { $('chat-image-input').click(); }

async function sendChatImage(file) {
  if (!file || !activeChatId) return;
  if (file.size > 5 * 1024 * 1024) return toast('รูปใหญ่เกิน 5MB', true);
  toast('⏳ กำลังอัปโหลด...');
  try {
    const path = `chats/${activeChatId}/${Date.now()}_${file.name}`;
    const ref = storage.ref(path);
    await ref.put(file);
    const url = await ref.getDownloadURL();
    await db.collection('chats').doc(activeChatId).collection('messages').add({
      imageUrl: url, senderRole: 'admin', senderName: 'Admin',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('chats').doc(activeChatId).update({
      lastMessage: '[Admin] 📷 รูปภาพ',
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('✅ ส่งรูปแล้ว');
  } catch (e) { toast('อัปโหลดไม่สำเร็จ: ' + e.message, true); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ─── Places (เข้าจากอื่นได้) ───
function places() {
  const q = filters.q.toLowerCase();
  const catFilter = filters.placeCat, statusFilter = filters.placeStatus;
  const list = store.places.filter(p => {
    const mQ = !q || p.name.toLowerCase().includes(q) || (p.id || '').toLowerCase().includes(q);
    const mC = catFilter === 'all' || p.category === catFilter;
    const mS = statusFilter === 'all' || (statusFilter === 'linked' && p.merchantId) || (statusFilter === 'unlinked' && !p.merchantId);
    return mQ && mC && mS;
  });
  const totalPages = Math.ceil(list.length / filters.placePerPage) || 1;
  if (filters.placePage > totalPages) filters.placePage = 1;
  const start = (filters.placePage - 1) * filters.placePerPage;
  const pageItems = list.slice(start, start + filters.placePerPage);
  const linkedCount = store.places.filter(p => p.merchantId).length;
  const unlinkedCount = store.places.length - linkedCount;

  const statusChips = `<div class="filter-bar">
    <button class="filter-chip ${statusFilter === 'all' ? 'active' : ''}" onclick="filterPlaceStatus('all')">📋 ทั้งหมด (${store.places.length})</button>
    <button class="filter-chip ${statusFilter === 'unlinked' ? 'active' : ''}" onclick="filterPlaceStatus('unlinked')">⚪ ว่าง (${unlinkedCount})</button>
    <button class="filter-chip ${statusFilter === 'linked' ? 'active' : ''}" onclick="filterPlaceStatus('linked')">🔗 เชื่อม (${linkedCount})</button>
  </div>`;
  const catChips = `<div class="filter-bar">
    <button class="filter-chip ${catFilter === 'all' ? 'active' : ''}" onclick="filterPlaceCat('all')">🌏 ทั้งหมด</button>
    ${Object.entries(CATEGORIES).map(([k, v]) => `<button class="filter-chip ${catFilter === k ? 'active' : ''}" onclick="filterPlaceCat('${k}')">${v.icon} ${v.name}</button>`).join('')}
  </div>`;
  const grid = pageItems.length === 0 ? '<div class="empty">ไม่พบสถานที่</div>' :
    `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px">${pageItems.map(p => {
      const cat = CATEGORIES[p.category] || CATEGORIES.x;
      const hasImg = p.image && p.image.startsWith('images/');
      const thumbUrl = hasImg ? p.image : osmThumb(p.lat, p.lng);
      return `<div style="background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--border);cursor:pointer" onclick="placeDetail('${esc(p.id)}')">
        <img src="${thumbUrl}" style="width:100%;height:110px;object-fit:cover" loading="lazy" onerror="this.src='${osmThumb(p.lat,p.lng)}'">
        <div style="padding:10px">
          <div style="font-size:10px;color:var(--mut);font-family:monospace">${esc(p.id)}</div>
          <div style="font-weight:900;font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</div>
          <div style="font-size:11px;color:var(--blue);font-weight:800;margin-top:4px">${cat.icon} ${cat.name}</div>
          ${p.merchantId ? `<div style="font-size:9px;color:var(--brand);font-weight:900;margin-top:4px;background:#E8F5E9;padding:3px 6px;border-radius:6px;display:inline-block">🔗 ${esc(p.merchantId)}</div>` : ''}
        </div>
      </div>`;
    }).join('')}</div>`;

  let pagination = '';
  if (totalPages > 1) {
    const pages = [];
    let sp = Math.max(1, filters.placePage - 2), ep = Math.min(totalPages, sp + 4);
    if (ep - sp < 4) sp = Math.max(1, ep - 4);
    if (sp > 1) pages.push(`<button onclick="changePlacePage(1)">1</button><span style="padding:0 4px">…</span>`);
    for (let i = sp; i <= ep; i++) pages.push(`<button class="${i === filters.placePage ? 'active' : ''}" onclick="changePlacePage(${i})" style="${i===filters.placePage?'background:var(--brand);color:#fff;border-color:var(--brand)':''};min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--border);font-weight:800;font-family:inherit;background:#fff">${i}</button>`);
    if (ep < totalPages) pages.push(`<span style="padding:0 4px">…</span><button onclick="changePlacePage(${totalPages})">${totalPages}</button>`);
    pagination = `<div style="display:flex;justify-content:center;gap:6px;margin-top:20px;flex-wrap:wrap">
      <button ${filters.placePage === 1 ? 'disabled' : ''} onclick="changePlacePage(${filters.placePage - 1})" style="min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--border);background:#fff;font-family:inherit;font-weight:800">◀</button>
      ${pages.join('')}
      <button ${filters.placePage === totalPages ? 'disabled' : ''} onclick="changePlacePage(${filters.placePage + 1})" style="min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--border);background:#fff;font-family:inherit;font-weight:800">▶</button>
    </div>`;
  }

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-weight:900;font-size:15px">📍 สถานที่ในชะอวด</div>
      <span class="tag b">${store.places.length} แห่ง</span>
    </div>
    ${statusChips}${catChips}
    ${searchInput('ค้นหาสถานที่...')}
    <div style="font-size:11px;color:var(--mut);margin-bottom:10px;font-weight:700">แสดง ${start+1}-${Math.min(start+filters.placePerPage, list.length)} จาก ${list.length}</div>
    ${grid}${pagination}
  `;
}

function changePlacePage(p) { filters.placePage = p; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function filterPlaceCat(c) { filters.placeCat = c; filters.placePage = 1; render(); }
function filterPlaceStatus(s) { filters.placeStatus = s; filters.placePage = 1; render(); }

function placeDetail(id) {
  const p = store.places.find(x => x.id === id);

  const cat = CATEGORIES[p.category] || CATEGORIES.x;
  const linkedMerchant = store.merchants.find(m => m.id === p.merchantId);

    <div class="meta" style="font-family:monospace">${esc(p.id)}</div>

      ${o.riderSlipVerified ? `<div class="slip-status-banner ok">✅ ตรวจสอบแล้ว</div>` : `<div class="slip-status-banner pending">⏳ รอตรวจสอบ</div>`}

    <div style="margin-top:16px;padding-top:12px;border-top:1px solid #eee">

      <button class="dan ripple" style="width:100%;margin-top:8px" onclick="deleteAdminSlip('${esc(o.id)}')">🗑️ ลบ</button>

    <div class="meta">📍 ${esc(o.address || '')}</div>

async function verifyRiderSlip(id) {
  try {
    await db.collection('orders').doc(id).update({ riderSlipVerified: true, riderSlipVerifiedAt: firebase.firestore.FieldValue.serverTimestamp() });
    toast('✅ อนุมัติสลิป');
    orderDetail(id);
  } catch (e) { toast('❌ ' + e.message, true); }
}

async function rejectRiderSlip(id) {
  if (!confirm('ยืนยันปฏิเสธสลิปนี้?')) return;
  try {
    const o = store.orders.find(x => x.id === id);
    if (o.riderSlipPath) try { await storage.ref(o.riderSlipPath).delete(); } catch(_) {}
    await db.collection('orders').doc(id).update({ riderSlipUrl: null, riderSlipPath: null, riderSlipVerified: false });
    toast('❌ ปฏิเสธสลิป');
    orderDetail(id);
  } catch (e) { toast('❌ ' + e.message, true); }
}

async function uploadAdminSlip(orderId, file) {
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) return toast('ไฟล์เกิน 5MB', true);
  if (!file.type.startsWith('image/')) return toast('ต้องเป็นรูป', true);
  const pB = $(`admin-slip-progress-${orderId}`), bar = $(`admin-slip-bar-${orderId}`);
  pB.style.display = 'block';
  const path = `slips/orders/${orderId}/admin-${Date.now()}.${file.name.split('.').pop()}`;
  const ref = storage.ref(path);
  try {
    const task = ref.put(file);
    task.on('state_changed', s => { bar.style.width = (s.bytesTransferred / s.totalBytes * 100) + '%'; });
    await task;
    const url = await ref.getDownloadURL();
    await db.collection('orders').doc(orderId).update({ adminSlipUrl: url, adminSlipPath: path, adminSlipUploadedAt: firebase.firestore.FieldValue.serverTimestamp() });
    toast('✅ อัปโหลดสลิป');
    orderDetail(orderId);
  } catch (e) { toast('❌ ' + e.message, true); pB.style.display = 'none'; }
}

async function deleteAdminSlip(orderId) {
  if (!confirm('ลบสลิปนี้?')) return;
  try {
    const o = store.orders.find(x => x.id === orderId);
    if (o.adminSlipPath) try { await storage.ref(o.adminSlipPath).delete(); } catch(_) {}
    await db.collection('orders').doc(orderId).update({ adminSlipUrl: null, adminSlipPath: null });
    toast('🗑️ ลบแล้ว');
    orderDetail(orderId);
  } catch (e) { toast('❌ ' + e.message, true); }
}

function editMerchantForm(id) {

  const availablePlaces = store.places.filter(p => !p.merchantId || p.merchantId === id);
  const placeOptions = '<option value="">-- ไม่ระบุ --</option>' + availablePlaces.map(p => {
    const cat = CATEGORIES[p.category] || CATEGORIES.x;
    return `<option value="${esc(p.id)}" ${m.locationId === p.id ? 'selected' : ''}>${cat.icon} ${esc(p.id)} - ${esc(p.name)}</option>`;
  }).join('');
  openModal('✏️ แก้ไขร้านค้า', `

    <input type="text" id="edit-name" value="${esc(m.name || '')}">
    <label style="font-weight:800;font-size:13px">เบอร์</label>
    <input type="tel" id="edit-phone" value="${esc(m.phone || '')}">
    <label style="font-weight:800;font-size:13px">📍 เชื่อมกับสถานที่</label>
    <select id="edit-location">${placeOptions}</select>

  `);

async function saveMerchantEdit(id) {
  const m = store.merchants.find(x => x.id === id);
  const oldLoc = m?.locationId || null;
  const newLoc = $('edit-location').value || null;
  const updates = {
    name: $('edit-name').value.trim(),
    phone: $('edit-phone').value.trim(),
    address: $('edit-address').value.trim(),
    locationId: newLoc,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  if (!updates.name) return toast('กรอกชื่อ', true);
  try {
    await db.collection('merchants').doc(id).update(updates);
    if (oldLoc !== newLoc) {
      const batch = db.batch();
      if (oldLoc) batch.update(db.collection('places').doc(oldLoc), { merchantId: null });
      if (newLoc) batch.update(db.collection('places').doc(newLoc), { merchantId: id });
      await batch.commit();
    }
    toast('✅ บันทึกแล้ว');
    closeModal();
  } catch (e) { toast('บันทึกไม่สำเร็จ: ' + e.message, true); }
}

  openModal('🔗 Link ไรเดอร์', `
    <div style="background:#F0FDF4;border-radius:12px;padding:12px;margin-bottom:16px">
      <div style="font-weight:900">${esc(r.name || '-')}</div>
    </div>
    <label style="font-weight:800;font-size:13px;display:block;margin-bottom:8px">🏪 ร้านที่ดูแล</label>
    ${merchantPicker}
    <label style="font-weight:800;font-size:13px;display:block;margin:16px 0 8px">📍 สถานที่ที่ดูแล</label>
    ${locationPicker}
    <button class="pri big ripple" style="margin-top:16px" onclick="saveRiderLink('${esc(id)}')">💾 บันทึก</button>

// ─── Chat With (จาก merchants/riders) ───
async function openChatWith(targetId, targetType) {
  const target = targetType === 'merchant'
    ? store.merchants.find(m => m.id === targetId)
    : store.riders.find(r => r.id === targetId);
  if (!target) return toast('ไม่พบข้อมูล', true);

  // หา chat ที่มีอยู่แล้ว
  const existing = store.chats.find(c => {
    if (targetType === 'merchant') return (c.participantIds || []).includes(targetId);
    if (targetType === 'rider') return (c.participantIds || []).includes(targetId);
    return false;
  });

  if (existing) { openChat(existing.id); return; }

  // ถ้าไม่มี → แจ้ง Admin ว่าต้องรอคู่สนทนา
  toast('💬 ยังไม่มีการสนทนากับรายนี้ — ต้องรอไรเดอร์หรือร้านเริ่มก่อน');
}

// ─── Event Delegation ───
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-go],[data-order],[data-verify],[data-verify-r],[data-rider],[data-del],[data-edit-m],[data-edit-r],[data-chat-with]');
  if (!t) return;
  try {
    if (t.dataset.go) {
      current = t.dataset.go; filters.q = '';
      render(); window.scrollTo(0,0);
    }
    else if (t.dataset.order) orderDetail(t.dataset.order);
    else if (t.dataset.editM) editMerchantForm(t.dataset.editM);
    else if (t.dataset.editR) editRiderForm(t.dataset.editR);
    else if (t.dataset.chatWith) openChatWith(t.dataset.chatWith, t.dataset.chatType);
    else if (t.dataset.verify) {
      const m = store.merchants.find(x => x.id === t.dataset.verify);
      await db.collection('merchants').doc(m.id).update({ verified: !m.verified, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      toast('อัปเดตแล้ว');
    }
    else if (t.dataset.verifyR) {
      const r = store.riders.find(x => x.id === t.dataset.verifyR);
      const newVal = r.verified === false;
      await db.collection('riders').doc(r.id).update({ verified: newVal, verifiedAt: newVal ? firebase.firestore.FieldValue.serverTimestamp() : null, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      toast(newVal ? '✅ อนุมัติไรเดอร์' : '🚫 ยกเลิกอนุมัติ');
    }
    else if (t.dataset.rider) {
      const r = store.riders.find(x => x.id === t.dataset.rider);
      await db.collection('riders').doc(r.id).update({ status: r.status === 'active' ? 'inactive' : 'active' });
      toast('อัปเดตแล้ว');
    }
    else if (t.dataset.del) {
      const [col, id] = t.dataset.del.split(':');
      if (confirm('⚠️ ยืนยันลบ?')) { await db.collection(col).doc(id).delete(); toast('ลบแล้ว'); }
    }
  } catch (err) { console.error(err); toast('ไม่สำเร็จ: ' + err.code, true); }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    filters.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const q = $('q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); }
  }
});

document.addEventListener('change', async e => {
  if (e.target.id === 'ofilter') { filters.orders = e.target.value; render(); }
  if (e.target.id === 'ostatus') {
    try {
      await db.collection('orders').doc(e.target.dataset.oid).update({ status: e.target.value, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      toast('อัปเดตแล้ว'); closeModal();
    } catch (err) { toast('ไม่สำเร็จ', true); }
  }
});

$('modal-overlay').addEventListener('click', e => { if (e.target === $('modal-overlay')) closeModal(); });

// Chat: Enter ส่งข้อความ
$('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatText(); }
});

document.addEventListener('touchstart', e => {
  const el = e.target.closest('.ripple, button, .action-card, .data-card, nav button');
  if (!el) return;
  el.style.transform = 'scale(.97)';
  setTimeout(() => { el.style.transform = ''; }, 150);
}, { passive: true });

document.addEventListener('click', e => {
  const el = e.target.closest('button, .action-card, .data-card, nav button');
  if (el && navigator.vibrate) navigator.vibrate(10);
}, { passive: true });
