<script>
// ═══════════════════════════════════════════════════════════════════
//  🔄 FORCE AUTO-UPDATE
// ═══════════════════════════════════════════════════════════════════
(function() {
  const APP_VERSION = 'v3.3.0';
  const savedVersion = localStorage.getItem('chauat_app_version');

  if (savedVersion && savedVersion !== APP_VERSION) {
    console.log('[Update]', savedVersion, '→', APP_VERSION);
    localStorage.setItem('chauat_app_version', APP_VERSION);
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage('FORCE_UPDATE');
    }
    if ('caches' in window) {
      caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k))))
        .then(() => location.reload(true));
    } else {
      location.reload(true);
    }
    return;
  }
  localStorage.setItem('chauat_app_version', APP_VERSION);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
        .then(reg => {
          setInterval(() => reg.update(), 30000);
          reg.update();
          reg.addEventListener('updatefound', () => {
            const newSW = reg.installing;
            if (!newSW) return;
            newSW.addEventListener('statechange', () => {
              if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                newSW.postMessage('SKIP_WAITING');
                setTimeout(() => location.reload(true), 500);
              }
            });
          });
        })
        .catch(err => console.warn('[SW]', err));

      navigator.serviceWorker.addEventListener('message', event => {
        if (event.data?.type === 'SW_UPDATED') location.reload(true);
      });

      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload(true);
      });
    });
  }
})();
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'IBM Plex Sans Thai',sans-serif;-webkit-tap-highlight-color:transparent}
:root{--brand:#00A651;--brand-dark:#008C45;--bg:#EDF6DC;--text:#1A1A1A;--mut:#6B7280;--danger:#E53935;--warn:#E65100;--blue:#1565C0;--purple:#9C27B0;--surface:#fff;--border:#e5e7eb}
body{background:var(--bg);color:var(--text);max-width:1000px;margin:0 auto;min-height:100vh;padding-bottom:40px}
.hidden{display:none!important}

/* Ripple */
.ripple{position:relative;overflow:hidden;isolation:isolate}
.ripple::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle,rgba(255,255,255,.45) 10%,transparent 11%);background-position:center;background-size:0% 0%;background-repeat:no-repeat;transition:background-size .5s ease-out;pointer-events:none}
.ripple:active::after{background-size:250% 250%}

/* ─── Login ─── */
#login{position:fixed;inset:0;background:linear-gradient(135deg,#76B82A,#3B7A16);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;overflow-y:auto}
.box{background:#fff;border-radius:20px;padding:32px 24px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.15);margin:auto}
.box h1{font-size:22px;color:var(--brand);text-align:center;margin-bottom:20px;font-weight:900}
input,select,textarea{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:12px;transition:border-color .2s;font-family:inherit;font-weight:600;min-height:52px;outline:none;background:#fafafa}
input:focus,select:focus,textarea:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(0,166,81,.1)}
button{cursor:pointer;border:none;border-radius:10px;font-weight:800;font-size:13px;padding:10px 16px;transition:transform .1s;font-family:inherit;min-height:44px}
button:active{transform:scale(.97)}
.pri{background:var(--brand);color:#fff}
.sec{background:#f0f0f0;color:#555}
.dan{background:#FFEBEE;color:var(--danger)}
.blue{background:var(--blue);color:#fff}
.big{width:100%;padding:14px;font-size:15px;border-radius:12px;margin-top:8px;min-height:56px}
.tab-btns{display:flex;gap:6px;margin-bottom:16px;background:#f5f5f5;padding:4px;border-radius:12px}
.tab-btn{flex:1;padding:12px;border:none;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;background:transparent;color:var(--mut);transition:.2s;font-family:inherit}
.tab-btn.active{background:#fff;color:var(--brand);box-shadow:0 2px 6px rgba(0,0,0,.08)}

/* ─── App Layout ─── */
header{background:linear-gradient(135deg,#76B82A,#3B7A16);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;border-radius:0 0 20px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 4px 12px rgba(0,0,0,.1)}
header h1{flex:1;font-size:18px;font-weight:900}
header .admin-info{text-align:right;font-size:11px;opacity:.95;line-height:1.4}
header .admin-info button{padding:8px 14px;font-size:11px;margin-top:4px;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3);min-height:36px}

nav{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:40;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;color:var(--mut);padding:12px 18px;font-size:13px;white-space:nowrap;border-radius:12px;font-weight:700;font-family:inherit;min-height:44px}
nav button.on{background:#E8F5E9;color:var(--brand);font-weight:900}

main{padding:16px}

/* ─── Common ─── */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.04);transition:transform .15s}
.card:active{transform:scale(.99)}
.num{font-size:28px;font-weight:900;color:var(--brand)}
.lbl{font-size:12px;color:var(--mut);font-weight:600;margin-top:4px}
.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.nm{font-weight:900;font-size:15px}
.meta{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.5;word-break:break-word;font-weight:600}
.tag{font-size:11px;font-weight:900;padding:6px 12px;border-radius:12px;background:#E8F5E9;color:#2E7D32;display:inline-block;min-height:28px;line-height:1.2}
.tag.w{background:#FFF3E0;color:var(--warn)}
.tag.x{background:#f0f0f0;color:#888}
.tag.b{background:#E3F2FD;color:var(--blue)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:14px;background:var(--surface);border-radius:16px;font-weight:600}

/* ─── Finance Table ─── */
.fin-table-wrap{overflow-x:auto;background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
table.fin-table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
table.fin-table th{background:#f8f9fa;padding:12px;text-align:left;border-bottom:2px solid #ddd;white-space:nowrap;font-weight:900}
table.fin-table td{padding:12px;border-bottom:1px solid #eee;vertical-align:middle}
table.fin-table tr:hover{background:#fafafa}
.highlight-row{background:#E8F5E9!important}
.text-right{text-align:right}
.text-center{text-align:center}
.money-pos{color:var(--brand);font-weight:900}
.money-neg{color:var(--danger);font-weight:900}

/* ─── Modal ─── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(0px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s,backdrop-filter .3s}
.modal-overlay.show{opacity:1;pointer-events:auto;backdrop-filter:blur(4px)}
.modal{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;transform:translateY(20px) scale(.95);transition:transform .35s cubic-bezier(.32,.72,0,1)}
.modal-overlay.show .modal{transform:translateY(0) scale(1);animation:modalBounce .4s cubic-bezier(.32,.72,0,1)}
@keyframes modalBounce{0%{transform:translateY(20px) scale(.95)}55%{transform:translateY(-4px) scale(1.01)}100%{transform:translateY(0) scale(1)}}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #eee}
.modal-hdr h2{font-size:18px;font-weight:900}
.close-btn{background:#f0f0f0;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;min-height:44px}

/* ─── Toast ─── */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);background:#222;color:#fff;padding:14px 22px;border-radius:16px;font-size:14px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;z-index:999;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger)}

/* ─── Dashboard Hero ─── */
.hero-card{background:linear-gradient(135deg,#00A651 0%,#008C45 100%);border-radius:24px;padding:24px 20px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,166,81,.25)}
.hero-card::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%);border-radius:50%;pointer-events:none}
.hero-card::after{content:'';position:absolute;bottom:-60px;left:-30px;width:140px;height:140px;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);border-radius:50%;pointer-events:none}
.hero-label{font-size:13px;opacity:.9;font-weight:700;margin-bottom:6px;position:relative;z-index:1}
.hero-amount{font-size:44px;font-weight:900;line-height:1;letter-spacing:-1px;position:relative;z-index:1}
.hero-trend{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:12px;font-weight:800;margin-top:10px;position:relative;z-index:1}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.2);position:relative;z-index:1}
.hero-grid-cell .lbl{font-size:11px;opacity:.85;font-weight:700}
.hero-grid-cell .val{font-size:20px;font-weight:900;margin-top:2px}

/* ─── Section Divider ─── */
.section-divider{display:flex;align-items:center;gap:8px;margin:24px 0 12px}
.section-divider .title{font-size:14px;font-weight:900;color:var(--text)}
.section-divider .line{flex:1;height:1px;background:linear-gradient(90deg,#ddd,transparent)}

/* ─── Action Cards ─── */
.action-card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,.04);cursor:pointer;transition:transform .15s;min-height:76px}
.action-card:active{transform:scale(.98)}
.action-card.warn{border-left:4px solid var(--warn);background:#FFFBEB}
.action-card.danger{border-left:4px solid var(--danger);background:#FFEBEE}
.action-card.blue{border-left:4px solid var(--blue);background:#EFF6FF}
.action-card.green{border-left:4px solid var(--brand);background:#F0FDF4}
.action-icon{font-size:28px;flex-shrink:0;line-height:1}
.action-info{flex:1;min-width:0}
.action-title{font-size:14px;font-weight:800;line-height:1.3}
.action-card.warn .action-title{color:#92400e}
.action-card.danger .action-title{color:#991b1b}
.action-card.blue .action-title{color:#1e40af}
.action-card.green .action-title{color:#166534}
.action-value{font-size:20px;font-weight:900;margin-top:2px;letter-spacing:-.3px}
.action-card.warn .action-value{color:var(--warn)}
.action-card.danger .action-value{color:var(--danger)}
.action-card.blue .action-value{color:var(--blue)}
.action-card.green .action-value{color:var(--brand)}
.action-sub{font-size:11px;color:var(--mut);margin-top:2px;font-weight:700}
.action-btn{flex-shrink:0;padding:10px 14px;border-radius:12px;font-size:12px;font-weight:900;border:none;cursor:pointer;font-family:inherit;transition:transform .15s;min-height:44px}
.action-btn:active{transform:scale(.95)}
.action-btn.green{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(0,166,81,.25)}
.action-btn.orange{background:var(--warn);color:#fff;box-shadow:0 4px 12px rgba(230,81,0,.25)}
.action-btn.red{background:var(--danger);color:#fff;box-shadow:0 4px 12px rgba(229,57,53,.25)}
.action-btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(21,101,192,.25)}

/* ─── Data Card ─── */
.data-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:0 2px 12px rgba(0,0,0,.04);transition:transform .15s}
.data-card:active{transform:scale(.98)}
.data-card-header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.data-card-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.data-card-info{flex:1;min-width:0}
.data-card-name{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.data-card-meta{font-size:11px;color:var(--mut);font-weight:700;margin-top:2px}
.data-card-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.data-card-actions button{padding:10px 14px;border-radius:10px;border:none;font-size:11px;font-weight:900;cursor:pointer;font-family:inherit;transition:transform .15s;min-height:44px}
.data-card-actions button:active{transform:scale(.95)}
.btn-sm-primary{background:var(--brand);color:#fff}
.btn-sm-secondary{background:#f0f0f0;color:#666}
.btn-sm-danger{background:#FFEBEE;color:var(--danger)}
.btn-sm-warning{background:#FFF3E0;color:var(--warn)}

/* ─── Status Badge ─── */
.status-badge{display:inline-block;padding:5px 12px;border-radius:12px;font-size:11px;font-weight:900;min-height:26px;line-height:1.2}
.status-badge.active{background:#E8F5E9;color:#2E7D32}
.status-badge.pending{background:#FFF3E0;color:#E65100}
.status-badge.inactive{background:#f0f0f0;color:#999}
.status-badge.verified{background:#E3F2FD;color:#1565C0}
.status-badge.unverified{background:#FFEBEE;color:#C62828}

.search-box{background:#fff;border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.04);margin-bottom:12px;min-height:52px}
.search-box input{border:none;outline:none;font-size:14px;font-weight:600;flex:1;background:transparent;padding:0;margin:0;min-height:auto}
.filter-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{padding:10px 16px;border-radius:16px;font-size:12px;font-weight:900;background:#fff;color:var(--mut);cursor:pointer;white-space:nowrap;border:1px solid var(--border);min-height:40px;display:flex;align-items:center;font-family:inherit}
.filter-chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<script>
// ─── Firebase Config ───
firebase.initializeApp({
  apiKey: "AIzaSyB6PnikectfjjYfvO7VhpuxEIXQdJeASBM",
  authDomain: "chauat-go-b9841.firebaseapp.com",
  projectId: "chauat-go-b9841",
  storageBucket: "chauat-go-b9841.firebasestorage.app",
  messagingSenderId: "282197694521",
  appId: "1:282197694521:web:0528c22747a0c04bd815e8"
});
const auth = firebase.auth(), db = firebase.firestore();

// ─── Helpers ───
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m, err) {
  const t = $('toast');
  t.textContent = m;
  t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast', 3000);
}

// ─── State ───
const SECTIONS = [
  ['dashboard', '📊 แดชบอร์ด'],
  ['finance',   '💰 สรุปบัญชี'],
  ['merchants', '🏪 ร้านค้า'],
  ['orders',    '📋 ออเดอร์'],
  ['riders',    '🛵 ไรเดอร์'],
  ['users',     '👥 ผู้ใช้']
];
const store = { merchants: [], orders: [], riders: [], users: [] };
const filters = { orders: 'all', q: '' };
let current = 'dashboard', unsubs = [];

const STATUS = {
  searching:'⏳ กำลังหาไรเดอร์', pending:'🔔 รอรับงาน', accepted:'🛵 รับงานแล้ว',
  picked_up:'📦 รับของแล้ว',    on_the_way:'🚀 กำลังมาส่ง', done:'✅ เสร็จสิ้น', cancelled:'❌ ยกเลิก'
};

const itemsText = i => Array.isArray(i) ? i.map(x => `${x.name} x${x.qty}`).join(', ') : String(i ?? '');
const fmtTime = t => {
  if (!t) return '—';
  const d = t.toDate ? t.toDate() : new Date(t);
  if (isNaN(d)) return '—';
  return d.toLocaleString('th-TH', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
};
const ts = o => o.createdAt?.seconds || 0;
const toDate = t => {
  if (!t) return null;
  const d = t.toDate ? t.toDate() : new Date(t);
  return isNaN(d) ? null : d;
};

// ─── Tab Switching ───
function switchTab(tab) {
  const isLogin = tab === 'login';
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (i === 0 && isLogin) || (i === 1 && !isLogin));
  });
  $('form-login').style.display = isLogin ? 'block' : 'none';
  $('form-signup').style.display = isLogin ? 'none' : 'block';
}

// ─── Auth ───
$('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    await auth.signInWithEmailAndPassword($('em').value.trim(), $('pw').value);
  } catch (err) {
    toast('อีเมลหรือรหัสผ่านไม่ถูกต้อง', true);
  }
  $('pw').value = '';
});

async function handleSignup() {
  const name  = $('su-name').value.trim();
  const email = $('su-email').value.trim();
  const pw    = $('su-pw').value;
  const pw2   = $('su-pw2').value;

  if (!name || !email || !pw) return toast('กรุณากรอกข้อมูลให้ครบถ้วน', true);
  if (pw.length < 6)          return toast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร', true);
  if (pw !== pw2)             return toast('รหัสผ่านทั้งสองช่องไม่ตรงกัน', true);

  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pw);
    await cred.user.updateProfile({ displayName: name });
    await db.collection('admins').doc(cred.user.uid).set({
      name, email, role: 'pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('✅ สมัครสำเร็จ! กรุณาแจ้ง Super Admin เพื่ออนุมัติสิทธิ์');
    switchTab('login');
    $('em').value = email;
  } catch (err) {
    toast('สมัครไม่สำเร็จ: ' + err.message, true);
  }
}

$('logout').addEventListener('click', () => { stop(); auth.signOut(); });

auth.onAuthStateChanged(async user => {
  stop();
  if (!user) {
    $('login').classList.remove('hidden');
    $('app').classList.add('hidden');
    return;
  }
  const ADMIN_EMAILS = ['adminchauatgo@gmail.com', 'admin@chauatgo.com'];
  if (!ADMIN_EMAILS.includes(user.email)) {
    toast('บัญชีนี้ไม่มีสิทธิ์เป็นผู้ดูแล', true);
    await auth.signOut();
    return;
  }
  $('who').textContent = user.email;
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  start();
});

// ─── Data Listeners ───
function start() {
  for (const k of ['merchants','orders','riders','users']) {
    const unsub = db.collection(k).onSnapshot(s => {
      store[k] = s.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, err => {
      console.error(`[${k}]`, err);
      toast('โหลด ' + k + ' ไม่สำเร็จ: ' + err.code, true);
    });
    unsubs.push(unsub);
  }
  renderNav();
  render();
}
function stop() {
  unsubs.forEach(u => u());
  unsubs = [];
  for (const k in store) store[k] = [];
}

// ─── Nav / Render ───
function renderNav() {
  $('nav').innerHTML = SECTIONS.map(([k, l]) =>
    `<button class="ripple ${k === current ? 'on' : ''}" data-go="${k}">${l}</button>`
  ).join('');
}
function render() {
  const fn = { dashboard, finance, merchants, orders, riders, users }[current];
  $('main').innerHTML = fn();
}
function searchInput(ph) {
  return `<div class="search-box"><span style="font-size:18px;opacity:.5">🔍</span><input id="q" placeholder="${ph}" value="${esc(filters.q)}"></div>`;
}

// ══════════════════════════════════════════════════════════════════════
//  📊 DASHBOARD v2 — "เห็นแล้วรู้ทันที"
// ══════════════════════════════════════════════════════════════════════
function dashboard() {
  const today = new Date(); today.setHours(0,0,0,0);
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);

  const completedAll = store.orders.filter(o => o.status === 'done');
  const activeOrders = store.orders.filter(o =>
    ['searching','pending','accepted','picked_up','on_the_way'].includes(o.status)
  );

  let todayRevenue = 0, todayOrders = 0;
  let yesterdayRevenue = 0;
  let pendingRevenue = 0;
  const riderSummary = {};

  completedAll.forEach(o => {
    const fare   = Number(o.fare || 0);
    const myCut  = Math.round(fare * 0.20 * 100) / 100;
    const d = toDate(o.createdAt);
    if (!d) return;

    const rId   = o.riderId || 'unknown';
    const rName = o.rider?.name || o.riderName || 'ไม่ระบุ';

    if (!riderSummary[rId]) {
      riderSummary[rId] = { name: rName, owe: 0, todayCount: 0, todayRevenue: 0 };
    }

    if (d >= today) {
      todayRevenue += myCut;
      todayOrders++;
      riderSummary[rId].todayCount++;
      riderSummary[rId].todayRevenue += myCut;
    } else if (d >= yesterday && d < today) {
      yesterdayRevenue += myCut;
    }

    if (!o.riderPaid) {
      pendingRevenue += myCut;
      riderSummary[rId].owe += myCut;
    }
  });

  const trend = yesterdayRevenue > 0
    ? Math.round((todayRevenue - yesterdayRevenue) / yesterdayRevenue * 100)
    : (todayRevenue > 0 ? 100 : 0);
  const trendUp = trend >= 0;

  const topDebtors = Object.entries(riderSummary)
    .filter(([_, v]) => v.owe > 0)
    .sort((a, b) => b[1].owe - a[1].owe)
    .slice(0, 3);

  // ─── Layer 1: HERO ───
  const heroSection = `
    <div class="hero-card">
      <div class="hero-label">💰 รายได้วันนี้</div>
      <div class="hero-amount">฿${todayRevenue.toLocaleString('th-TH',{minimumFractionDigits:2})}</div>
      <div class="hero-trend">${trendUp ? '📈' : '📉'} ${trendUp ? '+' : ''}${trend}% เทียบเมื่อวาน (฿${yesterdayRevenue.toFixed(0)})</div>
      <div class="hero-grid">
        <div class="hero-grid-cell">
          <div class="lbl">📦 งานเสร็จ</div>
          <div class="val">${todayOrders} งาน</div>
        </div>
        <div class="hero-grid-cell">
          <div class="lbl">🛵 กำลังทำ</div>
          <div class="val">${activeOrders.length} งาน</div>
        </div>
      </div>
    </div>
  `;

  // ─── Layer 2: ACTION ───
  const actionItems = [];

  if (pendingRevenue > 0) {
    actionItems.push(`
      <div class="action-card warn ripple" onclick="document.querySelector('[data-go=finance]').click()">
        <div class="action-icon">💰</div>
        <div class="action-info">
          <div class="action-title">มียอดค้างเก็บจากไรเดอร์</div>
          <div class="action-value">฿${pendingRevenue.toFixed(2)}</div>
          <div class="action-sub">จาก ${topDebtors.length} ไรเดอร์ — แตะดูรายละเอียด</div>
        </div>
        <button class="action-btn orange">ดูเลย →</button>
      </div>
    `);
  }

  const pendingMerchants = store.merchants.filter(m => !m.verified).length;
  if (pendingMerchants > 0) {
    actionItems.push(`
      <div class="action-card blue ripple" onclick="document.querySelector('[data-go=merchants]').click()">
        <div class="action-icon">🏪</div>
        <div class="action-info">
          <div class="action-title">ร้านค้ารออนุมัติ</div>
          <div class="action-value">${pendingMerchants} ร้าน</div>
          <div class="action-sub">ตรวจสอบและอนุมัติร้านใหม่</div>
        </div>
        <button class="action-btn blue">ตรวจสอบ →</button>
      </div>
    `);
  }

  if (activeOrders.length > 0) {
    actionItems.push(`
      <div class="action-card green ripple" onclick="document.querySelector('[data-go=orders]').click()">
        <div class="action-icon">🛵</div>
        <div class="action-info">
          <div class="action-title">ออเดอร์กำลังดำเนินการ</div>
          <div class="action-value">${activeOrders.length} ออเดอร์</div>
          <div class="action-sub">ติดตามสถานะแบบเรียลไทม์</div>
        </div>
        <button class="action-btn green">ติดตาม →</button>
      </div>
    `);
  }

  if (actionItems.length === 0) {
    actionItems.push(`
      <div class="action-card green" style="text-align:center;flex-direction:column;gap:6px;padding:24px">
        <div style="font-size:48px">✅</div>
        <div class="action-title" style="font-size:15px">ทุกอย่างเรียบร้อย!</div>
        <div class="action-sub">ไม่มีงานค้าง ไม่มียอดต้องเก็บ</div>
      </div>
    `);
  }

  const actionSection = `
    <div class="section-divider">
      <div class="title">🎯 ต้องทำอะไรต่อ</div>
      <div class="line"></div>
    </div>
    ${actionItems.join('')}
  `;

  // ─── Layer 3: DETAIL ───
  const debtorList = topDebtors.length > 0 ? `
    <div class="card" style="padding:16px">
      <div style="font-weight:900;font-size:14px;margin-bottom:12px">⚠️ ไรเดอร์ที่มียอดค้าง (Top 3)</div>
      ${topDebtors.map(([_, r], i) => `
        <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0f0f0;min-height:56px">
          <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#FF6B35,#E55A2B);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px">${i+1}</div>
          <div style="flex:1">
            <div style="font-weight:800;font-size:13px">${esc(r.name)}</div>
            <div style="font-size:11px;color:var(--mut)">${r.todayCount} งานวันนี้</div>
          </div>
          <div style="font-weight:900;color:var(--warn);font-size:16px">฿${r.owe.toFixed(2)}</div>
        </div>
      `).join('')}
    </div>
  ` : '';

  const recentOrders = [...store.orders]
    .sort((a,b) => ts(b) - ts(a))
    .slice(0, 5)
    .map(o => {
      const fare = Number(o.fare || 0);
      const profit = (fare * 0.2).toFixed(2);
      const statusColor = {
        done:'#00A651', cancelled:'#999', searching:'#E65100',
        accepted:'#1565C0', picked_up:'#9C27B0', on_the_way:'#00A651'
      }[o.status] || '#666';

      return `
        <div class="ripple" style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0f0f0;cursor:pointer;min-height:60px" data-order="${esc(o.id)}">
          <div style="width:10px;height:10px;border-radius:50%;background:${statusColor};flex-shrink:0"></div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(o.title || 'ออเดอร์')}</div>
            <div style="font-size:11px;color:var(--mut);margin-top:2px">${fmtTime(o.createdAt)} • ${esc(STATUS[o.status] || o.status)}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-weight:900;color:var(--brand);font-size:14px">+฿${profit}</div>
            <div style="font-size:10px;color:var(--mut)">กำไร 20%</div>
          </div>
        </div>
      `;
    }).join('');

  const detailSection = `
    <div class="section-divider">
      <div class="title">📊 ดูเพิ่มเติม</div>
      <div class="line"></div>
    </div>
    ${debtorList}
    <div class="card" style="padding:16px">
      <div style="font-weight:900;font-size:14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between">
        <span>🕐 ออเดอร์ล่าสุด</span>
        <button class="ripple" onclick="document.querySelector('[data-go=orders]').click()" style="background:transparent;color:var(--brand);font-size:12px;padding:8px 12px;font-weight:900;font-family:inherit">ดูทั้งหมด →</button>
      </div>
      ${recentOrders || '<div style="text-align:center;padding:20px;color:#999;font-size:13px;font-weight:600">ยังไม่มีออเดอร์</div>'}
    </div>
  `;

  return `${heroSection}${actionSection}${detailSection}`;
}

// ══════════════════════════════════════════════════════════════════════
//  💰 FINANCE
// ══════════════════════════════════════════════════════════════════════
function finance() {
  const today = new Date(); today.setHours(0,0,0,0);
  const yesterdayStart = new Date(today); yesterdayStart.setDate(yesterdayStart.getDate() - 1);

  const completedOrders = store.orders.filter(o => o.status === 'done');

  let totalGrossAll = 0, totalPlatformFeeAll = 0, totalRiderEarnAll = 0;
  const riderStats = {};

  completedOrders.forEach(o => {
    const fare = Number(o.fare || 0);
    if (fare <= 0) return;

    const platformFee = Math.round(fare * 0.20 * 100) / 100;
    const riderEarn = fare - platformFee;

    const rId = o.riderId || 'unknown';
    const rName = o.rider?.name || o.riderName || 'ไม่ระบุชื่อ';
    const orderDate = toDate(o.createdAt);
    if (!orderDate) return;

    if (!riderStats[rId]) {
      riderStats[rId] = {
        id: rId, name: rName,
        today: { count: 0, amount: 0 },
        yesterday: { count: 0, amount: 0 },
        total: { count: 0, amount: 0 }
      };
    }

    totalGrossAll += fare;
    totalPlatformFeeAll += platformFee;
    totalRiderEarnAll += riderEarn;

    riderStats[rId].total.count++;
    riderStats[rId].total.amount += riderEarn;

    if (orderDate >= today) {
      riderStats[rId].today.count++;
      riderStats[rId].today.amount += riderEarn;
    } else if (orderDate >= yesterdayStart && orderDate < today) {
      riderStats[rId].yesterday.count++;
      riderStats[rId].yesterday.amount += riderEarn;
    }
  });

  const sortedRiders = Object.values(riderStats).sort((a,b) => b.today.amount - a.today.amount);

  let tableRows = '';
  if (sortedRiders.length === 0) {
    tableRows = '<tr><td colspan="6" style="text-align:center;padding:20px;color:#999;font-weight:600">ยังไม่มีออเดอร์ที่เสร็จสมบูรณ์</td></tr>';
  } else {
    sortedRiders.forEach(r => {
      const hl = r.today.amount > 0 ? 'class="highlight-row"' : '';
      tableRows += `
        <tr ${hl}>
          <td style="font-weight:900">${esc(r.name)}</td>
          <td class="text-center">${r.today.count}</td>
          <td class="text-right money-pos">฿${r.today.amount.toFixed(2)}</td>
          <td class="text-center" style="color:#888">${r.yesterday.count}</td>
          <td class="text-right" style="color:#888">฿${r.yesterday.amount.toFixed(2)}</td>
          <td class="text-right" style="font-weight:900;color:var(--warn)">฿${r.total.amount.toFixed(2)}</td>
        </tr>
      `;
    });
  }

  return `
    <div class="grid" style="margin-bottom:20px">
      <div class="card" style="border-left:4px solid var(--mut)">
        <div class="num" style="color:var(--mut)">฿${totalGrossAll.toLocaleString(undefined,{minimumFractionDigits:2})}</div>
        <div class="lbl">ยอดขายรวม (ก่อนหัก)</div>
      </div>
      <div class="card" style="border-left:4px solid var(--danger)">
        <div class="num" style="color:var(--danger)">฿${totalPlatformFeeAll.toLocaleString(undefined,{minimumFractionDigits:2})}</div>
        <div class="lbl">รายได้แพลตฟอร์ม (20%)</div>
      </div>
      <div class="card" style="border-left:4px solid var(--brand)">
        <div class="num" style="color:var(--brand)">฿${totalRiderEarnAll.toLocaleString(undefined,{minimumFractionDigits:2})}</div>
        <div class="lbl">ค่าตอบแทนไรเดอร์ (80%)</div>
      </div>
    </div>

    <div class="fin-table-wrap">
      <table class="fin-table">
        <thead>
          <tr>
            <th>ไรเดอร์</th>
            <th class="text-center">วันนี้<br>(งาน)</th>
            <th class="text-right">วันนี้<br>(บาท)</th>
            <th class="text-center">เมื่อวาน<br>(งาน)</th>
            <th class="text-right">เมื่อวาน<br>(บาท)</th>
            <th class="text-right" style="background:#FFF3E0;color:var(--warn)">ยอดค้างจ่าย<br>(สะสม)</th>
          </tr>
        </thead>
        <tbody>${tableRows}</tbody>
        <tfoot>
          <tr style="background:#eee;font-weight:900;border-top:2px solid #ccc">
            <td>รวมทั้งหมด</td>
            <td class="text-center">${completedOrders.length}</td>
            <td class="text-right">-</td>
            <td class="text-center">-</td>
            <td class="text-right">-</td>
            <td class="text-right" style="color:var(--warn)">฿${totalRiderEarnAll.toFixed(2)}</td>
          </tr>
        </tfoot>
      </table>
    </div>

    <p style="font-size:11px;color:#888;margin-top:10px;text-align:center;font-weight:600">
      * ข้อมูลอัปเดตอัตโนมัติเมื่อมีออเดอร์สถานะ "เสร็จสิ้น"<br>
      * คอลัมน์สุดท้ายคือยอดรวมที่ไรเดอร์ได้รับ (หลังหัก 20%)
    </p>
  `;
}

      </div>
      <div class="data-card-actions">
        <button class="pri ripple" data-rider="${esc(r.id)}">${r.status === 'active' ? '⏸️ หยุดงาน' : '▶️ เปิดงาน'}</button>
        <button class="dan ripple" data-del="riders:${esc(r.id)}">🗑️ ลบ</button>
      </div>
    </div>
  `).join('') || '<div class="empty">ไม่พบไรเดอร์</div>');
}

// ─── Users ───
function users() {
  const q = filters.q.toLowerCase();
  const list = store.users.filter(u =>
    !q || [u.name, u.email, u.phone].some(v => String(v || '').toLowerCase().includes(q))
  );

  return searchInput('ค้นหาผู้ใช้...') + (list.map(u => `
    <div class="data-card">
      <div class="data-card-header">
        <div class="data-card-icon" style="background:#E3F2FD">👤</div>
        <div class="data-card-info">
          <div class="data-card-name">${esc(u.name || 'ไม่ระบุชื่อ')}</div>
          <div class="data-card-meta">📧 ${esc(u.email || '—')} • 📞 ${esc(u.phone || '—')}</div>
          <div class="data-card-meta">📍 ${esc(u.address || 'ไม่ระบุที่อยู่')} • 🕐 ${fmtTime(u.createdAt)}</div>
        </div>
      </div>
      <div class="data-card-actions">
        <button class="dan ripple" data-del="users:${esc(u.id)}">🗑️ ลบผู้ใช้</button>
      </div>
    </div>
  `).join('') || '<div class="empty">ไม่พบผู้ใช้</div>');
}

// ─── Modals ───
function openModal(title, bodyHtml) {
  $('modal-title').textContent = title;
  $('modal-body').innerHTML = bodyHtml;
  $('modal-overlay').classList.add('show');
}
function closeModal() { $('modal-overlay').classList.remove('show'); }

function orderDetail(id) {
  const o = store.orders.find(x => x.id === id);
  if (!o) return;

  const opts = Object.entries(STATUS).map(([k, v]) =>
    `<option value="${k}" ${o.status === k ? 'selected' : ''}>${v}</option>`
  ).join('');

  const html = `
    <div class="meta" style="font-family:monospace;font-size:12px;margin-bottom:8px">ID: ${esc(o.id)}</div>
    <div class="nm" style="font-size:18px;margin-bottom:8px">${esc(o.title || '')}</div>
    <div class="meta" style="white-space:pre-wrap;background:#f8f9fa;padding:12px;border-radius:10px;margin-bottom:12px">${esc(itemsText(o.items))}</div>

    <div style="font-weight:900;margin-bottom:4px;font-size:14px">👤 ข้อมูลลูกค้า</div>
    <div class="meta">${esc(o.userName || '')} • ${esc(o.userPhone || '')}</div>
    <div class="meta">📍 ${esc(o.address || '')} ${o.note ? '<br>📝 ' + esc(o.note) : ''}</div>

    <div style="margin-top:16px;padding-top:12px;border-top:1px solid #eee;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
      <div>
        <div class="meta">ค่าสินค้า ฿${esc(o.price || 0)} + ค่าส่ง ฿${esc(o.fare || 0)}</div>
        <div style="font-size:20px;font-weight:900;color:var(--brand)">รวม ฿${esc(o.total || 0)}</div>
      </div>
      <select id="ostatus" data-oid="${esc(o.id)}" style="width:auto;margin:0;padding:12px;font-weight:700;border-color:var(--brand);min-height:48px">
        ${opts}
      </select>
    </div>
    <button class="dan big ripple" style="margin-top:16px" onclick="cancelOrder('${esc(o.id)}')">❌ ยกเลิกออเดอร์นี้</button>
  `;
  openModal('📋 รายละเอียดออเดอร์', html);
}

function editMerchantForm(id) {
  const m = store.merchants.find(x => x.id === id);
  if (!m) return;

  const html = `
    <label style="font-weight:800;font-size:13px">ชื่อร้าน *</label>
    <input type="text" id="edit-name" value="${esc(m.name || '')}">
    <label style="font-weight:800;font-size:13px">เบอร์โทร</label>
    <input type="tel" id="edit-phone" value="${esc(m.phone || '')}">
    <label style="font-weight:800;font-size:13px">ที่อยู่</label>
    <textarea id="edit-address" rows="2">${esc(m.address || '')}</textarea>
    <label style="font-weight:800;font-size:13px">ละติจูด (Lat)</label>
    <input type="number" step="any" id="edit-lat" value="${m.lat || ''}">
    <label style="font-weight:800;font-size:13px">ลองจิจูด (Lng)</label>
    <input type="number" step="any" id="edit-lng" value="${m.lng || ''}">
    <button class="pri big ripple" onclick="saveMerchantEdit('${esc(id)}')">💾 บันทึกการแก้ไข</button>
  `;
  openModal('✏️ แก้ไขร้านค้า', html);
}

async function saveMerchantEdit(id) {
  const updates = {
    name: $('edit-name').value.trim(),
    phone: $('edit-phone').value.trim(),
    address: $('edit-address').value.trim(),
    lat: parseFloat($('edit-lat').value) || null,
    lng: parseFloat($('edit-lng').value) || null,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  if (!updates.name) return toast('กรุณากรอกชื่อร้าน', true);
  try {
    await db.collection('merchants').doc(id).update(updates);
    toast('บันทึกเรียบร้อย');
    closeModal();
  } catch (e) {
    toast('บันทึกไม่สำเร็จ: ' + e.message, true);
  }
}

async function cancelOrder(id) {
  if (!confirm('ยืนยันการยกเลิกออเดอร์นี้?')) return;
  try {
    await db.collection('orders').doc(id).update({
      status: 'cancelled',
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('ยกเลิกออเดอร์แล้ว');
    closeModal();
  } catch (e) {
    toast('ยกเลิกไม่สำเร็จ', true);
  }
}

// ─── Event Delegation ───
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-go],[data-order],[data-verify],[data-rider],[data-del],[data-edit-m]');
  if (!t) return;

  try {
    if (t.dataset.go) {
      current = t.dataset.go;
      filters.q = '';
      renderNav();
      render();
      window.scrollTo(0, 0);
    }
    else if (t.dataset.order) {
      orderDetail(t.dataset.order);
    }
    else if (t.dataset.editM) {
      editMerchantForm(t.dataset.editM);
    }
    else if (t.dataset.verify) {
      const m = store.merchants.find(x => x.id === t.dataset.verify);
      await db.collection('merchants').doc(m.id).update({
        verified: !m.verified,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      toast('อัปเดตสถานะร้านสำเร็จ');
    }
    else if (t.dataset.rider) {
      const r = store.riders.find(x => x.id === t.dataset.rider);
      await db.collection('riders').doc(r.id).update({
        status: r.status === 'active' ? 'inactive' : 'active'
      });
      toast('อัปเดตสถานะไรเดอร์สำเร็จ');
    }
    else if (t.dataset.del) {
      const [col, id] = t.dataset.del.split(':');
      if (confirm('⚠️ ยืนยันการลบข้อมูลนี้?\nการกระทำนี้ไม่สามารถย้อนกลับได้')) {
        await db.collection(col).doc(id).delete();
        toast('ลบข้อมูลสำเร็จ');
      }
    }
  } catch (err) {
    console.error(err);
    toast('ไม่สำเร็จ: ' + err.code, true);
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    filters.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const q = $('q');
    if (q) { q.focus(); q.setSelectionRange(pos, pos); }
  }
});

document.addEventListener('change', async e => {
  if (e.target.id === 'ofilter') {
    filters.orders = e.target.value;
    render();
  }
  if (e.target.id === 'ostatus') {
    try {
      await db.collection('orders').doc(e.target.dataset.oid).update({
        status: e.target.value,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      toast('อัปเดตสถานะออเดอร์แล้ว');
      closeModal();
    } catch (err) {
      toast('ไม่สำเร็จ: ' + err.code, true);
    }
  }
});

$('modal-overlay').addEventListener('click', e => {
  if (e.target === $('modal-overlay')) closeModal();
});

// ─── Ripple + Haptic ───
document.addEventListener('touchstart', e => {
  const el = e.target.closest('.ripple, button, .action-card, .data-card, nav button');
  if (!el) return;
  el.style.transform = 'scale(.97)';
  setTimeout(() => { el.style.transform = ''; }, 150);
}, { passive: true });

document.addEventListener('click', e => {
  const el = e.target.closest('button, .action-card, .data-card, nav button');
  if (el && navigator.vibrate) navigator.vibrate(10);
}, { passive: true });
