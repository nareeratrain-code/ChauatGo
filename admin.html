<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#76B82A">
<title>Chauat Go Admin — v3.3.3</title>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chauat Admin">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- 🔔 Toast -->
<div class="toast" id="toast"></div>

<!-- 🐛 Debug Console -->
<div class="debug-console" id="debugConsole">
  <strong>Debug Console:</strong><br>
</div>

<!-- 🔴 Offline Bar -->
<div class="offline-bar" id="offlineBar">🔴 ออฟไลน์ — ตรวจสอบการเชื่อมต่อ</div>

<!-- 📱 PWA Banner -->
<div class="pwa-banner hidden" id="pwaBanner">
  <div class="pwa-banner-icon">🛵</div>
  <div class="pwa-banner-info">
    <div class="pwa-banner-title">ติดตั้ง Chauat Admin</div>
    <div class="pwa-banner-sub">ใช้งานเร็วขึ้น เปิดจากหน้าจอหลัก</div>
  </div>
  <button class="pwa-install-btn" onclick="installPWA()">ติดตั้ง</button>
  <button class="pwa-close-btn" onclick="hidePWABanner()">✕</button>
</div>

<!-- ═══════════════ LOGIN SCREEN ═══════════════ -->
<div id="login">
  <form class="box" id="login-form" onsubmit="handleLogin(event)">
    <h1>🛵 Chauat Go Admin</h1>
    <div class="tab-btns">
      <button type="button" class="tab-btn active" id="tab-login-btn" onclick="switchTab('login')">เข้าสู่ระบบ</button>
      <button type="button" class="tab-btn" id="tab-signup-btn" onclick="switchTab('signup')">สมัครสมาชิก</button>
    </div>
    <div id="form-login">
      <input type="email" id="em" placeholder="อีเมลผู้ดูแล" autocomplete="username" required>
      <input type="password" id="pw" placeholder="รหัสผ่าน" autocomplete="current-password" required>
      <button class="pri big ripple" type="submit" id="btn-login">เข้าสู่ระบบ</button>
      <button type="button" class="sec big ripple" style="margin-top:8px" onclick="handleForgot()">🔑 ลืมรหัสผ่าน</button>
    </div>
    <div id="form-signup" style="display:none">
      <input type="text" id="su-name" placeholder="ชื่อ-นามสกุล" required>
      <input type="email" id="su-email" placeholder="อีเมล" required>
      <input type="password" id="su-pw" placeholder="รหัสผ่าน (6+ ตัว)" minlength="6" required>
      <input type="password" id="su-pw2" placeholder="ยืนยันรหัสผ่าน" minlength="6" required>
      <button class="pri big ripple" type="button" onclick="handleSignup()">✅ สมัครสมาชิก</button>
    </div>
  </form>
</div>

<!-- ═══════════════ MAIN APP ═══════════════ -->
<div id="app" class="hidden">
  <header>
    <h1>Chauat Go Admin <span class="vbadge">v3.3.3</span></h1>
    <div class="admin-info">
      <div id="who">-</div>
      <button class="sec ripple" id="logout">ออกจากระบบ</button>
    </div>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<!-- ═══════════════ CHAT ═══════════════ -->
<div class="chat-container" id="chat-container">
  <div class="chat-header">
    <button class="back-btn ripple" onclick="closeChat()">←</button>
    <div class="chat-info">
      <div class="chat-name" id="chat-name">-</div>
      <div class="chat-sub" id="chat-sub">-</div>
    </div>
  </div>
  <div class="chat-messages" id="chat-messages"></div>
  <div class="chat-input-bar">
    <button class="icon-btn ripple" onclick="pickChatImage()">📷</button>
    <input type="file" id="chat-image-input" accept="image/*" style="display:none" onchange="sendChatImage(this.files[0])">
    <textarea id="chat-input" placeholder="พิมพ์ข้อความ..." rows="1" oninput="autoResize(this)"></textarea>
    <button class="send-btn ripple" onclick="sendChatText()">➤</button>
  </div>
</div>

<!-- ═══════════════ MODAL ═══════════════ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-hdr">
      <h2 id="modal-title">Title</h2>
      <button class="close-btn ripple" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<script src="admin.js"></script>
</body>
</html>
