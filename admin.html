<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#00A651">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Chauat Go Admin v3.3.0</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'IBM Plex Sans Thai',sans-serif;-webkit-tap-highlight-color:transparent}
:root{--brand:#00A651;--bg:#EDF6DC;--text:#1A1A1A;--mut:#6B7280;--danger:#E53935;--warn:#E65100;--blue:#1565C0;--purple:#9C27B0;--teal:#00897B;--border:#e5e7eb;--red:#C62828;--gold:#F57C00}
body{background:var(--bg);color:var(--text);max-width:1000px;margin:0 auto;min-height:100vh;padding-bottom:40px}
.hidden{display:none!important}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#76B82A,#3B7A16);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;overflow-y:auto}
.box{background:#fff;border-radius:20px;padding:32px 24px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.15);margin:auto}
.box h1{font-size:22px;color:var(--brand);text-align:center;margin-bottom:8px;font-weight:900}
input,select,textarea{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:12px;font-family:inherit;font-weight:600;min-height:52px;outline:none;background:#fafafa}
input:focus,textarea:focus,select:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(0,166,81,.1)}
button{cursor:pointer;border:none;border-radius:10px;font-weight:800;font-size:13px;padding:10px 16px;font-family:inherit;min-height:44px}
button:disabled{opacity:.5}
.pri{background:var(--brand);color:#fff}.sec{background:#f0f0f0;color:#555}.dan{background:#FFEBEE;color:var(--danger)}.blue{background:var(--blue);color:#fff}.warn{background:var(--warn);color:#fff}.gold{background:var(--gold);color:#fff}
.big{width:100%;padding:14px;font-size:15px;border-radius:12px;margin-top:8px;min-height:56px}
#installBtn{position:fixed;bottom:20px;left:20px;background:linear-gradient(135deg,#00A651,#008C45);color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;font-weight:900;box-shadow:0 8px 24px rgba(0,166,81,.4);z-index:9990;display:none;gap:8px;align-items:center;border:2px solid #fff}
#installBtn.show{display:flex}
header{background:linear-gradient(135deg,#76B82A,#3B7A16);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;border-radius:0 0 20px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 4px 12px rgba(0,0,0,.1)}
header h1{flex:1;font-size:16px;font-weight:900}
header .admin-info{text-align:right;font-size:11px;line-height:1.4}
header .admin-info button{padding:8px 14px;font-size:11px;margin-top:4px;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3);min-height:36px}
nav{background:#fff;padding:12px 8px;border-bottom:1px solid var(--border);position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:40;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav button{background:transparent;color:var(--mut);padding:10px 4px;border-radius:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:auto;position:relative}
nav button .nav-icon{font-size:26px;line-height:1;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#f5f5f5}
nav button .nav-label{font-size:10px;font-weight:900;text-align:center;line-height:1.2}
nav button .nav-badge{position:absolute;top:2px;right:6px;background:var(--danger);color:#fff;font-size:9px;font-weight:900;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff;z-index:2;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
nav button.on{color:var(--brand)}
nav button.on .nav-icon{background:#E8F5E9}
main{padding:16px}
.stat-card{border-radius:16px;padding:16px;color:#fff;min-height:110px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.stat-card .stat-icon{font-size:28px;margin-bottom:8px}
.stat-card .stat-value{font-size:26px;font-weight:900;line-height:1;letter-spacing:-1px}
.stat-card .stat-label{font-size:12px;font-weight:700;margin-top:6px;opacity:.95}
.stat-card .stat-sub{font-size:10px;opacity:.8;margin-top:2px;font-weight:700}
.stat-card.green{background:linear-gradient(135deg,#00A651,#008C45)}
.stat-card.blue{background:linear-gradient(135deg,#1565C0,#0D47A1)}
.stat-card.orange{background:linear-gradient(135deg,#FF6B35,#E55A2B)}
.stat-card.purple{background:linear-gradient(135deg,#9C27B0,#6A1B9A)}
.stat-card.teal{background:linear-gradient(135deg,#00897B,#00695C)}
.stat-card.gold{background:linear-gradient(135deg,#F57C00,#E65100)}
.stat-card.red{background:linear-gradient(135deg,#E53935,#C62828)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.hero-card{background:linear-gradient(135deg,#00A651,#008C45);border-radius:24px;padding:24px 20px;color:#fff;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,166,81,.25)}
.hero-label{font-size:13px;opacity:.9;font-weight:700;margin-bottom:6px}
.hero-amount{font-size:40px;font-weight:900;line-height:1;letter-spacing:-1px}
.hero-trend{display:inline-block;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:12px;font-weight:800;margin-top:10px}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.2)}
.hero-grid-cell .lbl{font-size:11px;opacity:.85;font-weight:700}
.hero-grid-cell .val{font-size:20px;font-weight:900;margin-top:2px}
.section-divider{display:flex;align-items:center;gap:8px;margin:24px 0 12px}
.section-divider .title{font-size:14px;font-weight:900}
.section-divider .line{flex:1;height:1px;background:linear-gradient(90deg,#ddd,transparent)}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.data-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.data-card-header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.data-card-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.data-card-info{flex:1;min-width:0}
.data-card-name{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.data-card-meta{font-size:11px;color:var(--mut);font-weight:700;margin-top:2px}
.data-card-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.data-card-actions button{padding:10px 14px;border-radius:10px;border:none;font-size:11px;font-weight:900;min-height:44px}
.tag{font-size:11px;font-weight:900;padding:6px 12px;border-radius:12px;background:#E8F5E9;color:#2E7D32;display:inline-block}
.tag.w{background:#FFF3E0;color:var(--warn)}
.tag.x{background:#f0f0f0;color:#888}
.tag.d{background:#FFEBEE;color:var(--danger)}
.tag.b{background:#E3F2FD;color:var(--blue)}
.tag.p{background:#F3E5F5;color:var(--purple)}
.tag.ban{background:#FFCDD2;color:var(--red)}
.empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:14px;background:#fff;border-radius:16px;font-weight:600}
.search-box{background:#fff;border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.04);margin-bottom:12px;min-height:52px}
.search-box input{border:none;outline:none;font-size:14px;font-weight:600;flex:1;background:transparent;padding:0;margin:0;min-height:auto}
.filter-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{padding:10px 16px;border-radius:16px;font-size:12px;font-weight:900;background:#fff;color:var(--mut);cursor:pointer;white-space:nowrap;border:1px solid var(--border);min-height:40px;display:flex;align-items:center;font-family:inherit}
.filter-chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.table-wrap{overflow-x:auto;background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
table.gp-table{width:100%;border-collapse:collapse;font-size:13px;min-width:500px}
table.gp-table th{background:#f8f9fa;padding:12px;text-align:left;border-bottom:2px solid #ddd;white-space:nowrap;font-weight:900;font-size:12px}
table.gp-table td{padding:12px;border-bottom:1px solid #eee;font-weight:600}
.money-pos{color:var(--brand);font-weight:900}
.text-right{text-align:right}
.text-center{text-align:center}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #eee}
.modal-hdr h2{font-size:18px;font-weight:900}
.close-btn{background:#f0f0f0;width:44px;height:44px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);background:#222;color:#fff;padding:14px 22px;border-radius:16px;font-size:14px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;z-index:999;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger)}
.settlement-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);border-left:5px solid #ccc;position:relative}
.settlement-card.status-pending{border-left-color:#FFA500}
.settlement-card.status-notified{border-left-color:#FF6B35;background:linear-gradient(135deg,#FFF8E1,#FFF)}
.settlement-card.status-paid{border-left-color:var(--brand);background:linear-gradient(135deg,#F0FDF4,#fff)}
.settlement-card.status-overdue{border-left-color:var(--danger);background:linear-gradient(135deg,#FFEBEE,#fff)}
.settlement-card.status-banned{border-left-color:var(--red);background:linear-gradient(135deg,#FFCDD2,#fff)}
.settlement-card.status-gp{border-left-color:var(--gold)}
.settlement-status-badge{padding:6px 14px;border-radius:20px;font-size:11px;font-weight:900;display:inline-block;text-transform:uppercase;letter-spacing:.5px}
.settlement-status-badge.pending{background:#FFF3E0;color:#E65100}
.settlement-status-badge.notified{background:#FF6B35;color:#fff;animation:pulse 2s infinite}
.settlement-status-badge.paid{background:#E8F5E9;color:#2E7D32}
.settlement-status-badge.overdue{background:#FFCDD2;color:#C62828}
.settlement-status-badge.banned{background:#C62828;color:#fff}
.countdown-display{background:linear-gradient(135deg,#FF6B35,#E55A2B);color:#fff;padding:12px 16px;border-radius:12px;text-align:center;font-weight:900;font-size:18px;letter-spacing:1px;margin:10px 0;font-family:monospace}
.countdown-display.urgent{background:linear-gradient(135deg,#E53935,#C62828);animation:pulse 1s infinite}
.countdown-display.expired{background:#666}
.slip-preview-img{width:100%;border-radius:12px;margin-top:10px;max-height:300px;object-fit:contain;background:#f5f5f5;border:1px solid #eee;cursor:pointer}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.confirm-overlay.show{display:flex}
.confirm-box{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:400px;text-align:center}
.confirm-box .ico{font-size:56px;margin-bottom:12px}
.confirm-box h3{font-size:18px;font-weight:900;margin-bottom:8px}
.confirm-box p{font-size:14px;color:var(--mut);font-weight:600;margin-bottom:20px;line-height:1.6;white-space:pre-line}
.confirm-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chat-container{position:fixed;inset:0;background:#EDF6DC;z-index:300;display:none;flex-direction:column}
.chat-container.show{display:flex}
.chat-header{background:linear-gradient(135deg,#00A651,#008C45);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:12px}
.chat-header .back-btn{background:rgba(255,255,255,.2);color:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;padding:0}
.chat-header .chat-info{flex:1}
.chat-header .chat-name{font-size:15px;font-weight:900}
.chat-header .chat-sub{font-size:11px;opacity:.85;font-weight:600;margin-top:2px}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.chat-msg{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;font-weight:600;line-height:1.4;word-wrap:break-word}
.chat-msg.out{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.chat-msg.in{align-self:flex-start;background:#fff;border-bottom-left-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.chat-msg.system{align-self:center;background:#FFF3E0;color:var(--warn);font-size:12px;padding:8px 14px;border-radius:20px;max-width:90%;text-align:center}
.chat-msg .msg-time{font-size:10px;opacity:.7;margin-top:4px;font-weight:700}
.chat-msg .msg-image{max-width:100%;border-radius:10px;margin-bottom:6px;display:block;cursor:pointer}
.chat-msg .msg-slip{max-width:100%;border-radius:10px;margin-bottom:6px;display:block;cursor:pointer;border:2px solid #FFA500}
.chat-input-bar{background:#fff;padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--border)}
.chat-input-bar textarea{flex:1;margin:0;min-height:44px;max-height:120px;padding:10px 14px;resize:none;border-radius:22px;line-height:1.4;font-weight:600}
.chat-input-bar .icon-btn{width:44px;height:44px;min-height:44px;border-radius:50%;background:#f0f0f0;color:#555;font-size:20px;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.chat-input-bar .slip-btn{background:#FFF3E0;color:var(--warn)}
.chat-input-bar .send-btn{width:44px;height:44px;min-height:44px;border-radius:50%;background:var(--brand);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.chat-list-item{background:#fff;border-radius:14px;padding:14px;margin-bottom:8px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.04);cursor:pointer}
.chat-list-item .avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#00A651,#008C45);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-list-item .chat-info{flex:1;min-width:0}
.chat-list-item .chat-title{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-list-item .chat-preview{font-size:12px;color:var(--mut);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-list-item .chat-meta{text-align:right;flex-shrink:0}
.chat-list-item .chat-time{font-size:10px;color:var(--mut);font-weight:700}
.chat-list-item .chat-unread{background:var(--danger);color:#fff;font-size:10px;font-weight:900;border-radius:10px;padding:2px 6px;min-width:20px;text-align:center;margin-top:4px;display:inline-block}
#debugConsole{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.9);color:#0f0;font-size:11px;font-family:monospace;padding:8px 12px;max-height:100px;overflow-y:auto;z-index:9999;display:none;border-top:2px solid #333}
#debugConsole.show{display:block}
#debugToggle{position:fixed;bottom:100px;right:12px;background:rgba(0,0,0,.7);color:#0f0;width:44px;height:44px;border-radius:50%;font-size:18px;z-index:9998;display:flex;align-items:center;justify-content:center;padding:0}
.info-box{background:linear-gradient(135deg,#E3F2FD,#BBDEFB);border-radius:16px;padding:16px;margin-bottom:16px;border-left:4px solid #1565C0}
.info-box.gp{background:linear-gradient(135deg,#FFF3E0,#FFE0B2);border-left-color:var(--gold)}
.info-box .info-title{font-weight:900;font-size:14px;color:#0D47A1;margin-bottom:8px}
.info-box.gp .info-title{color:var(--gold)}
.info-box .info-line{font-size:13px;color:#1565C0;font-weight:700;line-height:1.7}
.info-box.gp .info-line{color:#8D4A00}
.alert-banner{background:linear-gradient(135deg,#FFEBEE,#FFCDD2);border-radius:16px;padding:16px;margin-bottom:16px;border-left:4px solid var(--danger)}
.alert-banner.gp{background:linear-gradient(135deg,#FFF3E0,#FFE0B2);border-left-color:var(--gold)}
.alert-banner .alert-title{font-weight:900;font-size:14px;color:#C62828;margin-bottom:8px}
.alert-banner.gp .alert-title{color:var(--gold)}
.alert-banner .alert-line{font-size:13px;color:#B71C1C;font-weight:700;line-height:1.7}
.alert-banner.gp .alert-line{color:#8D4A00}
.settlement-progress{height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden;margin:10px 0}
.settlement-progress-fill{height:100%;background:linear-gradient(90deg,#FF6B35,#E53935);border-radius:4px;transition:width 1s linear}
.gp-progress{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.gp-progress-bar{height:10px;background:#f0f0f0;border-radius:5px;overflow:hidden;margin:8px 0}
.gp-progress-fill{height:100%;background:linear-gradient(90deg,#FFA500,#E65100);border-radius:5px;transition:width .5s}
.section-header-tabs{display:flex;gap:6px;background:#fff;padding:6px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.section-header-tab{flex:1;padding:12px;border-radius:10px;font-weight:900;font-size:13px;background:transparent;color:var(--mut);cursor:pointer;font-family:inherit;min-height:44px;transition:.2s;border:none}
.section-header-tab.active{background:var(--brand);color:#fff}
.section-header-tab.active.gp{background:var(--gold)}
</style>
</head>
<body>

<div class="toast" id="toast"></div>
<button id="debugToggle" onclick="toggleDebug()">🐞</button>
<div id="debugConsole"></div>
<button id="installBtn" onclick="installPWA()"><span style="font-size:20px">📲</span><span>ติดตั้งแอป</span></button>

<!-- LOGIN -->
<div id="login">
  <div class="box">
    <h1>🛵 Chauat Go Admin</h1>
    <div style="text-align:center;font-size:11px;color:#999;font-weight:700;margin-bottom:16px">v3.3.0</div>
    <input type="email" id="em" placeholder="อีเมลผู้ดูแล" value="adminchauatgo@gmail.com" autocomplete="username">
    <input type="password" id="pw" placeholder="รหัสผ่าน" autocomplete="current-password">
    <button class="pri big" id="btn-login" onclick="handleLogin()">🔓 เข้าสู่ระบบ</button>
    <button class="sec big" style="margin-top:8px" onclick="handleForgot()">🔑 ลืมรหัสผ่าน</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <h1>Chauat Go Admin <span style="font-size:10px;opacity:.7">v3.3.0</span></h1>
    <div class="admin-info">
      <div id="who">-</div>
      <button onclick="handleLogout()">ออกจากระบบ</button>
    </div>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<!-- CHAT -->
<div class="chat-container" id="chat-container">
  <div class="chat-header">
    <button class="back-btn" onclick="closeChat()">←</button>
    <div class="chat-info">
      <div class="chat-name" id="chat-name">-</div>
      <div class="chat-sub" id="chat-sub">-</div>
    </div>
  </div>
  <div class="chat-messages" id="chat-messages"></div>
  <div class="chat-input-bar">
    <button class="icon-btn" onclick="pickChatImage()">📷</button>
    <button class="icon-btn slip-btn" onclick="pickChatSlip()">🧾</button>
    <input type="file" id="chat-image-input" accept="image/*" style="display:none">
    <input type="file" id="chat-slip-input" accept="image/*" style="display:none">
    <textarea id="chat-input" placeholder="พิมพ์ข้อความ..." rows="1"></textarea>
    <button class="send-btn" onclick="sendChatText()">➤</button>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">

const fmtTimeShort = t => { if (!t) return ''; const d = toDate(t); return d ? d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) : ''; };
const fmtDate = t => { if (!t) return '—'; const d = toDate(t); return d ? d.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: '2-digit' }) : '—'; };

//  💵 คำนวณค่าบริการ
// ═══════════════════════════════════════════════════════════════════
function calcDeliveryFee(distanceKm) {
  const km = Number(distanceKm || 0);
  const base = CONFIG.baseFee;
  const extraKm = Math.max(0, km - CONFIG.freeKm);
  const extraFee = Math.round(extraKm * CONFIG.perKmRate * 100) / 100;
  const total = Math.round((base + extraFee) * 100) / 100;
  const rider = Math.round(total * CONFIG.riderFeeShare * 100) / 100;
  const platform = Math.round(total * CONFIG.platformFeeShare * 100) / 100;
  return { base, extraKm, extraFee, total, rider, platform, distance: km };
}
function getOrderDistance(order) {
  if (order.distanceKm) return Number(order.distanceKm);
  if (order.distance) return Number(order.distance) / 1000;
  return 0;
}

// ═══════════════════════════════════════════════════════════════════
//  💰 GP ร้านค้า
// ═══════════════════════════════════════════════════════════════════
function getGPFreeEndDate(merchant) {
  const created = toDate(merchant.createdAt || merchant.gpAcceptedAt);
  if (!created) return null;
  const end = new Date(created);
  end.setDate(end.getDate() + CONFIG.gpFreeDays);
  return end;
}
function isMerchantGPActive(merchant) {
  const end = getGPFreeEndDate(merchant);
  if (!end) return false;
  return new Date() >= end;
}
function getDaysLeftGP(merchant) {
  const end = getGPFreeEndDate(merchant);
  if (!end) return 0;
  const diff = Math.ceil((end - new Date()) / (1000 * 60 * 60 * 24));
  return Math.max(0, diff);
}
function calcGP(foodAmount, merchant) {
  if (!isMerchantGPActive(merchant)) return { total: 0, rider: 0, platform: 0, free: true };
  const total = Math.round(foodAmount * CONFIG.gpRate * 100) / 100;
  const rider = Math.round(foodAmount * CONFIG.gpRiderShare * 100) / 100;
  const platform = Math.round(foodAmount * CONFIG.gpPlatformShare * 100) / 100;
  return { total, rider, platform, free: false };
}
function getCurrentGPCycle() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  let start, end, label;
  if (d <= 14) {
    start = new Date(y, m, 1); end = new Date(y, m, 14, 23, 59, 59);
    label = `${start.toLocaleDateString('th-TH',{day:'2-digit',month:'short'})} - ${end.toLocaleDateString('th-TH',{day:'2-digit',month:'short'})}`;
  } else {
    start = new Date(y, m, 15); end = new Date(y, m + 1, 0, 23, 59, 59);
    label = `${start.toLocaleDateString('th-TH',{day:'2-digit',month:'short'})} - ${end.toLocaleDateString('th-TH',{day:'2-digit',month:'short'})}`;
  }
  return { start, end, label };
}
function getPrevGPCycle() {
  const c = getCurrentGPCycle();
  const prevEnd = new Date(c.start); prevEnd.setDate(prevEnd.getDate() - 1); prevEnd.setHours(23, 59, 59);
  const y = prevEnd.getFullYear(), m = prevEnd.getMonth(), d = prevEnd.getDate();
  let start;
  if (d <= 14) start = new Date(y, m, 1);
  else start = new Date(y, m, 15);
  return { start, end: prevEnd, label: `${start.toLocaleDateString('th-TH',{day:'2-digit',month:'short'})} - ${prevEnd.toLocaleDateString('th-TH',{day:'2-digit',month:'short'})}` };
}

async function generateDailySettlements() {
  const today = todayKey();
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const end = new Date(); end.setHours(23, 59, 59, 999);

  const completed = store.orders.filter(o => {
    if (o.status !== 'done') return false;
    const d = toDate(o.createdAt);
    return d && d >= start && d <= end && o.riderId;
  });

  const byRider = {};
  completed.forEach(o => {
    const rId = o.riderId;
    if (!byRider[rId]) byRider[rId] = { riderId: rId, riderName: o.riderName || 'ไม่ระบุ', orders: [], totalFee: 0, platformShare: 0, riderShare: 0 };
    const fee = calcDeliveryFee(getOrderDistance(o));
    byRider[rId].orders.push(o.id);
    byRider[rId].totalFee += fee.total;
    byRider[rId].platformShare += fee.platform;
    byRider[rId].riderShare += fee.rider;
  });

  let created = 0;
  for (const [riderId, data] of Object.entries(byRider)) {
    const docId = `${today}_${riderId}`;
    if (store.settlements.find(s => s.id === docId)) continue;

    await db.collection('rider_settlements').doc(docId).set({
      riderId, riderName: data.riderName, date: today,
      orderIds: data.orders, orderCount: data.orders.length,
      totalFee: Math.round(data.totalFee * 100) / 100,
      platformShare: Math.round(data.platformShare * 100) / 100,
      riderShare: Math.round(data.riderShare * 100) / 100,
      status: 'pending',
      notifiedAt: null, deadlineAt: null, slipUrl: null, slipUploadedAt: null,
      verifiedAt: null, verifiedBy: null, banUntil: null,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    created++;
  }
  toast(created > 0 ? `✅ สร้างรายการ ${created} รายการ` : 'ℹ️ มีรายการครบแล้ว');
}

async function generateGPSettlements() {
  const cycle = getCurrentGPCycle();
  const completed = store.orders.filter(o => {
    if (o.status !== 'done') return false;
    const d = toDate(o.createdAt);
    return d && d >= cycle.start && d <= cycle.end && o.merchantId;
  });

  const byMerchant = {};
  completed.forEach(o => {
    const mId = o.merchantId;
    const merchant = store.merchants.find(m => m.id === mId);
    if (!merchant) return;
    if (!isMerchantGPActive(merchant)) return;

    const foodAmount = Number(o.foodTotal || o.total || 0) - Number(o.fare || 0);
    const gp = calcGP(foodAmount, merchant);

    if (!byMerchant[mId]) byMerchant[mId] = {
      merchantId: mId, merchantName: merchant.name || 'ไม่ระบุ',
      orders: [], orderCount: 0, foodTotal: 0, gpTotal: 0,
      riderShare: 0, platformShare: 0
    };
    byMerchant[mId].orders.push(o.id);
    byMerchant[mId].orderCount++;
    byMerchant[mId].foodTotal += foodAmount;
    byMerchant[mId].gpTotal += gp.total;
    byMerchant[mId].riderShare += gp.rider;
    byMerchant[mId].platformShare += gp.platform;
  });

  let created = 0;
  for (const [mId, data] of Object.entries(byMerchant)) {
    const docId = `gp_${todayKey()}_${mId}`;
    const existing = store.gpSettlements.find(s => s.merchantId === mId && s.cycleLabel === cycle.label);
    if (existing) continue;

    await db.collection('merchant_gp_settlements').doc(docId).set({
      merchantId: mId,
      merchantName: data.merchantName,
      cycleLabel: cycle.label,
      cycleStart: firebase.firestore.Timestamp.fromDate(cycle.start),
      cycleEnd: firebase.firestore.Timestamp.fromDate(cycle.end),
      orderIds: data.orders, orderCount: data.orderCount,
      foodTotal: Math.round(data.foodTotal * 100) / 100,
      gpTotal: Math.round(data.gpTotal * 100) / 100,
      riderShare: Math.round(data.riderShare * 100) / 100,
      platformShare: Math.round(data.platformShare * 100) / 100,
      status: 'pending',
      notifiedAt: null, deadlineAt: null, slipUrl: null, slipUploadedAt: null,
      verifiedAt: null, verifiedBy: null,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    created++;
  }
  toast(created > 0 ? `✅ สร้าง GP ${created} ร้าน` : 'ℹ️ มีรายการ GP ครบแล้ว');
}

function getCountdownText(deadlineAt) {
  const d = toDate(deadlineAt);
  if (!d) return '—';
  const diff = d - new Date();
  if (diff <= 0) return '⏰ หมดเวลา';
  const min = Math.floor(diff / 60000);
  const sec = Math.floor((diff % 60000) / 1000);
  return `⏰ ${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}

function getCountdownPercent(notifiedAt, deadlineAt) {
  const n = toDate(notifiedAt), d = toDate(deadlineAt);
  if (!n || !d) return 0;
  return Math.max(0, Math.min(100, ((new Date() - n) / (d - n)) * 100));
}

async function handleLogin() {
  const btn = $('btn-login');
  const email = $('em').value.trim().toLowerCase();
  const pw = $('pw').value;
  if (!email || !pw) return toast('กรอกให้ครบ', true);
  btn.disabled = true; btn.textContent = '⏳ ...';
  try {
    await auth.signInWithEmailAndPassword(email, pw);
    toast('✅ สำเร็จ');
  } catch (err) {
    logToScreen(`❌ ${err.code}`, true);
    const msg = err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential' ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง'
      : err.code === 'auth/user-not-found' ? 'ไม่พบบัญชีนี้'
      : err.code === 'auth/too-many-requests' ? 'ลองหลายครั้งเกินไป'
      : 'ล้มเหลว: ' + err.code;
    toast(msg, true);
    btn.disabled = false; btn.textContent = '🔓 เข้าสู่ระบบ';
  }
  $('pw').value = '';
}

async function handleForgot() {
  const email = $('em').value.trim();
  if (!email) return toast('กรอกอีเมลก่อน', true);
  try {
    await auth.sendPasswordResetEmail(email);
    toast('📧 ส่งลิงก์รีเซ็ตแล้ว');
  } catch (e) { toast('ส่งไม่สำเร็จ', true); }
}

async function handleLogout() {
  showConfirm('ออกจากระบบ', 'ต้องการออกจากระบบ?', '🚪', async () => {
    stop(); await auth.signOut();
  });
}

auth.onAuthStateChanged(async user => {
  stop();
  if (!user) {
    $('login').classList.remove('hidden');
    $('app').classList.add('hidden');
    return;
  }
  const email = (user.email || '').toLowerCase().trim();
  const isMaster = MASTER_ADMINS.some(e => e.toLowerCase() === email);
  if (!isMaster) {
    try {
      const snap = await db.collection('admins').doc(user.uid).get();
      const ok = snap.exists && ['active', 'super', 'admin'].includes(snap.data().role);
      if (!ok) { toast('ไม่มีสิทธิ์', true); await auth.signOut(); return; }
    } catch (e) {
      if (e.code === 'permission-denied') { toast('ไม่มีสิทธิ์', true); await auth.signOut(); return; }
    }
  }
  $('who').textContent = user.email;
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  start();
});

// ═══════════════════════════════════════════════════════════════════
//  📡 SUBSCRIBE
// ═══════════════════════════════════════════════════════════════════
function start() {
  const cols = ['merchants', 'orders', 'riders', 'users', 'chats'];
  for (const k of cols) {
    const unsub = db.collection(k).onSnapshot(s => {
      store[k] = s.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, err => logToScreen(`❌ [${k}] ${err.code}`, true));
    unsubs.push(unsub);
  }
  // rider_settlements
  unsubs.push(db.collection('rider_settlements').onSnapshot(s => {
    store.settlements = s.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => logToScreen(`❌ [settlements] ${err.code}`, true)));
  // merchant_gp_settlements
  unsubs.push(db.collection('merchant_gp_settlements').onSnapshot(s => {
    store.gpSettlements = s.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => logToScreen(`❌ [gp] ${err.code}`, true)));

  renderNav(); render();
  setInterval(checkOverdueSettlements, 30000);
  if (countdownInterval) clearInterval(countdownInterval);
  countdownInterval = setInterval(() => {
    if (current === 'settlements') {
      document.querySelectorAll('.countdown-display').forEach(el => {
        const d = toDate(el.dataset.deadline);
        if (!d) return;
        const diff = d - new Date();
        if (diff <= 0) { el.textContent = '⏰ หมดเวลา'; el.classList.add('expired'); }
        else {
          const min = Math.floor(diff / 60000), sec = Math.floor((diff % 60000) / 1000);
          el.textContent = `⏰ ${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
          if (diff < 10 * 60000) el.classList.add('urgent');
        }
      });
      document.querySelectorAll('.settlement-progress-fill').forEach(el => {
        if (el.dataset.notified && el.dataset.deadline) {
          el.style.width = getCountdownPercent(el.dataset.notified, el.dataset.deadline) + '%';
        }
      });
    }
  }, 1000);
}

function stop() {
  unsubs.forEach(u => u()); unsubs = [];
  if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
  for (const k in store) store[k] = [];
}

function getBadgeCounts() {
  const pendingMerchants = store.merchants.filter(m => !m.verified).length;
  const pendingRiders = store.riders.filter(r => r.verified === false).length;
  const newOrders = store.orders.filter(o => ['searching','pending'].includes(o.status)).length;
  const unreadChats = store.chats.reduce((s, c) => s + (c.unreadAdmin || 0), 0);
  const pendingSettle = store.settlements.filter(s => ['pending','notified','overdue'].includes(s.status)).length;
  const pendingGP = store.gpSettlements.filter(s => ['pending','notified','overdue'].includes(s.status)).length;
  return { pendingMerchants, pendingRiders, newOrders, unreadChats, pendingSettle, pendingGP };
}

function renderNav() {
  const b = getBadgeCounts();
  $('nav').innerHTML = SECTIONS.map(([k, icon, label]) => {
    let badge = '';
    if (k === 'merchants' && b.pendingMerchants > 0) badge = `<span class="nav-badge">${b.pendingMerchants}</span>`;
    else if (k === 'riders' && b.pendingRiders > 0) badge = `<span class="nav-badge">${b.pendingRiders}</span>`;
    else if (k === 'orders' && b.newOrders > 0) badge = `<span class="nav-badge">${b.newOrders}</span>`;
    else if (k === 'chats' && b.unreadChats > 0) badge = `<span class="nav-badge">${b.unreadChats}</span>`;
    else if (k === 'settlements' && b.pendingSettle > 0) badge = `<span class="nav-badge">${b.pendingSettle}</span>`;
    else if (k === 'gp' && b.pendingGP > 0) badge = `<span class="nav-badge">${b.pendingGP}</span>`;
    return `<button class="${k === current ? 'on' : ''}" data-go="${k}">
      ${badge}<div class="nav-icon">${icon}</div><div class="nav-label">${label}</div>
    </button>`;
  }).join('');
}

function render() {
  const fn = { dashboard, settlements, gp, chats, merchants, orders, riders, users }[current];
  if (fn) $('main').innerHTML = fn();
  renderNav();
}

function searchInput(ph) {
  return `<div class="search-box"><span style="font-size:18px;opacity:.5">🔍</span><input id="q" placeholder="${ph}" value="${esc(filters.q)}"></div>`;

function settlements() {

  list.sort((a, b) => ts(b) - ts(a));

  const pending = store.settlements.filter(s => s.status === 'pending').length;
  const notified = store.settlements.filter(s => s.status === 'notified').length;
  const paid = store.settlements.filter(s => s.status === 'paid').length;
  const overdue = store.settlements.filter(s => s.status === 'overdue').length;
  const banned = store.settlements.filter(s => s.status === 'banned').length;
  const todayStr = todayKey();
  const todayPaid = store.settlements.filter(s => s.status === 'paid' && s.date === todayStr).reduce((s, x) => s + Number(x.platformShare || 0), 0);
  const totalPending = store.settlements.filter(s => ['pending','notified','overdue'].includes(s.status)).reduce((s, x) => s + Number(x.platformShare || 0), 0);

          <button class="pri" style="flex:1" data-verify-slip="${esc(s.id)}">✅ ยืนยันสลิป</button>

      <div class="data-card-actions" style="margin-top:10px">
        ${actions}
        <button class="sec" data-view-settle="${esc(s.id)}">🔍 ดู</button>
      </div>
    </div>`;
  }).join('');

  return `<h2 style="font-weight:900;font-size:18px;margin-bottom:12px">🛵 ค่าบริการ (รายวัน)</h2>${summary}${info}${filterBar}${cards}`;

// ═══════════════════════════════════════════════════════════════════
function gp() {
  const st = filters.gpStatus;
  let list = [...store.gpSettlements];
  if (st !== 'all') list = list.filter(s => s.status === st);
  list.sort((a, b) => ts(b) - ts(a));

  const pending = store.gpSettlements.filter(s => s.status === 'pending').length;
  const notified = store.gpSettlements.filter(s => s.status === 'notified').length;
  const paid = store.gpSettlements.filter(s => s.status === 'paid').length;
  const overdue = store.gpSettlements.filter(s => s.status === 'overdue').length;
  const totalPending = store.gpSettlements.filter(s => ['pending','notified','overdue'].includes(s.status)).reduce((s, x) => s + Number(x.platformShare || 0), 0);
  const totalPaid = store.gpSettlements.filter(s => s.status === 'paid').reduce((s, x) => s + Number(x.platformShare || 0), 0);
  const cycle = getCurrentGPCycle();

  const summary = `<div class="stat-grid">
    <div class="stat-card gold"><div class="stat-icon">💰</div><div class="stat-value">฿${totalPaid.toFixed(0)}</div><div class="stat-label">รับแล้ว</div><div class="stat-sub">1% ของยอดอาหาร</div></div>
    <div class="stat-card ${totalPending > 0 ? 'red' : 'green'}"><div class="stat-icon">⏳</div><div class="stat-value">฿${totalPending.toFixed(0)}</div><div class="stat-label">ค้างรับ</div><div class="stat-sub">${pending + notified + overdue} ร้าน</div></div>
    <div class="stat-card blue"><div class="stat-icon">✅</div><div class="stat-value">${paid}</div><div class="stat-label">จ่ายแล้ว</div></div>
    <div class="stat-card purple"><div class="stat-icon">🔄</div><div class="stat-value">${cycle.label}</div><div class="stat-label">รอบปัจจุบัน</div></div>
  </div>`;

  const info = `<div class="info-box gp">
    <div class="info-title">💰 GP ร้านค้า (ทุก 2 สัปดาห์)</div>
    <div class="info-line">
      • เริ่มนับ <b>60 วัน</b> หลังร้านสมัคร<br>
      • GP <b>3%</b> ของยอดอาหาร<br>
      • 🛵 ไรเดอร์ได้ <b>2%</b><br>
      • 🏢 แพลตฟอร์มได้ <b>1%</b><br>
      • รอบ: วันที่ <b>1-14</b> และ <b>15-สิ้นเดือน</b>
    </div>
  </div>
  <button class="gold big" onclick="generateGPSettlements()" style="margin-bottom:12px">➕ สร้างรายการ GP รอบนี้</button>`;

  const filterBar = `<div class="filter-bar">
    <button class="filter-chip ${st === 'all' ? 'active' : ''}" data-gp-filter="all">📋 (${store.gpSettlements.length})</button>
    <button class="filter-chip ${st === 'pending' ? 'active' : ''}" data-gp-filter="pending">⏳ (${pending})</button>
    <button class="filter-chip ${st === 'notified' ? 'active' : ''}" data-gp-filter="notified">🔔 (${notified})</button>
    <button class="filter-chip ${st === 'paid' ? 'active' : ''}" data-gp-filter="paid">✅ (${paid})</button>
    <button class="filter-chip ${st === 'overdue' ? 'active' : ''}" data-gp-filter="overdue">❌ (${overdue})</button>
  </div>`;

  if (list.length === 0) {
    return `<h2 style="font-weight:900;font-size:18px;margin-bottom:12px">💰 GP ร้านค้า</h2>${summary}${info}${filterBar}<div class="empty">📭 ไม่มีรายการ GP</div>`;
  }

  const cards = list.map(s => {
    const isNotified = s.status === 'notified';
    const isPaid = s.status === 'paid';
    const isPending = s.status === 'pending';
    const isOverdue = s.status === 'overdue';
    let cls = 'status-gp';
    if (isNotified) cls = 'status-notified';
    else if (isPaid) cls = 'status-paid';
    else if (isOverdue) cls = 'status-overdue';

    const slipImg = s.slipUrl ? `<img src="${esc(s.slipUrl)}" class="slip-preview-img" onclick="window.open('${esc(s.slipUrl)}','_blank')">` : '';

    let actions = '';
    if (isPending) actions = `<button class="warn" data-notify-gp="${esc(s.id)}">🔔 แจ้งเตือน</button>`;
    else if (isNotified) actions = `<button class="warn" data-notify-gp="${esc(s.id)}">🔔 แจ้งซ้ำ</button>`;
    else if (isPaid) actions = `<span class="tag">✅ ${esc(s.verifiedBy || 'admin')}</span>`;

    return `<div class="settlement-card ${cls}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:900;font-size:15px">🏪 ${esc(s.merchantName)}</div>
          <div style="font-size:11px;color:var(--mut);font-weight:700;margin-top:4px">🔄 รอบ ${esc(s.cycleLabel || '')} • ${s.orderCount || 0} ออเดอร์</div>
        </div>
        <span class="settlement-status-badge ${isPaid ? 'paid' : isNotified ? 'notified' : isOverdue ? 'overdue' : 'pending'}">${GP_STATUS[s.status] || s.status}</span>
      </div>
      <div style="background:#FFF8E1;border-radius:12px;padding:12px;margin-top:12px;font-size:13px;font-weight:700">
        <div style="display:flex;justify-content:space-between;padding:4px 0"><span>🍽️ ยอดอาหาร</span><span>฿${Number(s.foodTotal || 0).toFixed(2)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0"><span>💰 GP 3% รวม</span><span style="color:var(--gold)">฿${Number(s.gpTotal || 0).toFixed(2)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0"><span style="padding-left:14px">🛵 ไรเดอร์ 2%</span><span style="color:#FF6B35">฿${Number(s.riderShare || 0).toFixed(2)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0"><span style="padding-left:14px">🏢 แพลตฟอร์ม 1%</span><span style="color:#1565C0">฿${Number(s.platformShare || 0).toFixed(2)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0;border-top:2px solid var(--gold);margin-top:6px;padding-top:8px;font-size:15px"><span>💰 ร้านโอน</span><span style="color:var(--gold);font-weight:900">฿${Number(s.platformShare || 0).toFixed(2)}</span></div>
      </div>
      ${slipImg}
      ${s.slipUrl && isNotified ? `
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="pri" style="flex:1" data-verify-gp-slip="${esc(s.id)}">✅ ยืนยันสลิป GP</button>
          <button class="dan" style="flex:1" data-reject-gp-slip="${esc(s.id)}">❌ ปฏิเสธ</button>
        </div>` : ''}
      <div class="data-card-actions" style="margin-top:10px">
        ${actions}
        <button class="sec" data-view-gp="${esc(s.id)}">🔍 ดู</button>
      </div>
    </div>`;
  }).join('');

  return `<h2 style="font-weight:900;font-size:18px;margin-bottom:12px">💰 GP ร้านค้า (ทุก 2 สัปดาห์)</h2>${summary}${info}${filterBar}${cards}`;
}

// ═══════════════════════════════════════════════════════════════════
//  💬 CHAT
// ═══════════════════════════════════════════════════════════════════
function chats() {
  const list = [...store.chats].sort((a, b) => ts(b) - ts(a));
  if (list.length === 0) return `<div class="empty"><div style="font-size:48px;margin-bottom:8px">💬</div><div style="font-weight:800;font-size:15px">ยังไม่มีการสนทนา</div></div>`;
  return list.map(c => {
    const title = c.participants?.map(p => p.name).join(' ↔ ') || 'การสนทนา';
    const unread = c.unreadAdmin || 0;
    const icon = c.type === 'settlement' ? '🛵' : c.type === 'gp' ? '💰' : '💬';
    return `<div class="chat-list-item" data-chat="${esc(c.id)}">
      <div class="avatar">${icon}</div>
      <div class="chat-info">
        <div class="chat-title">${esc(title)}</div>
        <div class="chat-preview">${esc((c.lastMessage || '—').substring(0, 50))}</div>
      </div>
      <div class="chat-meta">
        <div class="chat-time">${fmtTimeShort(c.lastMessageAt || c.createdAt)}</div>
        ${unread > 0 ? `<div class="chat-unread">${unread}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function openChat(chatId) {
  activeChatId = chatId;
  const c = store.chats.find(x => x.id === chatId);
  if (!c) return;
  $('chat-name').textContent = c.participants?.map(p => p.name).join(' ↔ ') || 'แชท';
  $('chat-sub').textContent = c.type === 'settlement' ? '🛵 ค่าบริการ' : c.type === 'gp' ? '💰 GP ร้านค้า' : 'แชท';
  $('chat-container').classList.add('show');
  $('chat-input').value = '';
  if (c.unreadAdmin > 0) db.collection('chats').doc(chatId).update({ unreadAdmin: 0 }).catch(() => {});
  if (activeChatUnsub) activeChatUnsub();
  activeChatUnsub = db.collection('chats').doc(chatId).collection('messages')
    .orderBy('createdAt', 'asc').limitToLast(100)
    .onSnapshot(snap => renderChatMessages(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
}

function closeChat() {
  $('chat-container').classList.remove('show');
  if (activeChatUnsub) { activeChatUnsub(); activeChatUnsub = null; }
  activeChatId = null;
}

function renderChatMessages(msgs) {
  if (msgs.length === 0) {
    $('chat-messages').innerHTML = '<div style="text-align:center;padding:40px;color:#999">เริ่มสนทนาได้เลย</div>';
    return;
  }
  const html = msgs.map(m => {
    const isAdmin = m.senderRole === 'admin';
    const isSystem = m.type === 'system';
    const cls = isSystem ? 'system' : (isAdmin ? 'out' : 'in');
    const senderName = !isAdmin && !isSystem && m.senderName ? `<div style="font-size:10px;font-weight:900;opacity:.8;margin-bottom:4px">${esc(m.senderName)}</div>` : '';
    let content = '';
    if (m.imageUrl) content += `<img src="${esc(m.imageUrl)}" class="msg-image${m.type === 'slip' ? ' msg-slip' : ''}" onclick="window.open('${esc(m.imageUrl)}','_blank')">`;
    if (m.text) content += `<div style="white-space:pre-wrap">${esc(m.text)}</div>`;
    return `<div class="chat-msg ${cls}">${senderName}${content}<div class="msg-time">${fmtTimeShort(m.createdAt)}</div></div>`;
  }).join('');
  $('chat-messages').innerHTML = html;
  setTimeout(() => { $('chat-messages').scrollTop = $('chat-messages').scrollHeight; }, 50);
}

async function sendChatText() {
  const text = $('chat-input').value.trim();
  if (!text || !activeChatId) return;
  $('chat-input').value = '';
  try {
    await db.collection('chats').doc(activeChatId).collection('messages').add({
      text, senderRole: 'admin', senderName: 'Admin',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('chats').doc(activeChatId).update({
      lastMessage: `[Admin] ${text}`,
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) { toast('ไม่สำเร็จ', true); }
}

function pickChatImage() { const i = $('chat-image-input'); i.onchange = e => sendChatImage(e.target.files[0], false); i.click(); }
function pickChatSlip() { const i = $('chat-slip-input'); i.onchange = e => sendChatImage(e.target.files[0], true); i.click(); }

async function sendChatImage(file, isSlip) {
  if (!file || !activeChatId) return;
  if (file.size > 5 * 1024 * 1024) return toast('เกิน 5MB', true);
  toast('⏳ กำลังอัปโหลด...');
  try {
    const path = `chats/${activeChatId}/${isSlip ? 'slips' : 'images'}/${Date.now()}.jpg`;
    const ref = storage.ref(path);
    await ref.put(file);
    const url = await ref.getDownloadURL();
    await db.collection('chats').doc(activeChatId).collection('messages').add({
      imageUrl: url, type: isSlip ? 'slip' : 'image',
      senderRole: 'admin', senderName: 'Admin',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('chats').doc(activeChatId).update({
      lastMessage: `[Admin] ${isSlip ? '🧾 สลิป' : '📷 รูป'}`,
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('✅ ส่งแล้ว');
  } catch (e) { toast('ไม่สำเร็จ', true); }
}

function merchants() {
  const q = filters.q.toLowerCase(), st = filters.merchantStatus;
  const list = store.merchants.filter(m => {
    const mQ = !q || String(m.name || '').toLowerCase().includes(q);
    const mS = st === 'all' || (st === 'pending' && !m.verified) || (st === 'verified' && m.verified);
    return mQ && mS;
  });
  const pendingCount = store.merchants.filter(m => !m.verified).length;
  const verifiedCount = store.merchants.length - pendingCount;
  const filterBar = `<div class="filter-bar">
    <button class="filter-chip ${st === 'all' ? 'active' : ''}" data-mfilter="all">📋 (${store.merchants.length})</button>

    <button class="filter-chip ${st === 'verified' ? 'active' : ''}" data-mfilter="verified">✅ (${verifiedCount})</button>
  </div>`;

  return filterBar + searchInput('ค้นหาร้านค้า...') + (list.map(m => {
    const active = isMerchantGPActive(m);
    const daysLeft = getDaysLeftGP(m);
    return `<div class="data-card">
      <div class="data-card-header">
        <div class="data-card-icon" style="background:#E8F5E9">🏪</div>

          <div class="data-card-name">${esc(m.name || 'ไม่ระบุ')}</div>
          <div class="data-card-meta">📞 ${esc(m.phone || '—')} • ⭐ ${esc(m.rating || 0)}</div>
          <div class="data-card-meta">สมัคร ${fmtDate(m.createdAt || m.gpAcceptedAt)}</div>
        </div>
        <span class="tag ${m.verified ? '' : 'w'}">${m.verified ? '✅' : '⏳'}</span>
      </div>
      <div style="margin-top:4px">
        <span class="tag ${active ? 'd' : ''}">${active ? '💰 จ่าย GP 3%' : `🎁 ฟรี GP (${daysLeft} วัน)`}</span>
      </div>
      <div class="data-card-actions">
        <button class="${m.verified ? 'dan' : 'pri'}" data-verify-m="${esc(m.id)}">${m.verified ? '🚫 ยกเลิก' : '✅ อนุมัติ'}</button>
        <button class="blue" data-reset-gp="${esc(m.id)}">🔄 รีเซ็ต GP</button>
        <button class="dan" data-del="merchants:${esc(m.id)}">🗑️</button>
      </div>
    </div>`;
  }).join('') || '<div class="empty">ไม่พบร้านค้า</div>');

      <div class="data-card-header">
        <div class="data-card-icon" style="background:#E3F2FD">📋</div>
        <div class="data-card-info">
          <div class="data-card-name">${esc(o.title || 'ออเดอร์')}</div>
          <div class="data-card-meta">🍽️ ฿${food.toFixed(2)} • 🛵 ฿${fee.total.toFixed(2)}</div>
          <div class="data-card-meta">🕐 ${fmtTime(o.createdAt)}</div>
        </div>
        <span class="tag ${o.status === 'done' ? '' : o.status === 'cancelled' ? 'x' : 'w'}">${esc(STATUS[o.status] || o.status)}</span>
      </div>
    </div>`;
  }).join('') || '<div class="empty">ไม่พบออเดอร์</div>');
}

function riders() {
  const q = filters.q.toLowerCase();
  const verifiedCount = store.riders.filter(r => r.verified !== false).length;
  const pendingCount = store.riders.filter(r => r.verified === false).length;
  const bannedCount = store.riders.filter(r => r.banned).length;
  const filterBar = `<div class="filter-bar">
    <button class="filter-chip ${filters.riderStatus === '' ? 'active' : ''}" data-rfilter="">📋 (${store.riders.length})</button>
    <button class="filter-chip ${filters.riderStatus === 'pending' ? 'active' : ''}" data-rfilter="pending">⏳ (${pendingCount})</button>
    <button class="filter-chip ${filters.riderStatus === 'verified' ? 'active' : ''}" data-rfilter="verified">✅ (${verifiedCount})</button>
    <button class="filter-chip ${filters.riderStatus === 'banned' ? 'active' : ''}" data-rfilter="banned">🚫 (${bannedCount})</button>
  </div>`;
  const filteredList = store.riders.filter(r => {
    const mQ = !q || String(r.name || '').toLowerCase().includes(q);
    if (filters.riderStatus === 'pending') return mQ && r.verified === false;
    if (filters.riderStatus === 'verified') return mQ && r.verified !== false && !r.banned;
    if (filters.riderStatus === 'banned') return mQ && r.banned;
    return mQ;
  });
  return filterBar + searchInput('ค้นหาไรเดอร์...') + (filteredList.map(r => {
    const verified = r.verified !== false;
    const banned = r.banned === true;
    const banUntil = r.banUntil ? toDate(r.banUntil) : null;
    const banText = banned && banUntil ? `🚫 แบนถึง ${fmtDate(r.banUntil)}` : '';
    return `<div class="data-card" style="${banned ? 'border-left:4px solid #C62828' : ''}">
      <div class="data-card-header">
        <div class="data-card-icon" style="background:${banned ? '#FFCDD2' : '#E8F5E9'}">${banned ? '🚫' : '🛵'}</div>
        <div class="data-card-info">
          <div class="data-card-name">${esc(r.name || 'ไม่ระบุ')}</div>
          <div class="data-card-meta">📞 ${esc(r.phone || '—')} • ⭐ ${esc(r.rating || 0)}</div>
          ${banText ? `<div class="data-card-meta" style="color:#C62828;font-weight:900">${esc(banText)}</div>` : ''}
        </div>
        <span class="tag ${banned ? 'ban' : (verified ? '' : 'w')}">${banned ? '🚫' : (verified ? '✅' : '⏳')}</span>
      </div>
      <div class="data-card-actions">
        ${banned
          ? `<button class="pri" data-unban="${esc(r.id)}">✅ ปลดแบน</button>`
          : `<button class="${verified ? 'dan' : 'pri'}" data-verify-r="${esc(r.id)}">${verified ? '🚫 ยกเลิก' : '✅ อนุมัติ'}</button>`}
        <button class="dan" data-del="riders:${esc(r.id)}">🗑️</button>
      </div>
    </div>`;
  }).join('') || '<div class="empty">ไม่พบไรเดอร์</div>');
}

function users() {
  const q = filters.q.toLowerCase();
  const list = store.users.filter(u => !q || [u.name, u.email, u.phone].some(v => String(v || '').toLowerCase().includes(q)));
  return searchInput('ค้นหาผู้ใช้...') + (list.map(u => `
    <div class="data-card">
      <div class="data-card-header">
        <div class="data-card-icon" style="background:#E3F2FD">👤</div>
        <div class="data-card-info">
          <div class="data-card-name">${esc(u.name || 'ไม่ระบุ')}</div>
          <div class="data-card-meta">📧 ${esc(u.email || '—')}</div>
          <div class="data-card-meta">📞 ${esc(u.phone || '—')} • ${esc(u.role || 'user')}</div>
        </div>
      </div>
      <div class="data-card-actions">
        <button class="dan" data-del="users:${esc(u.id)}">🗑️ ลบ</button>
      </div>
    </div>`).join('') || '<div class="empty">ไม่พบผู้ใช้</div>');
}

// ═══════════════════════════════════════════════════════════════════
//  MODAL & ORDER DETAIL
// ═══════════════════════════════════════════════════════════════════
function openModal(t, h) { $('modal-title').textContent = t; $('modal-body').innerHTML = h; $('modal-overlay').classList.add('show'); }
function closeModal() { $('modal-overlay').classList.remove('show'); }

function orderDetail(id) {
  const o = store.orders.find(x => x.id === id);
  if (!o) return;
  const opts = Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${o.status === k ? 'selected' : ''}>${v}</option>`).join('');
  const km = getOrderDistance(o);
  const fee = calcDeliveryFee(km);
  const food = Number(o.foodTotal || o.total || 0) - Number(o.fare || 0);
  const merchant = store.merchants.find(m => m.id === o.merchantId);
  const gp = merchant ? calcGP(food, merchant) : { total: 0, rider: 0, platform: 0, free: true };

  openModal('📋 ออเดอร์', `
    <div style="font-size:11px;color:var(--mut);font-family:monospace">ID: ${esc(o.id)}</div>
    <div style="font-weight:900;font-size:18px;margin:8px 0">${esc(o.title || '')}</div>
    <div style="font-size:12px;background:#f8f9fa;padding:12px;border-radius:10px;white-space:pre-wrap">${esc(itemsText(o.items))}</div>
    <div style="font-size:12px;margin-top:12px">👤 ${esc(o.userName || '')} • ${esc(o.userPhone || '')}</div>
    <div style="font-size:12px">📍 ${esc(o.address || '')}</div>
    <div style="background:#E8F5E9;padding:12px;border-radius:10px;font-size:12px;font-weight:700;color:#2E7D32;margin-top:12px">
      🍽️ ยอดอาหาร (ร้านค้าได้ 100%): <b>฿${food.toFixed(2)}</b>
    </div>
    <div style="background:#E3F2FD;padding:12px;border-radius:10px;font-size:12px;font-weight:700;color:#1565C0;margin-top:8px">
      🛵 ค่าบริการ: <b>฿${fee.total.toFixed(2)}</b> (${km.toFixed(2)} กม.)<br>
      🛵 ไรเดอร์ได้ 80%: ฿${fee.rider.toFixed(2)}<br>
      🏢 แพลตฟอร์มได้ 20%: ฿${fee.platform.toFixed(2)}
    </div>
    ${!gp.free ? `<div style="background:#FFF3E0;padding:12px;border-radius:10px;font-size:12px;font-weight:700;color:var(--warn);margin-top:8px">
      💰 GP 3%: ฿${gp.total.toFixed(2)} (🛵 2%: ฿${gp.rider.toFixed(2)} / 🏢 1%: ฿${gp.platform.toFixed(2)})
    </div>` : ''}
    <div style="margin-top:16px;padding-top:12px;border-top:1px solid #eee;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
      <select id="ostatus" data-oid="${esc(o.id)}" style="width:auto;padding:12px;min-height:48px">${opts}</select>
    </div>
    <button class="dan big" style="margin-top:16px" data-cancel-order="${esc(o.id)}">❌ ยกเลิกออเดอร์</button>
  `);
}

// ═══════════════════════════════════════════════════════════════════
//  🎯 EVENTS
// ═══════════════════════════════════════════════════════════════════
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-go],[data-order],[data-verify-m],[data-verify-r],[data-del],[data-mfilter],[data-rfilter],[data-chat],[data-cancel-order],[data-settle-filter],[data-gp-filter],[data-notify],[data-notify-gp],[data-ban],[data-unban],[data-verify-slip],[data-reject-slip],[data-verify-gp-slip],[data-reject-gp-slip],[data-view-settle],[data-view-gp],[data-reset-gp]');
  if (!t) return;
  try {
    if (t.dataset.go) { current = t.dataset.go; filters.q = ''; render(); window.scrollTo(0, 0); return; }
    if (t.hasAttribute('data-mfilter')) { filters.merchantStatus = t.dataset.mfilter; render(); return; }
    if (t.hasAttribute('data-rfilter')) { filters.riderStatus = t.dataset.rfilter; render(); return; }
    if (t.hasAttribute('data-settle-filter')) { filters.settleStatus = t.dataset.settleFilter; render(); return; }
    if (t.hasAttribute('data-gp-filter')) { filters.gpStatus = t.dataset.gpFilter; render(); return; }
    if (t.dataset.chat) { openChat(t.dataset.chat); return; }
    if (t.dataset.order) { orderDetail(t.dataset.order); return; }
    if (t.dataset.viewSettle) { showSettlementDetail(t.dataset.viewSettle); return; }
    if (t.dataset.viewGp) { showGPDetail(t.dataset.viewGp); return; }

    if (t.dataset.notify) { await notifyRider(t.dataset.notify); return; }
    if (t.dataset.notifyGp) { await notifyMerchantGP(t.dataset.notifyGp); return; }
    if (t.dataset.ban) { await banRider(t.dataset.ban); return; }
    if (t.dataset.unban) { await unbanRider(t.dataset.unban); return; }
    if (t.dataset.verifySlip) { await verifySlip(t.dataset.verifySlip); return; }
    if (t.dataset.verifyGpSlip) { await verifyGPSlip(t.dataset.verifyGpSlip); return; }

    if (t.dataset.rejectSlip) {
      showConfirm('ปฏิเสธสลิป', 'ปฏิเสธสลิปนี้?', '❌', async () => {
        await db.collection('rider_settlements').doc(t.dataset.rejectSlip).update({ slipUrl: null, status: 'notified' });
        toast('❌ ปฏิเสธแล้ว'); closeModal();
      });
      return;
    }
    if (t.dataset.rejectGpSlip) {
      showConfirm('ปฏิเสธสลิป GP', 'ปฏิเสธสลิป GP นี้?', '❌', async () => {
        await db.collection('merchant_gp_settlements').doc(t.dataset.rejectGpSlip).update({ slipUrl: null, status: 'notified' });
        toast('❌ ปฏิเสธแล้ว'); closeModal();
      });
      return;
    }

    if (t.dataset.verifyM) {
      const m = store.merchants.find(x => x.id === t.dataset.verifyM);
      if (!m) return;
      await db.collection('merchants').doc(m.id).update({ verified: !m.verified, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      toast('✅ อัปเดต');
      return;
    }
    if (t.dataset.verifyR) {
      const r = store.riders.find(x => x.id === t.dataset.verifyR);
      if (!r) return;
      const nv = r.verified === false;
      await db.collection('riders').doc(r.id).update({ verified: nv, verifiedAt: nv ? firebase.firestore.FieldValue.serverTimestamp() : null });
      toast(nv ? '✅ อนุมัติ' : '🚫 ยกเลิก');
      return;
    }
    if (t.dataset.resetGp) {
      showConfirm('รีเซ็ต GP', 'ร้านจะได้ฟรี GP อีก 60 วัน?', '🔄', async () => {
        await db.collection('merchants').doc(t.dataset.resetGp).update({
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          gpAcceptedAt: firebase.firestore.FieldValue.serverTimestamp(),
          gpResetAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        toast('🔄 รีเซ็ตแล้ว');
      });
      return;
    }
    if (t.dataset.cancelOrder) {
      showConfirm('ยกเลิกออเดอร์', 'ยืนยันยกเลิก?', '❌', async () => {
        await db.collection('orders').doc(t.dataset.cancelOrder).update({ status: 'cancelled', updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        toast('ยกเลิกแล้ว'); closeModal();
      });
      return;
    }
    if (t.dataset.del) {
      const [col, id] = t.dataset.del.split(':');
      showConfirm('ยืนยันลบ', 'ลบไม่สามารถกู้คืนได้', '🗑️', async () => {
        await db.collection(col).doc(id).delete();
        toast('ลบแล้ว');
      });
      return;
    }
  } catch (err) { console.error(err); toast('ไม่สำเร็จ: ' + (err.message || err.code), true); }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    filters.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const q = $('q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); }
  }
});

document.addEventListener('change', async e => {
  if (e.target.id === 'ofilter') { filters.orders = e.target.value; render(); }
  if (e.target.id === 'ostatus') {
    await db.collection('orders').doc(e.target.dataset.oid).update({ status: e.target.value, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    toast('✅ อัปเดต'); closeModal();
  }
});

$('modal-overlay').addEventListener('click', e => { if (e.target === $('modal-overlay')) closeModal(); });
$('confirm-overlay').addEventListener('click', e => { if (e.target === $('confirm-overlay')) closeConfirm(); });
$('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatText(); } });
