<!DOCTYPE html>
<html>
<head><title>Test Firebase</title></head>
<body>
    <div id="debugConsole" style="background:black; color:lime; padding:10px; font-family:monospace; min-height:100px;">
        Starting test...<br>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ⚠️ วาง Config ของคุณตรงนี้
        const firebaseConfig = {
            apiKey: "AIzaSyB6PnikectfjjYfvO7VhpuxEIXQdJeASBM",
            authDomain: "chauat-go-b9841.firebaseapp.com",
            projectId: "chauat-go-b9841",
            storageBucket: "chauat-go-b9841.firebasestorage.app",
            messagingSenderId: "282197694521",
            appId: "1:282197694521:web:0528c22747a0c04bd815e8"
        };

        const log = (msg) => {
            document.getElementById('debugConsole').innerHTML += msg + '<br>';
            console.log(msg);
        };

        log("1. เริ่มต้น initializeApp...");
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        log("2. เชื่อมต่อ Firebase สำเร็จ");

        onAuthStateChanged(auth, (user) => {
            if (user) {
                log("3. ✅ ล็อกอินแล้ว UID: " + user.uid);
                log("4. กำลังจะโหลดหน้าถัดไป...");
            } else {
                log("3. ⛔ ยังไม่ได้ล็อกอิน (ต้องไปล็อกอินก่อน)");
            }
        });
    </script>
</body>
</html>
